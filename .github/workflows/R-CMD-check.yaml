on:
  push:
    branches: [main, master]
    paths: &r-cmd-check-paths
      - 'R/EDI/**/*.R'
      - 'R/EDI/**/*.Rd'
      - 'R/EDI/**/*.cpp'
      - 'R/EDI/**/*.h'
      - 'R/EDI/**/*.hpp'
      - 'R/EDI/DESCRIPTION'
      - 'R/EDI/NAMESPACE'
      - 'R/EDI/configure'
      - 'R/EDI/configure.win'
      - 'R/EDI/src/Makevars'
      - 'R/EDI/src/Makevars.win'
      - '.github/workflows/R-CMD-check.yaml'
  pull_request:
    branches: [main, master]
    paths: *r-cmd-check-paths

name: R-CMD-check

# Standard CRAN-style check matrix for the EDI R package (see
# R/EDI/DESCRIPTION). This repo also holds an unrelated Python-bindings
# subproject (python/, checked by build-wheels.yml) and paper-reproduction
# code -- every step below is pointed at working-directory: R/EDI
# accordingly, since R/EDI/DESCRIPTION isn't at the repo root.
#
# EDI links against RcppEigen/RcppNumerical (see LinkingTo in
# R/EDI/DESCRIPTION) and compiles a large src/ tree of C++ kernels, so this
# is a real compiled-package check, not just a lint pass -- worth running
# across the full macOS/Windows/Linux x devel/release/oldrel-1 matrix to
# catch platform-specific compiler differences (MSVC vs. clang vs. gcc)
# that a single-OS check would miss. Runs with --as-cran (see the check step's
# `args:`) so CRAN-style checks (portable Makevars, Rd correctness, etc.) are
# enforced, not just a plain build+install.
#
# The `paths:` filter above only triggers this on pushes/PRs that touch R,
# Rd, or C++ sources (or the build-critical DESCRIPTION/NAMESPACE/configure/
# Makevars files, or this workflow itself) -- cosmetic changes (docs/*.md,
# R/benchmark/ scripts, the python/ subproject, R/package_metadata/ python
# integration scripts, etc.) don't spend CI minutes on a full compiled-package
# matrix build.
#
# Five jobs, covering what CRAN's own incoming checks do beyond a single
# --as-cran run on one machine:
#   - R-CMD-check:              the 6-platform/R-version --as-cran matrix
#     (added windows-latest/devel 2026-08-25 to close the "Windows +
#     R-devel" gap that GitHub's runners otherwise leave uncovered -- this
#     is the one platform/R-version combination win-builder's devel run
#     exercises that nothing else in this matrix did; it is still not a
#     substitute for actually submitting to win-builder/CRAN's own build
#     machine before release, see release_v1_0_0.md's Release Gate).
#   - R-CMD-check-no-suggests:  same check with none of EDI's Suggests
#     packages installed (dependencies: NA), to catch an unconditional use of
#     an optional package that isn't properly guarded by requireNamespace()/
#     skip_if_not_installed() -- the main matrix always has every Suggests
#     package present, so it can't see this class of bug.
#   - R-CMD-check-incoming:     same --as-cran check with CRAN's "incoming
#     feasibility" checks left enabled (every other job disables them so the
#     unavoidable "New submission" NOTE doesn't fail every run) -- catches
#     Title/Description phrasing policy, misspellings, URL validity, and
#     license-text issues on every push, added 2026-08-25 (see
#     release_v1_0_0.md's Release Gate). Metadata-based, not platform-
#     sensitive, so one Linux job is sufficient; still not a substitute for
#     actually submitting to win-builder/mac-builder, which additionally run
#     on CRAN's own build machines.
#   - R-CMD-check-sanitizers:   R-devel built with -fsanitize=address,undefined
#     (rocker/r-devel-san), to catch C++ undefined behavior in src/ that a
#     normal optimized build silently tolerates.
#   - R-CMD-check-valgrind:     R-devel under valgrind --use-valgrind, to
#     catch memory bugs (uninitialized reads, invalid frees) ASAN/UBSAN can
#     miss.

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    # Originally 90 (see the 2026-08-10 incident where ubuntu-latest
    # (oldrel-1) and the sibling R-CMD-check-no-suggests job below both sat
    # stuck in check-r-package for 4+ hours with no timeout to stop them).
    # Raised to 150 after the 2026-08-19 inference-hierarchy expansion (140
    # of 267 testthat files touched in the preceding days) pushed every
    # matrix leg's "checking tests" step past 90 minutes legitimately (not a
    # hang -- windows-latest/ubuntu-latest(release)/macos-latest all hit the
    # literal 90-minute cutoff mid-testthat run). 150 still catches a
    # genuine hang well before GitHub's own 6h hard kill.
    timeout-minutes: 150

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: 'devel'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Portable build: skips -march=native/-mtune=native/-fno-lto and the
      # CXXFLAGS override (see R/EDI/configure). Those are opt-in for local
      # performance-tuned builds (EDI_PORTABLE=0, the default) but would
      # otherwise trip "checking compilation flags in Makevars" here.
      EDI_PORTABLE: 1
      # --as-cran implies --run-donttest (reruns every example, including
      # \donttest{} blocks, in one combined session). That pass is fast and
      # clean on every other leg of this matrix (macOS: ~32s, all 3 Ubuntu
      # configs: ~67-68s) but was observed to hang indefinitely on
      # windows-latest specifically -- a run on 2026-08-09 sat in "checking
      # examples with --run-donttest" for 5.5+ hours before GitHub's own
      # hard 6h job timeout killed it, with no single culprit example
      # isolatable (unlike the earlier Windows-only GLPK-solver test hang;
      # see test-fixed-design-optimal-blocks.R's skip_on_os("windows")). See
      # https://forum.posit.co/t/r-cmd-check-r-4-0-0-now-runs-donttest-how-to-proceed-with-long-running-examples/64493
      # for _R_CHECK_DONTTEST_EXAMPLES_ overriding --as-cran's default.
      #
      # EXPERIMENT (2026-08-17, release_v1_0_0.md Release Gate item): a static
      # audit of every \donttest{} block found no blocking call (no system(),
      # Sys.sleep, readline, sockets, download.file, or parallel::mclapply/
      # cluster usage) and no example on the known-hanging GLPK/ompr MILP
      # path -- the leading remaining suspect is MinGW's OpenMP/pthread
      # implementation interacting badly with R's single-threaded example
      # harness (the package's C++ kernels are pervasively OpenMP-parallel;
      # see the `_OPENMP`-gated kernels under `src/`). Re-enabling the
      # donttest pass here with OMP_NUM_THREADS pinned to 1 (Windows-only) is
      # a targeted test of that hypothesis. Now that the job carries a
      # 90-minute `timeout-minutes` (see above; added for an unrelated
      # 2026-08-10 incident), the exposure if this doesn't fix it is capped at
      # ~90 minutes, not the original 5.5-hour incident. If the hang recurs,
      # revert both lines below (_R_CHECK_DONTTEST_EXAMPLES_ back to 'false',
      # drop the OMP_NUM_THREADS override) and fall back to per-file-group CI
      # bisection instead.
      _R_CHECK_DONTTEST_EXAMPLES_: true

    steps:
      - uses: actions/checkout@v7

      # Reference BLAS/LAPACK (Ubuntu's R default) is 10-50x slower than
      # OpenBLAS for the test suite's linear-algebra-heavy fits (GLMM,
      # frailty, copula, ...) -- confirmed 2026-08-26 as the dominant cause
      # of "checking tests" taking 150+ minutes on this leg vs ~10-11 min
      # locally (this machine's MKL + 12 cores vs the runner's reference
      # BLAS + 2 vCPUs). Swapping the active `update-alternatives` target
      # is a runtime dynamic-linker change -- no R/package recompile or
      # reinstall needed, and it must run before any step that actually
      # exercises linear algebra (examples/tests), so it's placed right
      # after checkout. Deliberately NOT applied to the ASAN/UBSAN or
      # valgrind jobs -- OpenBLAS's own thread pool is a common source of
      # sanitizer/valgrind noise unrelated to real bugs in EDI's code, and
      # those jobs test memory correctness, not speed.
      - name: Switch to OpenBLAS on Ubuntu (see comment above)
        if: matrix.config.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libopenblas0-pthread
          sudo update-alternatives --set libblas.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/openblas-pthread/libblas.so.3
          sudo update-alternatives --set liblapack.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/openblas-pthread/liblapack.so.3

      # OMP_NUM_THREADS is set via GITHUB_ENV (Windows-only) rather than a
      # job-level env var above, because a job-level env var evaluating to ''
      # on non-Windows legs still *sets* OMP_NUM_THREADS to the empty string
      # rather than leaving it unset -- libgomp treats '' as an invalid value
      # and prints "libgomp: Invalid value for environment variable
      # OMP_NUM_THREADS: " to stderr, which rcmdcheck's --as-cran run then
      # surfaces as a DESCRIPTION-meta-information WARNING/ERROR (see the
      # 2026-08-17 ubuntu-latest (release) failure this was written to fix).
      - name: Pin OMP_NUM_THREADS to 1 on Windows (see comment above)
        if: matrix.config.os == 'windows-latest'
        shell: bash
        run: echo "OMP_NUM_THREADS=1" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # CRAN's macOS R installer defaults to reference BLAS, not Apple's
      # Accelerate/vecLib framework, even though every macOS runner has it
      # available -- a well-known R-for-macOS gotcha (see "vecLib BLAS" in
      # the R Installation and Administration manual). Confirmed 2026-08-27
      # as the same reference-BLAS-is-10-50x-slower problem already fixed
      # for the Ubuntu legs above: this leg's `checking tests` step ran for
      # 2+ hours without finishing (150-min job timeout) despite examples +
      # donttest passing quickly. R.framework ships both `libRblas.dylib`
      # (reference) and `libRblas.vecLib.dylib` (Accelerate-linked); this is
      # just re-pointing the symlink, no reinstall needed. Must run after
      # setup-r (R.framework has to exist first) and before any step that
      # exercises linear algebra.
      - name: Switch macOS R to Accelerate/vecLib BLAS (see comment above)
        if: matrix.config.os == 'macos-latest'
        run: ln -sf libRblas.vecLib.dylib /Library/Frameworks/R.framework/Resources/lib/libRblas.dylib

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/EDI
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: R/EDI
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          # error-on "warning", not "note" (changed 2026-08-26; was "note"
          # since this job was added). This action already sets
          # _R_CHECK_CRAN_INCOMING_=false by default (see its action.yaml),
          # which suppresses the one NOTE that's genuinely unavoidable
          # pre-CRAN ("New submission"). The remaining NOTE this job
          # otherwise fails on -- "Found the following possibly unsafe
          # calls: unlockBinding(...)" (contracts_mixins.R, 3 sites) -- is
          # not a bug: it's EDI's lazy-component-loading mechanism
          # reassigning an already-locked R6 method binding, unlocking only
          # that one binding for the duration of a single assign() and
          # immediately re-locking it (see the code comments at each call
          # site). Justified in full in cran-comments.md, which CRAN's own
          # human reviewer reads at submission -- but rcmdcheck's error_on
          # is a blunt severity threshold with no per-NOTE-message
          # exception, so keeping it at "note" here means every push fails
          # on a NOTE we've already decided to ship with, masking any
          # *other* NOTE that does need attention. "warning" still fails
          # the job on any new NOTE-worthy regression that rises to a real
          # WARNING or ERROR.
          error-on: '"warning"'

  # CRAN also verifies a package works with only its hard dependencies
  # (Depends/Imports/LinkingTo) present -- catching an unconditional use of a
  # Suggested package that isn't properly guarded by requireNamespace()/
  # skip_if_not_installed(). The main matrix job above always has every
  # Suggests package installed, so it can't catch this class of bug; this
  # job deliberately installs none of them (dependencies: NA is pak's "hard
  # dependencies only" spec) and sets _R_CHECK_SUGGESTS_ONLY_ to match.
  #
  # _R_CHECK_FORCE_SUGGESTS_ is a separate, easy-to-confuse-with-the-above
  # setting: per tools:::.check_packages (R's own check.R), it's what
  # controls whether a *missing* Suggested package is a hard "checking
  # package dependencies ... ERROR" ("Packages suggested but not available")
  # -- default TRUE, and --as-cran never overrides it. _R_CHECK_SUGGESTS_ONLY_
  # controls something unrelated (restricting the check's library search
  # path), so it alone doesn't stop that ERROR; without this, a job that
  # deliberately doesn't install Suggests (as this one does, on purpose)
  # fails immediately in "checking package dependencies" before it can
  # actually exercise the missing-Suggests-guard code this job exists to
  # test.
  R-CMD-check-no-suggests:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, no Suggests)

    # See R-CMD-check's identical timeout-minutes comment above -- this job
    # hit the same 4+ hour stuck-in-check-r-package incident on 2026-08-10,
    # and the same 2026-08-19 test-suite-growth timeout (1h13m56s, exit 143)
    # that raised R-CMD-check's cap to 150.
    timeout-minutes: 150

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      EDI_PORTABLE: 1
      _R_CHECK_SUGGESTS_ONLY_: true
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v7

      # See R-CMD-check's identical step/comment above -- same fix, same
      # reason (reference BLAS vs OpenBLAS), this job is Ubuntu-only so no
      # matrix.config.os guard is needed here.
      - name: Switch to OpenBLAS (see R-CMD-check's identical step for why)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libopenblas0-pthread
          sudo update-alternatives --set libblas.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/openblas-pthread/libblas.so.3
          sudo update-alternatives --set liblapack.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/openblas-pthread/liblapack.so.3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/EDI
          # knitr/rmarkdown (VignetteBuilder + its rmarkdown::html_vignette
          # output format) are added explicitly alongside rcmdcheck despite
          # dependencies: 'NA' below skipping EDI's own Suggests: CRAN's
          # real check machine always has the VignetteBuilder available
          # (Suggests are only ever skipped to catch EDI's own code
          # wrongly hard-depending on one, not to simulate vignettes
          # building without a renderer, which CRAN never does) -- see the
          # check-r-package step below for what skipping this actually
          # breaks (2026-08-26).
          extra-packages: |
            any::rcmdcheck
            any::knitr
            any::rmarkdown
          dependencies: 'NA'

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: R/EDI
          # No --no-build-vignettes here (tried 2026-08-26, reverted): that
          # flag only skips *re-building* vignette outputs during check --
          # it does not stop `R CMD check` from flagging a tarball whose
          # `vignettes/` sources have no matching `inst/doc` output as a
          # WARNING ("Files in the 'vignettes' directory but no files in
          # 'inst/doc'"), so passing it to build_args (skipping the build)
          # just guaranteed that mismatch instead of avoiding it. With
          # knitr/rmarkdown installed above, vignettes build normally here
          # exactly as they do in the main R-CMD-check matrix job.
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          # error-on "warning", not "note" -- see the identical change/
          # comment on the main R-CMD-check job above (the justified
          # unlockBinding() NOTE, documented in cran-comments.md).
          error-on: '"warning"'

  # CRAN's "incoming feasibility" checks -- Title/Description phrasing policy,
  # misspellings, URL validity, license text, and the overall submission-
  # feasibility/checktime NOTE. Every other job in this matrix runs with
  # _R_CHECK_CRAN_INCOMING_=false (check-r-package@v2's own default, kept
  # disabled there deliberately so the unavoidable "New submission" NOTE
  # doesn't fail the main --as-cran matrix on every push -- see that job's
  # error-on comment). These checks are metadata-based, not platform-
  # sensitive, so one Linux job gives full coverage; this job does NOT
  # substitute for win-builder/mac-builder (see release_v1_0_0.md's Release
  # Gate) -- those additionally run on CRAN's own build machines, which this
  # doesn't -- but it gives continuous, on-every-push coverage of the
  # metadata-policy half of what those provide, instead of only finding out
  # at manual pre-submission time.
  R-CMD-check-incoming:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, CRAN incoming checks)

    timeout-minutes: 150

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      EDI_PORTABLE: 1
      # Explicitly enabled (see the job comment above); check-r-package@v2
      # only applies its own false default when this is unset.
      _R_CHECK_CRAN_INCOMING_: true

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/EDI
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: R/EDI
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          # error-on "warning", not "note": incoming checks always produce
          # at least the unavoidable "New submission" NOTE (this is a new
          # package), so failing on any NOTE here would fail every run
          # regardless of whether anything is actually wrong. NOTEs still
          # show up in the job's own check output for manual review; only a
          # WARNING/ERROR (a real, actionable incoming-checks finding) fails
          # the job.
          error-on: '"warning"'

  # ASAN/UBSAN sanitizer build. Catches C++ undefined behavior (out-of-bounds
  # access, sign/integer overflow, misaligned access, use-after-free, etc.)
  # in the src/ kernels that a normal optimized build silently tolerates --
  # exactly the class of bug the main matrix job's --as-cran run cannot see,
  # since neither gcc/clang nor R CMD check instrument for it by default.
  # rocker/r-devel-san ships R-devel pre-built with -fsanitize=address,undefined
  # as its normal R/Rscript, so this otherwise mirrors a plain R CMD check.
  # Given the whole test suite runs under sanitizer instrumentation (slower
  # than a normal build, though not as extreme as valgrind), this has its own
  # generous-but-bounded timeout so a genuine hang can't repeat the >6-hour
  # stuck-job incident the Windows job hit before (see git history).
  R-CMD-check-sanitizers:
    runs-on: ubuntu-latest
    name: R-devel (ASAN/UBSAN)
    timeout-minutes: 180
    container:
      image: rocker/r-devel-san

    env:
      EDI_PORTABLE: 1
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      # See R-CMD-check-no-suggests's comment above -- this job also
      # deliberately skips installing most Suggests, so without this,
      # "checking package dependencies" ERRORs out before the actual
      # ASAN/UBSAN check ever runs.
      _R_CHECK_FORCE_SUGGESTS_: false
      # This job runs raw `RD CMD check --as-cran` (not check-r-package@v2,
      # which sets this to false by default -- see R-CMD-check's own
      # error-on comment) -- without it, "checking CRAN incoming
      # feasibility" tries a live network call to CRAN.R-project.org, which
      # this job's environment doesn't reliably have (a 2026-08-26 run
      # failed the sibling R-CMD-check-valgrind job exactly this way:
      # "cannot open the connection to '.../PACKAGES.in'"). Redundant here
      # anyway -- R-CMD-check-incoming already covers this on every push.
      _R_CHECK_CRAN_INCOMING_: false

    steps:
      - uses: actions/checkout@v7

      - name: "Install libuv (system dependency of the 'fs' package, itself a transitive dependency of testthat via pkgload -- rocker/r-devel-san is a bare-bones image that doesn't include it, unlike e.g. rocker/r-devel, causing \"ERROR: configuration failed for package 'fs'\" -> cascading pkgload/testthat install failures)"
        run: apt-get update && apt-get install -y libuv1-dev

      # Matrix is listed explicitly (even though it's not a direct EDI
      # dependency) because survival Imports it, and rocker/r-devel-san
      # doesn't ship it pre-built -- see the valgrind job's identical step
      # for the "there is no package called 'Matrix'" failure this avoids.
      - name: Install EDI's Depends/Imports/LinkingTo (Suggests skipped -- not needed to catch memory bugs in the core kernels, and roughly doubles this already-slow job otherwise)
        working-directory: R/EDI
        run: |
          RDscript -e 'install.packages(c("R6","checkmate","Rcpp","RcppEigen","RcppNumerical","data.table","survival","Matrix","lattice","boot","class","cluster","codetools","foreign","KernSmooth","mgcv","nlme","nnet","rpart","spatial","nbpMatching","anticlust","missRanger","missForest","numDeriv","digest","methods","MASS","RhpcBLASctl","randomizr","testthat"), repos = "https://cloud.r-project.org")'

      - name: Build
        working-directory: R/EDI
        run: RD CMD build --no-build-vignettes --no-manual .

      - name: Check under ASAN/UBSAN
        working-directory: R/EDI
        # --no-examples: examples aren't guarded against missing Suggests
        # the way tests are (skip_if_not_installed()), and this job
        # deliberately doesn't install every Suggests package (see the
        # install step above) -- the main R-CMD-check matrix job already
        # runs every example (including --run-donttest) with the full
        # Suggests set installed, so this isn't a coverage loss, just
        # avoiding a redundant check under a different, unrelated set of
        # constraints than what this job exists to test (memory bugs in
        # src/, primarily exercised via the test suite below).
        run: RD CMD check --no-manual --no-build-vignettes --no-examples --as-cran EDI_*.tar.gz

      # RD CMD check's own console output doesn't include the actual
      # compiler/linker error when "checking whether package can be
      # installed" fails -- only a pointer to this file, which this job
      # (unlike R-CMD-check's r-lib/actions/check-r-package@v2 jobs, which
      # upload it as an artifact automatically) has no other way to surface.
      - name: Show 00install.out on failure
        if: failure()
        working-directory: R/EDI
        run: cat EDI.Rcheck/00install.out || true

      # See the valgrind job's identical step/comment below -- this job has
      # the same gap (raw `RD CMD check` truncates a failing testthat.R run
      # to its last 13 lines, so a multi-failure run only ever shows the
      # last failure). Missing here until 2026-08-27, when a real second
      # failure ("FAIL 6" vs. the sibling no-Suggests job's "FAIL 5" for the
      # same push) turned out to be unrecoverable from the workflow log.
      - name: Show tests/testthat.Rout(.fail) on failure
        if: failure()
        working-directory: R/EDI
        run: cat EDI.Rcheck/tests/testthat.Rout.fail EDI.Rcheck/tests/testthat.Rout 2>/dev/null || true

  # Valgrind memcheck build. Catches memory bugs (uninitialized reads,
  # out-of-bounds access, use-after-free, invalid frees) in the src/ kernels
  # that ASAN/UBSAN above can miss and a normal build can't see at all.
  # valgrind doesn't need a specially-instrumented R build -- it works on any
  # binary -- so this uses the same actively-maintained rocker/r-devel base
  # image as the sanitizers job above rather than a prebuilt "valgrind R"
  # image like wch1/r-debug's RDvalgrind, which has been unmaintained since
  # 2019.
  #
  # Valgrind instrumentation is dramatically slower than ASAN/UBSAN (itself
  # slower than a normal build), so this runs the full check -- tests
  # included, not just examples -- under a generous but hard-capped timeout.
  # GitHub Actions itself caps hosted-runner jobs at 6h regardless of
  # timeout-minutes, so 350 leaves a few minutes of headroom for
  # checkout/setup before that external cutoff turns a slow run into an
  # opaque kill instead of a clean, readable timeout failure.
  R-CMD-check-valgrind:
    runs-on: ubuntu-latest
    name: R-devel (valgrind)
    timeout-minutes: 350
    container:
      image: rocker/r-devel

    env:
      EDI_PORTABLE: 1
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      # See R-CMD-check-no-suggests's comment above -- this job also
      # deliberately skips installing most Suggests, so without this,
      # "checking package dependencies" ERRORs out before the actual
      # valgrind check ever runs.
      _R_CHECK_FORCE_SUGGESTS_: false
      # See the identical comment on R-CMD-check-sanitizers above -- this
      # job hit exactly the failure that comment describes on 2026-08-26
      # ("checking CRAN incoming feasibility" failing to reach
      # CRAN.R-project.org and erroring the whole job), which this fixes.
      _R_CHECK_CRAN_INCOMING_: false

    steps:
      - uses: actions/checkout@v7

      # valgrind has no versioned dependency on libc6-dbg (any version
      # satisfies it), but apt's solver still tries the *older* of the two
      # available libc6-dbg candidates first; that older libc6-dbg has a
      # hard, exact-version dependency on a matching (older) libc6, so apt
      # then tries to downgrade the already-installed (newer) libc6 -- which
      # something else in the image blocks even with --allow-downgrades,
      # producing "Reached two conflicting decisions". This isn't transient
      # mirror lag (confirmed unchanged across 2026-08-17 and 2026-08-19 runs
      # 2 days apart, same exact versions both times, 5 retries with 60s
      # backoff didn't help either -- see the 2026-08-17 and 2026-08-19
      # R-devel (valgrind) job failures this was written to fix). The fix is
      # to pre-select the libc6-dbg version that already matches the
      # container's installed libc6, so apt never needs to downgrade
      # anything to satisfy valgrind's unversioned libc6-dbg dependency.
      - name: Install valgrind and libuv (libuv is a system dependency of the 'fs' package, itself a transitive dependency of testthat via pkgload -- rocker/r-devel is a bare-bones image that doesn't include it, see the sanitizers job's Install libuv step for the failure this causes if skipped)
        run: |
          apt-get update
          libc6_version="$(dpkg-query -W -f='${Version}' libc6)"
          apt-get install -y --allow-downgrades "libc6-dbg=${libc6_version}" valgrind libuv1-dev

      # Matrix is listed explicitly (even though it's not a direct EDI
      # dependency) because survival Imports it, and rocker/r-devel doesn't
      # ship it pre-built -- without this, "byte-compile and prepare package
      # for lazy loading" for EDI itself fails with "there is no package
      # called 'Matrix'" while transitively loading survival's namespace.
      - name: Install EDI's Depends/Imports/LinkingTo (Suggests skipped -- not needed to catch memory bugs in the core kernels, and would multiply the runtime of an already-very-slow job)
        working-directory: R/EDI
        run: |
          RDscript -e 'install.packages(c("R6","checkmate","Rcpp","RcppEigen","RcppNumerical","data.table","survival","Matrix","lattice","boot","class","cluster","codetools","foreign","KernSmooth","mgcv","nlme","nnet","rpart","spatial","nbpMatching","anticlust","missRanger","missForest","numDeriv","digest","methods","MASS","RhpcBLASctl","randomizr","testthat"), repos = "https://cloud.r-project.org")'

      - name: Build
        working-directory: R/EDI
        run: RD CMD build --no-build-vignettes --no-manual .

      - name: Check under valgrind
        working-directory: R/EDI
        # --no-examples: see the sanitizers job's identical flag/comment above.
        run: RD CMD check --no-manual --no-build-vignettes --no-examples --as-cran --use-valgrind EDI_*.tar.gz

      # See the sanitizers job's identical step -- RD CMD check's console
      # output doesn't include the actual install-time error, only a
      # pointer to this file.
      - name: Show 00install.out on failure
        if: failure()
        working-directory: R/EDI
        run: cat EDI.Rcheck/00install.out || true

      # When a *test* (as opposed to install) fails under valgrind, RD CMD
      # check's console output prints only the last 13 lines of that test's
      # output -- for a long-running testthat.R run under valgrind, those 13
      # lines are just the tail of the final LEAK SUMMARY, not the individual
      # "N errors from M contexts" reports (invalid reads/writes, uninitialised
      # value use, etc.) that valgrind printed earlier and that R saves in
      # full to testthat.Rout.fail. Without this, that file only ever existed
      # on the ephemeral runner and the actual error is unrecoverable from the
      # workflow log (see the 2026-08-10 valgrind failure this was written to
      # diagnose, whose log showed nothing but a truncated leak summary).
      - name: Show tests/testthat.Rout(.fail) on failure
        if: failure()
        working-directory: R/EDI
        run: cat EDI.Rcheck/tests/testthat.Rout.fail EDI.Rcheck/tests/testthat.Rout 2>/dev/null || true

