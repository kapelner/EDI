name: ARM sdist build (piwheels parity)

# Reproduces piwheels.org's edi_kernels build environment: piwheels never
# consumes the wheels build-wheels.yml publishes to PyPI -- it always
# rebuilds every package from the sdist, on real Raspberry Pi ARM hardware,
# once per Raspberry Pi OS release (Debian codename), each defaulting to a
# different system Python:
#   Bullseye (Debian 11) -> Python 3.9
#   Bookworm (Debian 12) -> Python 3.11
#   Trixie   (Debian 13) -> Python 3.13
# (see https://www.piwheels.org/project/edi-kernels/ for the exact matrix
# this mirrors). This caught a real bug undetected by build-wheels.yml's own
# sdist-install step: that step installs the sdist on ubuntu-latest
# (x86_64), where scipy-openblas32 (python/pyproject.toml's [build-system]
# requires fallback BLAS) has PyPI wheels, so it never surfaced that
# scipy-openblas32 ships *no* distribution at all -- no wheel, no sdist --
# for 32-bit ARM. Every piwheels 1.0.0.post3 build failed at "Installing
# build dependencies" with "Could not find a version that satisfies the
# requirement scipy-openblas32 (from versions: none)", before CMake's own
# configure step (and its find_package(BLAS) system-BLAS fallback) ever ran.
#
# Debian's own default `python3` on each of these three images already
# matches the piwheels Python version above, so no deadsnakes/pyenv dance is
# needed -- `apt install python3-pip` on the right base image is enough.
#
# Runs under QEMU emulation (docker/setup-qemu-action) against
# linux/arm/v7 -- piwheels' primary (32-bit) build architecture -- since
# there is no armv7 GitHub-hosted runner. Emulated C++ compiles are slow, so
# this intentionally does NOT run on every push (unlike build-wheels.yml's
# main-branch trigger): only on an actual `py-v*` release tag, plus
# workflow_dispatch for manual testing.

on:
  push:
    tags:
      - "py-v*"
  workflow_dispatch: {}

jobs:
  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        run: pipx run build --sdist --outdir dist python

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  arm_sdist_build:
    name: sdist on ${{ matrix.codename }} (py${{ matrix.python }}, armv7)
    needs: build_sdist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - codename: bullseye
            python: "3.9"
          - codename: bookworm
            python: "3.11"
          - codename: trixie
            python: "3.13"

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Set up QEMU (arm/v7)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      # Everything below runs inside an emulated 32-bit ARM container on the
      # matching Debian release, mirroring piwheels' own build environment as
      # closely as a GitHub-hosted runner allows. Deliberately does NOT
      # preinstall a system BLAS (e.g. libopenblas-dev) beyond whatever the
      # base image ships by default -- the point is to observe what CMake's
      # find_package(BLAS)/scipy-openblas32 fallback actually does on this
      # platform, not to paper over it.
      - name: Build and install sdist from source (emulated ${{ matrix.codename }}, python${{ matrix.python }})
        run: |
          set -e
          docker run --rm \
            --platform linux/arm/v7 \
            -v "${{ github.workspace }}/dist:/dist:ro" \
            debian:${{ matrix.codename }} \
            bash -eux -c '
              apt-get update
              apt-get install -y --no-install-recommends python3 python3-pip python3-venv build-essential cmake ca-certificates
              python3 -m venv /tmp/venv
              /tmp/venv/bin/pip install --upgrade pip
              SDIST=$(ls /dist/*.tar.gz | head -n1)
              /tmp/venv/bin/pip install --no-binary edi_kernels "$SDIST"
              /tmp/venv/bin/python3 -c "import edi_kernels; print(\"edi_kernels imported OK from\", edi_kernels.__file__)"
            '
