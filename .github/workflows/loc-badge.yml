name: loc-badge

# Keeps README's "lines of code" badge live without ever touching README.md
# itself: on every push to main this regenerates cloc data and publishes it
# to a Gist (not this repo), which the badge fetches live via shields.io's
# endpoint-badge type -- see scripts/generate_loc_badge_data.sh,
# scripts/publish_loc_badge_gist.sh, and README.md's badge row for the
# consuming side.
#
# Deliberately NOT using GitHub Pages: this repo's Pages slot is already the
# pkgdown site (see pkgdown.yaml, build_type "workflow"), and each
# actions/deploy-pages call replaces the whole site -- a second, independent
# deploy here would race and periodically clobber it. No R install and no
# C++ compile happens in this job (just cloc, a static line counter), so
# this is safe to run on every push rather than needing path filters.
#
# The two generator/publish scripts are bash + jq, not Python, deliberately:
# build-wheels.yml's push trigger matches "**/*.py" anywhere in the repo, so
# a .py file here would make this unrelated README-badge workflow spuriously
# trigger that workflow's full 3-OS wheel build too.

on:
  push:
    branches: [main, master]

permissions:
  contents: read

# A newer push to the same branch (each PR merge is one), or a newer commit on the same PR, cancels
# this workflow's run for the older one (owner, 2026-11-18): merging several PRs in a row queued one
# full run per merge, holding the 20 free runners for hours. Push and pull_request runs share a group
# per ref; schedule and workflow_dispatch runs get their own (the run id), so they never cancel or get
# cancelled, and each tag push is its own ref. A job gated with `always()` keeps running after a
# cancel, so only short report jobs may use it; long jobs use `!cancelled()`.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  update-loc-badge:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      # A gist ID is just an opaque identifier, not a credential -- safe to
      # hardcode here. GIST_PAT (the actual credential, scoped to just
      # "gist") is a repo secret, added separately.
      GIST_ID: 3d96a820d6b5d6fba041fc31bc9bf36a
      GIST_PAT: ${{ secrets.GIST_PAT }}

    steps:
      - uses: actions/checkout@v7

      - name: Install cloc
        run: sudo apt-get update -y && sudo apt-get install -y cloc

      - name: Generate lines-of-code badge data
        run: |
          bash scripts/generate_loc_badge_data.sh \
            "$RUNNER_TEMP/loc-badge.json" "$RUNNER_TEMP/loc-badge-tests.json" "$RUNNER_TEMP/loc.md"

      - name: Publish to gist
        run: |
          bash scripts/publish_loc_badge_gist.sh \
            "$RUNNER_TEMP/loc-badge.json" "$RUNNER_TEMP/loc-badge-tests.json" "$RUNNER_TEMP/loc.md"
