name: test-coverage

# Full instrumented coverage runs on every push to main that touches R
# code -- not on pull_request: covr needs an instrumented rebuild and this
# takes ~40min even sharded across 6 parallel runners, which is too slow for
# the PR feedback loop. The nightly schedule + workflow_dispatch stay on as
# a backstop for a day with no matching push, or a push whose run failed --
# but the nightly firing itself is a no-op (see the `check` job) unless a
# relevant path actually changed since the last successful run, so an idle
# repo doesn't pay for a coverage run every night.
on:
  push:
    branches: [main, master]
    paths:
      - 'R/EDI/**/*.R'
      - 'R/EDI/**/*.Rd'
      - 'R/EDI/**/*.cpp'
      - 'R/EDI/**/*.h'
      - 'R/EDI/**/*.hpp'
      - 'R/EDI/DESCRIPTION'
      - 'R/EDI/NAMESPACE'
      - 'R/EDI/tests/**'
      - 'R/package_tests/**'
      - '.github/workflows/test-coverage-R.yaml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  # Schedule fires unconditionally every night regardless of path filters
  # (those only apply to `push`); this job re-applies the same path list to
  # the nightly firing so it's a real backstop (catches a failed/missing
  # push-triggered run) rather than a guaranteed nightly cost on an idle repo.
  # Always skipped (not run) for push/workflow_dispatch, which keep their
  # existing unconditional behavior.
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for relevant commits since the last successful run
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last_sha=$(gh api "repos/${{ github.repository }}/actions/workflows/test-coverage-R.yaml/runs?status=success&branch=${{ github.ref_name }}&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          if [ -z "$last_sha" ] || ! git cat-file -e "$last_sha" 2>/dev/null; then
            echo "No prior successful run found on this branch; running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$last_sha" HEAD -- \
              'R/EDI/**/*.R' 'R/EDI/**/*.Rd' 'R/EDI/**/*.cpp' 'R/EDI/**/*.h' \
              'R/EDI/**/*.hpp' 'R/EDI/DESCRIPTION' 'R/EDI/NAMESPACE' \
              'R/EDI/tests' 'R/package_tests' '.github/workflows/test-coverage-R.yaml'; then
            echo "No relevant changes since $last_sha; skipping nightly run."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Relevant changes found since $last_sha; running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  plan:
    needs: check
    if: always() && (github.event_name != 'schedule' || needs.check.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Plan runtime-balanced shards
        id: plan
        run: |
          python3 R/package_tests/ci/plan_shards.py coverage --output shard-plan
          echo "matrix=$(cat shard-plan/matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-plan
          path: shard-plan

  shards:
    needs: plan
    # 2026-09-24: without this, `shards` inherited GitHub Actions' implicit
    # default job condition (bare success()), which is poisoned by ANY
    # skipped job earlier in the dependency graph -- not just its own direct
    # `needs`. `check` above is unconditionally present in the graph but
    # deliberately skipped on every push (if: github.event_name == 'schedule'),
    # which silently killed `shards` (and `merge`) on every single push-
    # triggered run, going back through every recent commit checked
    # (2026-09-24 investigation into a stale Codecov badge -- coverage had
    # not actually been re-measured/uploaded on any push in that window,
    # despite the workflow itself reporting overall success, since a skipped
    # job doesn't fail a run by default). `plan` already had this same fix
    # via its own `if: always() && ...`; this gives `shards` an equivalent
    # explicit condition that only looks at its own direct dependency.
    #
    # 2026-09-25: a bare `if: needs.plan.result == 'success'` (no always())
    # was NOT enough -- confirmed live via a diagnostic workflow_dispatch run
    # (commit 83632ff5, runs 36108398435 vs 36108707186): with the bare
    # comparison shards stayed skipped even though plan had genuinely
    # succeeded; switching to `if: always()` alone made all 99 shards expand
    # and start running. The real, generalizable rule: a job downstream of
    # another job that itself needed always() to survive a skipped ancestor
    # (here, plan surviving check's skip) must ALSO prefix its own condition
    # with always() -- a bare explicit comparison still inherits the same
    # whole-graph implicit-success() poisoning one level down. Matching
    # plan's own `always() && (...)` style instead of always() alone keeps
    # this job from running if plan genuinely fails.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    # 2026-10-08: bumped from 60 -> 90 (and the "Run coverage shard" step
    # below from 45 -> 75). Run 37770247146's shard 3 genuinely ran the full
    # 60 minutes (started 11:28:27, cancelled 12:29:28 -- the job-level cap,
    # not an infra hang: setup-r completed normally, unlike the separate
    # apt-mirror-stall pattern seen on other runs) as the coverage test suite
    # has grown. Doubling-ish for headroom rather than tuning to the exact
    # current runtime, which will keep growing.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # 2026-09-23: raised from 6, matching test-bulk-non-cran.yml's shards
      # job -- Pro account, 40 concurrent jobs cap account-wide. GitHub
      # queues (never errors on) anything past the real cap, so this removes
      # our own artificial throttle in favor of GitHub's own scheduler.
      max-parallel: 40
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      EDI_PORTABLE: 1
      NOT_CRAN: true
      CI: true
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      GOTO_NUM_THREADS: 1
      VECLIB_MAXIMUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: coverage-shard-plan
          path: shard-plan
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/EDI
          dependencies: '"all"'
          extra-packages: any::jsonlite, any::covr
      - name: Run coverage shard
        timeout-minutes: 75
        run: Rscript R/package_tests/ci/run_shard.R "$GITHUB_WORKSPACE" "shard-plan/shard-${{ matrix.shard }}.json" coverage "shard-results/${{ matrix.shard }}"
      - name: Upload timings and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: shard-results/${{ matrix.shard }}
          if-no-files-found: error

  merge:
    needs: [plan, shards]
    # 2026-09-24: same fix as `shards` above -- an explicit condition on this
    # job's own direct dependencies, bypassing the implicit default success()
    # that a skipped `check` elsewhere in the graph poisons.
    # 2026-09-25: needs its own always() prefix too -- see shards' comment
    # above for why a bare comparison alone isn't enough.
    if: always() && needs.plan.result == 'success' && needs.shards.result == 'success'
    runs-on: ubuntu-latest
    # 2026-10-12: 15 -> 30. merge_coverage.R now sums compact per-shard
    # sidecars (seconds) but still reads one full ~1.6 GB coverage object as
    # the skeleton (~17 s) plus one more per shard that holds C++ gcov keys
    # the skeleton lacks (bounded, serial), then a ~30 s saveRDS and the
    # codecov upload; worst case is a few minutes, so leave real headroom
    # over the old budget rather than re-introduce a timeout as the failure.
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # Step-level `if:` cannot read the secrets context, only env, so expose it here.
      COVERAGE_BASELINE_PAT: ${{ secrets.COVERAGE_BASELINE_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Do NOT persist GITHUB_TOKEN into the repo's git config. checkout
          # stores it as an `http.https://github.com/.extraheader` Authorization
          # header, and git sends that header in preference to any credential
          # embedded in the remote URL -- so the floor-bump push below
          # authenticated as github-actions[bot] (which branch protection
          # rejects, 403 "Permission ... denied to github-actions[bot]", run
          # 38808821546 on 2026-10-15) instead of as the COVERAGE_BASELINE_PAT
          # it was given. Nothing else in this job pushes or pulls over git.
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          path: coverage-artifacts
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/EDI
          extra-packages: any::covr, any::jsonlite
          needs: coverage
      - name: Check coverage registry generator
        run: Rscript R/package_tests/ci/test_coverage_gap_registry.R
      - name: Check coverage floor script
        run: Rscript R/package_tests/ci/test_check_coverage_floor.R
      - name: Merge all shards and upload one report
        run: Rscript R/package_tests/ci/merge_coverage.R coverage-artifacts coverage-artifacts/coverage-shard-plan/matrix.json
      - name: Check coverage floor (must not drop below best-ever, TODO-9)
        # Auto-write mode (TODO-10 follow-up) only on a push to main/master, and only
        # when COVERAGE_BASELINE_PAT is configured: branch protection requires an
        # approving PR review with no bypass allowance for the default GITHUB_TOKEN
        # (verified 2026-10-14 -- required_pull_request_reviews.bypass_pull_request_
        # allowances is empty), so a bot-authored push via GITHUB_TOKEN would be
        # rejected. Only a PAT belonging to an actual repo admin (who already has
        # direct-push liberty, per CONTRIBUTING.md) can commit the bump. Without the
        # secret this step silently falls back to the original print-only behavior --
        # the regression check (dropping below the floor) always runs either way,
        # only the auto-write half is gated.
        env:
          AUTO_WRITE: ${{ (github.event_name == 'push' && env.COVERAGE_BASELINE_PAT != '') && '1' || '0' }}
        run: |
          if [ "$AUTO_WRITE" = "1" ]; then
            Rscript R/package_tests/ci/check_coverage_floor.R coverage-artifacts/merged-coverage.rds R/package_tests/ci/coverage_baseline.json r "${{ github.sha }}" 1
          else
            Rscript R/package_tests/ci/check_coverage_floor.R coverage-artifacts/merged-coverage.rds R/package_tests/ci/coverage_baseline.json r
          fi
      - name: Commit coverage floor bump
        # [skip ci] prevents this commit from re-triggering this same (expensive,
        # ~1.5h) workflow -- coverage_baseline.json falls under this workflow's own
        # R/package_tests/** push path filter, so without it every promotion would
        # queue a second, wasted full measurement.
        if: github.event_name == 'push' && env.COVERAGE_BASELINE_PAT != ''
        # A failed push here (e.g. a race against another push to the same branch)
        # should not turn an otherwise-green coverage run red; the real gate already
        # ran in the step above. Worst case, this promotion is just skipped and the
        # next green run tries again.
        continue-on-error: true
        run: |
          if git diff --quiet -- R/package_tests/ci/coverage_baseline.json; then
            echo "No baseline change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Belt and braces with checkout's persist-credentials: false above: if a
          # persisted GITHUB_TOKEN header is ever present it would silently win over
          # the PAT in the URL (see the checkout step's comment), so drop it first.
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${{ secrets.COVERAGE_BASELINE_PAT }}@github.com/${{ github.repository }}.git"
          git add R/package_tests/ci/coverage_baseline.json
          git commit -m "ci: raise R coverage floor baseline [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
      - name: Regenerate coverage backlog and report drift
        if: always()
        run: Rscript R/package_tests/ci/check_coverage_registry.R coverage-artifacts/merged-coverage.rds R/package_tests/coverage_gap_registry.csv coverage-registry
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-registry
          path: coverage-registry
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-merged
          path: coverage-artifacts/merged-coverage.rds
