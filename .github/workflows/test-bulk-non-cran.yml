name: test-bulk-non-cran

# Forty-minute estimated test budgets leave twenty minutes for setup/install.
on:
  push:
    branches: [main, master]
    paths: &bulk-test-paths
      - 'R/EDI/**/*.R'
      - 'R/EDI/**/*.cpp'
      - 'R/EDI/**/*.h'
      - 'R/EDI/**/*.hpp'
      - 'R/EDI/DESCRIPTION'
      - 'R/EDI/NAMESPACE'
      - 'R/package_tests/testthat_bulk/**'
      - 'R/package_tests/ci/**'
      - '.github/workflows/test-bulk-non-cran.yml'
  pull_request:
    branches: [main, master]
    paths: *bulk-test-paths
  workflow_dispatch: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Plan runtime-balanced shards
        id: plan
        run: |
          python3 R/package_tests/ci/plan_shards.py correctness --output shard-plan
          echo "matrix=$(cat shard-plan/matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: correctness-shard-plan
          path: shard-plan

  shards:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      EDI_PORTABLE: 1
      NOT_CRAN: true
      CI: true
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      GOTO_NUM_THREADS: 1
      VECLIB_MAXIMUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: correctness-shard-plan
          path: shard-plan
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/EDI
          dependencies: '"all"'
          extra-packages: any::jsonlite, any::covr
      - name: Install current commit into an isolated library
        run: |
          mkdir -p "${{ runner.temp }}/edi-install-scratch"
          R CMD INSTALL --library="${{ runner.temp }}/edi-install-scratch" R/EDI
          echo "R_LIBS=${{ runner.temp }}/edi-install-scratch${R_LIBS:+:$R_LIBS}" >> "$GITHUB_ENV"
      - name: Run correctness shard
        timeout-minutes: 45
        run: Rscript R/package_tests/ci/run_shard.R "$GITHUB_WORKSPACE" "shard-plan/shard-${{ matrix.shard }}.json" correctness "shard-results/${{ matrix.shard }}"
      - name: Upload timings and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: correctness-shard-${{ matrix.shard }}
          path: shard-results/${{ matrix.shard }}
          if-no-files-found: error

  # Single, fixed check name for branch protection to require -- the shard
  # count above is planned dynamically per run (plan_shards.py bin-packs the
  # current test manifest), so it isn't safe to hardcode individual
  # "shards (N)" names as required checks: that count changes as the test
  # suite grows or shrinks, which would either leave new shards ungated or,
  # worse, permanently block every future PR if a shard number stops
  # existing. if: always() so this still runs (and reports failure, not
  # "skipped") when plan or shards failed, rather than being skipped itself.
  gate:
    name: bulk tests passed
    needs: [plan, shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check plan and every shard succeeded
        run: |
          echo "plan: ${{ needs.plan.result }}"
          echo "shards: ${{ needs.shards.result }}"
          if [ "${{ needs.plan.result }}" != "success" ] || [ "${{ needs.shards.result }}" != "success" ]; then
            exit 1
          fi
