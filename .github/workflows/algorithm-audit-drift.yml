# Monthly algorithm audit. Read-only: no R, no compile, no commits.
#  - drift:    mechanical checks (comparator versions, kernel drift, plan state, and that
#              algorithm_inventory.csv / algorithm_references.csv are complete and current).
#              Opens/updates ONE issue labelled `algorithm-audit-drift`; closes it when clean.
#  - research: one Claude agent per audit row searches the web for a faster acceptable
#              algorithm, plus one `inventory` agent that judges new and changed functions
#              against the inventory. Prompts and output schemas: .github/prompts/.
#              Opens ONE pull request per run (label `algorithm-audit-research`) with the
#              findings file research_findings/<date>.md and the inventory updates; no PR when
#              there is nothing to report. Needs "Allow GitHub Actions to create and approve
#              pull requests" (Settings > Actions > General).
#              Needs the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN repo secret; without
#              one, every task is reported as NOT RUN (never as clean).
# Procedure and guardrails: R/package_metadata/new_feature_plans/v1_0_5/algorithm_audit_runbook.md
#
# Note: GitHub disables scheduled workflows after 60 days of repo inactivity.

name: algorithm-audit-drift

on:
  schedule:
    # Drift check: monthly, 06:00 UTC on the 21st (research does not run on this trigger).
    - cron: "0 6 21 * *"
    # Research: monthly, on the first Thursday of the month at 23:59 Asia/Jerusalem, starting
    # RESEARCH_START (owner, 2026-11-16: first run Thu 2026-12-03). Cron is UTC with no DST,
    # and a cron with both day-of-month and day-of-week matches EITHER, so both candidate UTC
    # times fire every Thursday and the plan job keeps only the one that is 23:59 in Jerusalem
    # (20:59 UTC in summer, 21:59 UTC in winter) on a first Thursday (day <= 7) on or after
    # RESEARCH_START. Drift does not run on these.
    - cron: "59 20 * * 4"
    - cron: "59 21 * * 4"
  workflow_dispatch:
    inputs:
      research_tasks:
        description: "Research tasks: 'all', 'none', or comma-separated rows (A = all of A's batches), batches (A.3) and/or 'inventory'"
        default: all

env:
  MONTHLY_CRON: "0 6 21 * *"
  RESEARCH_START: "2026-12-03"   # first scheduled research run (Jerusalem date)

permissions:
  contents: read
  issues: write

jobs:
  drift:
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '0 6 21 * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: algorithm-audit-drift
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the kernel-drift check reads full git history

      - name: Self-test the inventory check
        run: python3 .github/scripts/test_algorithm_audit_drift.py

      - name: Run drift checks
        run: python3 .github/scripts/algorithm_audit_drift.py --out drift_report.md

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: drift-report
          path: drift_report.md

      - name: Open, update, or close the tracking issue
        run: |
          gh label create "$LABEL" --color BFD4F2 \
            --description "Monthly algorithm-audit drift report" 2>/dev/null || true
          existing=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          status=$(head -n 1 drift_report.md)
          tail -n +3 drift_report.md > issue_body.md
          if [ "$status" = "FLAGGED" ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file issue_body.md
            else
              gh issue create --title "Algorithm audit drift ($(date -u +%Y-%m-%d))" \
                --label "$LABEL" --body-file issue_body.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Drift check is clean as of $(date -u +%Y-%m-%d)."
          fi

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
      task_list: ${{ steps.plan.outputs.task_list }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED: ${{ github.event.inputs.research_tasks || 'all' }}
        run: |
          python3 .github/scripts/algorithm_audit_drift.py --research-batches --out batches.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, os, sys, zoneinfo
          batches = json.load(open("batches.json"))
          rows = list(json.load(open("R/package_metadata/audits/algorithm_audit_row_map.json"))["rows"])
          event, sched = os.environ["EVENT"], os.environ.get("SCHEDULE", "")
          req = os.environ["REQUESTED"].strip()

          def log(msg):
              print(msg, file=sys.stderr)

          if event == "schedule":
              req = "none"
              if sched != os.environ["MONTHLY_CRON"]:
                  now = datetime.datetime.now(datetime.timezone.utc)
                  # the UTC Thursday this firing belongs to (tolerates a start delayed past midnight)
                  day = (now - datetime.timedelta(hours=12)).date()
                  minute, hour = (int(x) for x in sched.split()[:2])
                  local = datetime.datetime.combine(day, datetime.time(hour, minute), datetime.timezone.utc)
                  local = local.astimezone(zoneinfo.ZoneInfo("Asia/Jerusalem"))
                  start = datetime.date.fromisoformat(os.environ["RESEARCH_START"])
                  if (local.hour, local.minute) != (23, 59):
                      log(f"{sched}: not 23:59 in Jerusalem this week ({local:%H:%M %Z}); skipping")
                  elif local.date() < start:
                      log(f"{local.date()}: before RESEARCH_START {start}; skipping")
                  elif local.day > 7:
                      log(f"{local.date()}: not the first Thursday of the month; skipping")
                  else:
                      req = "all"
          allowed = list(batches) + ["inventory"]
          if req == "none":
              tasks = []
          elif req == "all":
              tasks = allowed
          else:
              tasks = []
              for t in (x.strip() for x in req.split(",") if x.strip()):
                  if t in allowed:
                      tasks.append(t)
                  elif t in rows and any(b.split(".")[0] == t for b in batches):
                      tasks += [b for b in batches if b.split(".")[0] == t]
                  else:
                      raise SystemExit(f"unknown research task {t!r}; use a row ({','.join(rows)}), "
                                       "a batch like A.3, 'inventory', 'all' or 'none'")
          log(f"research tasks ({len(tasks)}): {tasks}")
          print("tasks=" + json.dumps(tasks))
          print("task_list=" + ",".join(tasks))
          PY

  research:
    needs: plan
    if: ${{ needs.plan.outputs.tasks != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    env:
      TASK: ${{ matrix.task }}
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the currency task reads the last month of history

      - name: Prepare task context
        id: prep
        run: |
          mkdir -p research
          if [ "$TASK" = inventory ]; then
            python3 .github/scripts/algorithm_audit_drift.py --currency-context 40 --out currency_context.json
            prompt_file=.github/prompts/algorithm_audit_currency.md
            schema=.github/prompts/algorithm_audit_currency.schema.json
            what="the inventory currency check"
            # mostly sorting new functions into plumbing vs algorithm: Sonnet at medium effort
            model=claude-sonnet-5-5
            effort_arg="--effort medium"
          else
            python3 .github/scripts/algorithm_audit_drift.py --research-batches --out batches.json
            python3 - <<'PY'
          import csv, json, os
          task = os.environ["TASK"]
          algs = json.load(open("batches.json"))[task]
          with open("R/package_metadata/audits/algorithm_inventory.csv", newline="") as fh:
              rows = list(csv.DictReader(fh))
          keep = [r for r in rows if r["algorithm"] in algs]
          with open("row_entries.csv", "w", newline="") as fh:
              w = csv.DictWriter(fh, fieldnames=list(rows[0]))
              w.writeheader()
              w.writerows(keep)
          with open("batch_algorithms.txt", "w") as fh:
              fh.write("\n".join(algs) + "\n")
          print(f"batch {task}: {len(algs)} algorithms, {len(keep)} inventory entries")
          PY
            prompt_file=.github/prompts/algorithm_audit_research.md
            schema=.github/prompts/algorithm_audit_research.schema.json
            what="research batch $TASK (audit row ${TASK%%.*})"
            # judgement-heavy web research: Opus at the default effort (owner, 2026-11-16)
            model=claude-opus-5-5
            effort_arg=""
          fi
          {
            echo "what=$what"
            echo "model=$model"
            echo "effort_arg=$effort_arg"
            echo "prompt_file=$prompt_file"
            echo "schema=$(jq -c . "$schema")"
          } >> "$GITHUB_OUTPUT"

      - name: No API key
        if: ${{ env.HAS_KEY != 'true' }}
        run: echo "neither the ANTHROPIC_API_KEY nor the CLAUDE_CODE_OAUTH_TOKEN repository secret is set" > "research/$TASK.notrun"

      - name: Run the research agent
        id: claude
        if: ${{ env.HAS_KEY == 'true' }}
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Read ${{ steps.prep.outputs.prompt_file }} and follow it exactly.
            Your task: ${{ steps.prep.outputs.what }}. Today is the run date of this workflow.
            Repository: ${{ github.repository }}, commit ${{ github.sha }}.
          claude_args: |
            --allowedTools "Read,Glob,Grep,WebSearch,WebFetch,Bash(git log:*),Bash(git show:*),Bash(git diff:*)"
            --disallowedTools "Edit,Write,NotebookEdit"
            --model ${{ steps.prep.outputs.model }}
            ${{ steps.prep.outputs.effort_arg }}
            --max-turns 80
            --json-schema '${{ steps.prep.outputs.schema }}'

      - name: Save the agent's output
        if: ${{ always() && env.HAS_KEY == 'true' }}
        env:
          OUT: ${{ steps.claude.outputs.structured_output }}
          OUTCOME: ${{ steps.claude.outcome }}
        run: |
          if [ -n "$OUT" ]; then
            printf '%s' "$OUT" > "research/$TASK.json"
          else
            echo "agent produced no structured output (step outcome: $OUTCOME)" > "research/$TASK.notrun"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: research-${{ matrix.task }}
          path: research/

  research-pr:
    # Research results land in the repo, not in an issue: one pull request per run with
    # R/package_metadata/audits/research_findings/<date>.md and the inventory changes the
    # inventory agent proposed (verified refs only; verdicts never touched).
    needs: [plan, research]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.tasks != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write   # creating the PR label
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: algorithm-audit-research
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: research-*
          path: research
          merge-multiple: true

      - name: Apply the agents' output
        id: apply
        run: |
          mkdir -p research
          python3 .github/scripts/algorithm_audit_drift.py --research-batches --out batches.json
          status=$(python3 .github/scripts/algorithm_audit_research_apply.py --dir research \
            --tasks "${{ needs.plan.outputs.task_list }}" --batches batches.json --pr-body pr_body.md)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          # validate what was written; the result goes into the PR body (required checks do not
          # run on a PR opened with GITHUB_TOKEN)
          python3 .github/scripts/algorithm_audit_drift.py --out drift_now.md
          { echo; echo "Inventory check on this branch (online):"; echo;
            sed -n '/^## 4\./,$p' drift_now.md | tail -n +2; } >> pr_body.md

      - uses: actions/upload-artifact@v7
        with:
          name: research-findings
          path: |
            R/package_metadata/audits/research_findings/
            pr_body.md
          if-no-files-found: ignore

      - name: Open the pull request
        if: ${{ steps.apply.outputs.status == 'CHANGES' }}
        env:
          DATE: ${{ steps.apply.outputs.date }}
        run: |
          branch="algorithm-research/$DATE-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add R/package_metadata/audits/research_findings/ \
            R/package_metadata/audits/algorithm_inventory.csv \
            R/package_metadata/audits/algorithm_references.csv
          git commit -m "Algorithm research $DATE: findings and inventory updates" \
            -m "Generated by the research job of algorithm-audit-drift.yml (run $GITHUB_RUN_ID)."
          git push origin "$branch"
          gh label create "$LABEL" --color C5DEF5 \
            --description "Algorithm research findings and inventory updates" 2>/dev/null || true
          open_prs=$(gh pr list --label "$LABEL" --state open --json number --jq '[.[].number|tostring|"#"+.]|join(", ")')
          if [ -n "$open_prs" ]; then
            printf '\nEarlier research PRs still open: %s\n' "$open_prs" >> pr_body.md
          fi
          gh pr create --base main --head "$branch" --label "$LABEL" \
            --title "Algorithm research $DATE" --body-file pr_body.md

  notify-failure:
    # A crashed or cancelled run must not be mistaken for a clean month. (A research agent
    # that fails is reported as NOT RUN inside the research issue instead.)
    needs: [drift, plan, research-pr]
    # `skipped` is normal (drift is skipped on the weekly research triggers, research on the
    # monthly one), so only failure/cancelled count.
    if: ${{ always() && (contains(fromJSON('["failure","cancelled"]'), needs.drift.result) || contains(fromJSON('["failure","cancelled"]'), needs.plan.result) || contains(fromJSON('["failure","cancelled"]'), needs.research-pr.result)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      FAIL_LABEL: algorithm-audit-drift-failure
    steps:
      - name: Open or comment on the failure issue
        run: |
          gh label create "$FAIL_LABEL" --color D93F0B -R "$GITHUB_REPOSITORY" \
            --description "The algorithm-audit drift workflow itself failed" 2>/dev/null || true
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          msg="The algorithm-audit workflow did not complete ($(date -u +%Y-%m-%d); drift: ${{ needs.drift.result }}, research plan: ${{ needs.plan.result }}, research PR: ${{ needs.research-pr.result }}). The failed part has no result this run. Run: $url"
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --label "$FAIL_LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "$msg"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "Algorithm audit drift workflow failed" \
              --label "$FAIL_LABEL" --body "$msg"
          fi
