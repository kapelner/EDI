# Monthly algorithm audit. Read-only: no R, no compile, no commits.
#  - drift:    mechanical checks (comparator versions, kernel drift, plan state, and that
#              algorithm_inventory.csv / algorithm_references.csv are complete and current).
#              Opens/updates ONE issue labelled `algorithm-audit-drift`; closes it when clean.
#  - research: one Claude agent per audit row searches the web for a faster acceptable
#              algorithm, plus one `inventory` agent that judges new and changed functions
#              against the inventory. Prompts and output schemas: .github/prompts/.
#              Opens ONE pull request per run (label `algorithm-audit-research`) with the
#              findings file research_findings/<date>-run<id>.md and the inventory updates; no PR when
#              there is nothing to report. Needs "Allow GitHub Actions to create and approve
#              pull requests" (Settings > Actions > General).
#              Needs the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN repo secret; without
#              one, every task is reported as NOT RUN (never as clean).
# Procedure and guardrails: R/package_metadata/new_feature_plans/v1_0_5/algorithm_audit_runbook.md
#
# Note: GitHub disables scheduled workflows after 60 days of repo inactivity.

name: algorithm-audit-drift

on:
  schedule:
    # Drift check: monthly, 06:00 UTC on the 21st (research does not run on this trigger).
    - cron: "0 6 21 * *"
    # Research: monthly, on the first Thursday of the month at 23:59 Asia/Jerusalem, starting
    # RESEARCH_START (owner, 2026-11-16: first run Thu 2026-12-03). Cron is UTC with no DST,
    # and a cron with both day-of-month and day-of-week matches EITHER, so both candidate UTC
    # times fire every Thursday and the plan job keeps only the one that is 23:59 in Jerusalem
    # (20:59 UTC in summer, 21:59 UTC in winter) on a first Thursday (day <= 7) on or after
    # RESEARCH_START. Drift does not run on these.
    - cron: "59 20 * * 4"
    - cron: "59 21 * * 4"
  workflow_dispatch:
    inputs:
      research_tasks:
        description: "Research tasks: 'changed' (only problems with new code or due defers, plus inventory changes since the last review), 'all', 'none', or comma-separated rows (A = all of A's batches), batches (A.3) and/or 'inventory'"
        default: all

env:
  MONTHLY_CRON: "0 6 21 * *"
  RESEARCH_START: "2026-12-03"   # first scheduled research run (Jerusalem date)

permissions:
  contents: read
  issues: write

jobs:
  drift:
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '0 6 21 * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: algorithm-audit-drift
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the kernel-drift check reads full git history

      - name: Self-test the inventory check
        run: python3 .github/scripts/test_algorithm_audit_drift.py

      - name: Run drift checks
        run: python3 .github/scripts/algorithm_audit_drift.py --out drift_report.md

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: drift-report
          path: drift_report.md

      - name: Open, update, or close the tracking issue
        run: |
          gh label create "$LABEL" --color BFD4F2 \
            --description "Monthly algorithm-audit drift report" 2>/dev/null || true
          existing=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          status=$(head -n 1 drift_report.md)
          tail -n +3 drift_report.md > issue_body.md
          if [ "$status" = "FLAGGED" ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file issue_body.md
            else
              gh issue create --title "Algorithm audit drift ($(date -u +%Y-%m-%d))" \
                --label "$LABEL" --body-file issue_body.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Drift check is clean as of $(date -u +%Y-%m-%d)."
          fi

  plan:
    runs-on: ubuntu-latest
    # Includes waiting for an earlier research run to finish (see "Wait for earlier research
    # runs"); a full run takes ~70 min, so allow two of them plus margin.
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read   # list this workflow's runs and their jobs for the research lock
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
      task_list: ${{ steps.plan.outputs.task_list }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # inventory shards come from the last 40 days of history; a shallow
                           # clone would plan fewer shards than the research jobs compute
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED: ${{ github.event.inputs.research_tasks || 'all' }}
        run: |
          python3 .github/scripts/algorithm_audit_drift.py --research-batches --out batches.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, os, sys, zoneinfo
          batches = json.load(open("batches.json"))
          rows = list(json.load(open("R/package_metadata/audits/algorithm_audit_row_map.json"))["rows"])
          event, sched = os.environ["EVENT"], os.environ.get("SCHEDULE", "")
          req = os.environ["REQUESTED"].strip()

          def log(msg):
              print(msg, file=sys.stderr)

          if event == "schedule":
              req = "none"
              if sched != os.environ["MONTHLY_CRON"]:
                  now = datetime.datetime.now(datetime.timezone.utc)
                  # the UTC Thursday this firing belongs to (tolerates a start delayed past midnight)
                  day = (now - datetime.timedelta(hours=12)).date()
                  minute, hour = (int(x) for x in sched.split()[:2])
                  local = datetime.datetime.combine(day, datetime.time(hour, minute), datetime.timezone.utc)
                  local = local.astimezone(zoneinfo.ZoneInfo("Asia/Jerusalem"))
                  start = datetime.date.fromisoformat(os.environ["RESEARCH_START"])
                  if (local.hour, local.minute) != (23, 59):
                      log(f"{sched}: not 23:59 in Jerusalem this week ({local:%H:%M %Z}); skipping")
                  elif local.date() < start:
                      log(f"{local.date()}: before RESEARCH_START {start}; skipping")
                  elif local.day > 7:
                      log(f"{local.date()}: not the first Thursday of the month; skipping")
                  else:
                      req = "all"
          import subprocess
          shards = json.loads(subprocess.run(
              ["python3", ".github/scripts/algorithm_audit_drift.py", "--inventory-shards"],
              capture_output=True, text=True, check=True).stdout)
          # inventory.1 ... inventory.N (~25 items each) over code changed since the last full
          # inventory review (audits/inventory_reviewed.json); a shard with no items is not run
          inv = [k for k, v in shards.items() if v["new_symbols"] or v["changed_entries"]]
          log(f"inventory: {sum(len(v['new_symbols']) + len(v['changed_entries']) for v in shards.values())} "
              f"items since {next(iter(shards.values())).get('since_commit') or 'the day window'}")
          allowed = list(batches) + inv
          if req == "none":
              tasks = []
          elif req == "all":
              tasks = allowed
          elif req == "changed":
              # owner, 2026-11-17: research only what changed since the last run
              need = json.loads(subprocess.run(
                  ["python3", ".github/scripts/algorithm_audit_drift.py", "--research-needed"],
                  capture_output=True, text=True, check=True).stdout)
              for p, why in need.items():
                  log(f"research {p}: {why}")
              tasks = [b for b in batches if b in need] + inv
          else:
              import csv
              by_row = {}  # audit row letter -> problems with an entry in that row
              with open("R/package_metadata/audits/algorithm_inventory.csv", newline="") as fh:
                  for e in csv.DictReader(fh):
                      for r in (x.strip() for x in e["audit_row"].split("+")):
                          if e.get("problem_id"):
                              by_row.setdefault(r, set()).add(e["problem_id"])
              tasks = []
              for t in (x.strip() for x in req.split(",") if x.strip()):
                  if t == "inventory":
                      tasks += inv
                  elif t in allowed:
                      tasks.append(t)
                  elif t in rows and by_row.get(t):
                      tasks += sorted(by_row[t])
                  else:
                      raise SystemExit(f"unknown research task {t!r}; use a problem id from "
                                       "algorithm_taxonomy.json, an audit row letter (all its "
                                       f"problems: {','.join(rows)}), 'inventory', 'all' or 'none'")
              tasks = list(dict.fromkeys(tasks))
          log(f"research tasks ({len(tasks)}): {tasks}")
          print("tasks=" + json.dumps(tasks))
          print("task_list=" + ",".join(tasks))
          PY

      # Research lock (owner, 2026-11-16). Two research runs must not overlap: each opens a PR
      # editing the same inventory CSVs. A workflow-level `concurrency:` group is not used because
      # GitHub keeps one pending run per group and cancels the older one, so the weekly no-op
      # Thursday trigger could cancel a real scheduled research run queued behind a manual one.
      # Instead, a run that will do research waits here while any EARLIER run of this workflow
      # still has research or research-pr jobs unfinished. Runs without research never wait or
      # block, nothing is cancelled, and only earlier runs are waited on, so no deadlock.
      - name: Wait for earlier research runs
        if: ${{ steps.plan.outputs.tasks != '[]' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, time
          repo, me = os.environ["GITHUB_REPOSITORY"], int(os.environ["GITHUB_RUN_ID"])

          def api(path):
              out = subprocess.run(["gh", "api", path], capture_output=True, text=True)
              if out.returncode:
                  raise RuntimeError(out.stderr.strip())
              return json.loads(out.stdout)

          def blockers():
              runs = []
              for status in ("in_progress", "queued", "waiting"):
                  runs += api(f"repos/{repo}/actions/workflows/algorithm-audit-drift.yml/runs"
                              f"?status={status}&per_page=50")["workflow_runs"]
              found = []
              for r in runs:
                  if r["id"] >= me:  # only earlier runs (run ids increase), so no deadlock
                      continue
                  jobs = api(f"repos/{repo}/actions/runs/{r['id']}/jobs?per_page=100")["jobs"]
                  busy = [j["name"] for j in jobs if j["status"] != "completed"
                          and (j["name"].startswith("research (") or j["name"] == "research-pr")]
                  if busy:
                      found.append((r["id"], len(busy)))
              return found

          while True:
              try:
                  b = blockers()
              except RuntimeError as e:  # API trouble: do not block research on it
                  print(f"could not check earlier runs ({e}); continuing", file=sys.stderr)
                  break
              if not b:
                  break
              print(f"waiting for earlier research run(s): {b}", file=sys.stderr)
              time.sleep(60)
          PY

  research:
    needs: plan
    if: ${{ needs.plan.outputs.tasks != '[]' }}
    runs-on: ubuntu-latest
    # Max turns 100 (owner, 2026-11-16; was 80): the problem trials used up to 65 of 80.
    # Slowest research job in the 2026-11-16 full run: 5.7 min (median 3.3, max 52 of 80
    # turns). 20 min is >3x that and caps a stuck or looping agent's usage (owner, 2026-11-16).
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    env:
      TASK: ${{ matrix.task }}
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the currency task reads the last month of history

      - name: Prepare task context
        id: prep
        run: |
          mkdir -p research
          if [ "${TASK%%.*}" = inventory ]; then
            python3 .github/scripts/algorithm_audit_drift.py --inventory-shards --out shards.json
            python3 -c "import json,os; json.dump(json.load(open('shards.json'))[os.environ['TASK']], open('currency_context.json','w'), indent=1)"
            python3 .github/scripts/algorithm_audit_drift.py --code-changes "$TASK" --out code_changes.diff
            prompt_file=.github/prompts/algorithm_audit_currency.md
            schema=.github/prompts/algorithm_audit_currency.schema.json
            what="the inventory currency check"
            # mostly sorting new functions into plumbing vs algorithm: Sonnet at medium effort
            model=claude-sonnet-5-5
            extra_args="--effort medium"
          else
            # one research task per problem (owner, 2026-11-16): the taxonomy slice, the
            # problem's inventory rows, and its previous result (research_log.json)
            python3 .github/scripts/algorithm_audit_drift.py --task-problem "$TASK" --out task_problem.json
            python3 - <<'PY'
          import csv, os, sys
          sys.path.insert(0, ".github/scripts")
          import algorithm_audit_drift as drift
          task = os.environ["TASK"]
          rows = drift.load_inventory()
          keep = drift.task_rows(task, rows)  # + collected methods' rows (dense-linear-algebra)
          with open("row_entries.csv", "w", newline="") as fh:
              w = csv.DictWriter(fh, fieldnames=list(rows[0]))
              w.writeheader()
              w.writerows(keep)
          print(f"problem {task}: {len(keep)} inventory entries")
          PY
            python3 .github/scripts/algorithm_audit_drift.py --previous-results "$TASK" \
              --out previous_results.json
            # agents have no shell (owner, 2026-11-16: --allowedTools did not restrict Bash),
            # so the code changes since the last research are precomputed
            python3 .github/scripts/algorithm_audit_drift.py --code-changes "$TASK" --out code_changes.diff
            prompt_file=.github/prompts/algorithm_audit_research.md
            schema=.github/prompts/algorithm_audit_research.schema.json
            what="research problem $TASK"
            # judgement-heavy web research: Opus at the default effort (owner, 2026-11-16),
            # with the research method appended to the system prompt
            model=claude-opus-5-5
            extra_args="--append-system-prompt-file .github/prompts/research_agent_CLAUDE.md"
          fi
          {
            echo "what=$what"
            echo "model=$model"
            echo "extra_args=$extra_args"
            echo "prompt_file=$prompt_file"
            echo "schema=$(jq -c . "$schema")"
          } >> "$GITHUB_OUTPUT"

      - name: No API key
        if: ${{ env.HAS_KEY != 'true' }}
        run: echo "neither the ANTHROPIC_API_KEY nor the CLAUDE_CODE_OAUTH_TOKEN repository secret is set" > "research/$TASK.notrun"

      # Tool policy (owner, 2026-11-16): agents get Read/Glob/Grep/WebSearch/WebFetch only. In run
      # 43925959437 an agent ran cat, mkdir, sed and authenticated `gh api` calls although
      # --allowedTools listed only Bash(git log/show/diff:*): the allow list did not restrict
      # Bash, so Bash is now denied outright (deny rules always win), and Read is denied on paths
      # that could expose credentials (/proc environ, ~/.config, ~/.ssh), since agents read
      # untrusted web pages.
      - name: Run the research agent
        id: claude
        if: ${{ env.HAS_KEY == 'true' }}
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Read ${{ steps.prep.outputs.prompt_file }} and follow it exactly.
            Your task: ${{ steps.prep.outputs.what }}. Today is the run date of this workflow.
            Repository: ${{ github.repository }}, commit ${{ github.sha }}.
          claude_args: |
            --allowedTools "Read,Glob,Grep,WebSearch,WebFetch"
            --disallowedTools "Bash,Agent,Task,Edit,Write,NotebookEdit,Read(//proc/**),Read(//sys/**),Read(//etc/**),Read(~/.config/**),Read(~/.ssh/**),Read(~/.claude/.credentials.json)"
            --model ${{ steps.prep.outputs.model }}
            ${{ steps.prep.outputs.extra_args }}
            --max-turns 100
            --json-schema '${{ steps.prep.outputs.schema }}'

      - name: Save the agent's output
        if: ${{ always() && env.HAS_KEY == 'true' }}
        env:
          OUT: ${{ steps.claude.outputs.structured_output }}
          OUTCOME: ${{ steps.claude.outcome }}
          TRANSCRIPT: ${{ steps.claude.outputs.execution_file }}
        run: |
          if [ -n "$OUT" ]; then
            printf '%s' "$OUT" > "research/$TASK.json"
          else
            echo "agent produced no structured output (step outcome: $OUTCOME)" > "research/$TASK.notrun"
          fi
          # what the agent actually searched, from its transcript (owner, 2026-11-16)
          mkdir -p transcript
          if [ -n "$TRANSCRIPT" ] && [ -f "$TRANSCRIPT" ]; then
            cp "$TRANSCRIPT" "transcript/$TASK.json"
            python3 .github/scripts/algorithm_audit_search_log.py extract --task "$TASK" \
              --transcript "$TRANSCRIPT" --out "research/$TASK.searches.json"
          fi

      # Full transcript (prompts, every tool call and result) for auditing the research method.
      # An artifact, not the public Actions log (the action's show_full_output would print it there).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: transcript-${{ matrix.task }}
          path: transcript/
          retention-days: 90
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: research-${{ matrix.task }}
          path: research/

  research-pr:
    # Research results land in the repo, not in an issue: one pull request per run with
    # R/package_metadata/audits/research_findings/<date>-run<id>.md and the inventory changes the
    # inventory agent proposed (verified refs only; verdicts never touched).
    needs: [plan, research]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.tasks != '[]' }}
    runs-on: ubuntu-latest
    # 2 tasks took 78 s (2026-11-16); a full run adds a publisher + OpenAlex lookup per cited DOI
    # and the online inventory check, so leave room.
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write   # creating the PR label
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: algorithm-audit-research
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the PR step rebases onto the latest main (see there)

      - uses: actions/download-artifact@v8
        with:
          pattern: research-*
          path: research
          merge-multiple: true

      - name: Apply the agents' output
        id: apply
        run: |
          mkdir -p research
          python3 .github/scripts/algorithm_audit_drift.py --research-batches --out batches.json
          status=$(python3 .github/scripts/algorithm_audit_research_apply.py --dir research \
            --tasks "${{ needs.plan.outputs.task_list }}" --batches batches.json \
            --run-id "$GITHUB_RUN_ID" --pr-body pr_body.md)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          # validate what was written; the result goes into the PR body (required checks do not
          # run on a PR opened with GITHUB_TOKEN)
          python3 .github/scripts/algorithm_audit_drift.py --out drift_now.md
          { echo; echo "Inventory check on this branch (online):"; echo;
            sed -n '/^## 4\./,$p' drift_now.md | tail -n +2; } >> pr_body.md

      - uses: actions/upload-artifact@v7
        with:
          name: research-findings
          path: |
            R/package_metadata/audits/research_findings/
            pr_body.md
          if-no-files-found: ignore

      - name: Open the pull request
        if: ${{ steps.apply.outputs.status == 'CHANGES' }}
        env:
          DATE: ${{ steps.apply.outputs.date }}
        run: |
          branch="algorithm-research/$DATE-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add R/package_metadata/audits/research_findings/ \
            R/package_metadata/audits/algorithm_inventory.csv \
            R/package_metadata/audits/algorithm_references.csv \
            R/package_metadata/audits/research_log.json \
            R/package_metadata/audits/inventory_reviewed.json \
            R/package_metadata/audits/algorithm_taxonomy.json
          git commit -m "Algorithm research $DATE: findings and inventory updates" \
            -m "Generated by the research job of algorithm-audit-drift.yml (run $GITHUB_RUN_ID)."
          # Rebase onto the latest main before pushing (run 44040196501, 2026-11-17). This job
          # checks out the run's commit; if main gained workflow changes while the agents ran,
          # GitHub reads the new branch as changing those workflows and refuses the push, since
          # GITHUB_TOKEN may not touch .github/workflows. A rebase is a textual merge of the audit
          # files (a line merge once broke the taxonomy JSON, PR #14), so a conflict stops here
          # and the JSON is re-validated after the rebase.
          git fetch --quiet origin main
          if ! git rebase origin/main; then
            git rebase --abort
            echo "::error::main changed the same audit files while the research ran; rebase the results by hand (artifacts are kept)"
            exit 1
          fi
          for f in R/package_metadata/audits/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              || { echo "::error::$f is not valid JSON after the rebase"; exit 1; }
          done
          python3 .github/scripts/algorithm_audit_drift.py --offline | head -1
          git push origin "$branch"
          gh label create "$LABEL" --color C5DEF5 \
            --description "Algorithm research findings and inventory updates" 2>/dev/null || true
          open_prs=$(gh pr list --label "$LABEL" --state open --json number --jq '[.[].number|tostring|"#"+.]|join(", ")')
          if [ -n "$open_prs" ]; then
            printf '\nEarlier research PRs still open: %s\n' "$open_prs" >> pr_body.md
          fi
          gh pr create --base main --head "$branch" --label "$LABEL" \
            --title "Algorithm research $DATE" --body-file pr_body.md
