name: python-tests

# Pass/fail signal for edi_kernels: a plain editable build + pytest run. It is
# called by build-wheels.yml on main/release pushes so it participates in the
# PyPI dependency graph, and also runs directly on relevant pull requests.
# This is the Python-side analog of R-CMD-check.yaml -- fast dev-loop
# correctness, no coverage instrumentation (see test-coverage-python.yml).
#
# Kept as a reusable workflow rather than copying the commands into the
# release workflow, so pull-request and release validation cannot drift.
#
# Package root is python/ (pyproject.toml lives there), since this repo
# also holds the unrelated R package (R/EDI/) and paper-reproduction code.

on:
  workflow_call:
  pull_request:
    branches: [main, master]
    paths:
      - 'python/**'
      - 'R/EDI/src/**/*.cpp'
      - 'R/EDI/src/**/*.h'
      - 'R/EDI/src/**/*.hpp'
      - '.github/workflows/python-tests.yml'
      - '.github/workflows/build-wheels.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # manylinux wheel builds (build-wheels.yml) get BLAS from the
      # manylinux_2_28 image's openblas-devel; a plain ubuntu-latest runner
      # needs the same system package explicitly (see CMakeLists.txt's
      # find_package(BLAS)).
      - name: Install system BLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Install edi_kernels (editable) + test deps
        run: pip install -e "./python[test]"

      - name: Run tests
        working-directory: python
        run: python -m pytest tests -q
