name: python-tests

# Pass/fail signal for edi_kernels: a plain editable build + pytest run on
# every push/PR that touches the Python bindings or the C++ kernels they
# wrap. This is the Python-side analog of R-CMD-check.yaml -- fast dev-loop
# correctness, no coverage instrumentation (see test-coverage-python.yml for
# that, same split as R-CMD-check.yaml vs. test-coverage-R.yaml on the R side).
#
# Deliberately separate from build-wheels.yml, which builds real
# distributable wheels across macOS/Windows/Linux via cibuildwheel (and
# already runs this same test suite once per wheel as part of that) but only
# on push to main or a `py-v*` tag -- not on every PR.
#
# Package root is python/ (pyproject.toml lives there), since this repo
# also holds the unrelated R package (R/EDI/) and paper-reproduction code.

on:
  push:
    branches: [main, master]
    paths: &python-test-paths
      - 'python/**'
      - 'R/EDI/src/**/*.cpp'
      - 'R/EDI/src/**/*.h'
      - 'R/EDI/src/**/*.hpp'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [main, master]
    paths: *python-test-paths

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # manylinux wheel builds (build-wheels.yml) get BLAS from the
      # manylinux_2_28 image's openblas-devel; a plain ubuntu-latest runner
      # needs the same system package explicitly (see CMakeLists.txt's
      # find_package(BLAS)).
      - name: Install system BLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Install edi_kernels (editable) + test deps
        run: pip install -e "./python[test]"

      - name: Run tests
        working-directory: python
        run: python -m pytest tests -q
