on:
  push:
    branches: [main, master]
    paths: &r-coverage-paths
      - 'R/EDI/**/*.R'
      - 'R/EDI/**/*.cpp'
      - 'R/EDI/**/*.h'
      - 'R/EDI/**/*.hpp'
      - 'R/EDI/DESCRIPTION'
      - 'R/EDI/tests/**'
      - '.github/workflows/test-coverage.yaml'
  pull_request:
    branches: [main, master]
    paths: *r-coverage-paths

name: test-coverage

# Standard r-lib/covr coverage run for the EDI R package (see
# R-CMD-check.yaml's identical working-directory: R/EDI note -- this repo
# also holds an unrelated Python-bindings subproject checked by
# python-tests.yml). Runs the testthat suite once under covr instrumentation
# and uploads the result to Codecov, tagged with the `r` flag so it doesn't
# get averaged together with the Python coverage number under the same
# project (see codecov.yml).

jobs:
  test-coverage:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      EDI_PORTABLE: 1

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/EDI
          extra-packages: any::covr
          needs: coverage

      - name: Test coverage
        working-directory: R/EDI
        run: |
          covr::codecov(
            quiet = FALSE,
            token = Sys.getenv("CODECOV_TOKEN"),
            flags = "r"
          )
        shell: Rscript {0}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: find R/EDI -name 'testthat.Rout*' -exec cat '{}' \;
