on:
  push:
    branches: [main, master]
    paths:
      - 'R/EDI/R/**'
      - 'R/EDI/man/**'
      - 'R/EDI/vignettes/**'
      - 'R/EDI/DESCRIPTION'
      - 'R/EDI/NAMESPACE'
      - 'R/EDI/_pkgdown.yml'
      - 'R/EDI/README.md'
      - 'R/EDI/pkgdown/**'
      - 'R/EDI/NEWS.md'
      - 'R/EDI/REFERENCES.md'
      - '.github/workflows/pkgdown.yaml'
  workflow_dispatch:

name: pkgdown

# Builds the pkgdown documentation site for the EDI R package (R/EDI, not the
# repo root -- see R-CMD-check.yaml's identical working-directory note) and
# publishes it to GitHub Pages at https://kapelner.github.io/EDI/ (the URL
# R/EDI/_pkgdown.yml already declares). Deployment uses the GitHub-Actions
#-native Pages flow (upload-pages-artifact + deploy-pages) rather than a
# gh-pages branch, so the repo's Pages setting must be (and is) configured
# with build_type "workflow".
#
# Building the site requires installing the package (examples in Rd files and
# vignettes execute EDI code), which compiles the full src/ C++ tree -- hence
# the same EDI_PORTABLE=1 and Ubuntu OpenBLAS swap the check workflows use,
# and a generous timeout.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      EDI_PORTABLE: 1

    steps:
      - uses: actions/checkout@v7

      # See R-CMD-check's identical step for why: reference BLAS is 10-50x
      # slower than OpenBLAS for the linear-algebra-heavy fits that vignette
      # and example code in the reference pages execute during the site build.
      - name: Switch to OpenBLAS (see R-CMD-check's identical step for why)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libopenblas0-pthread
          sudo update-alternatives --set libblas.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/openblas-pthread/libblas.so.3
          sudo update-alternatives --set liblapack.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/openblas-pthread/liblapack.so.3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/EDI
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build pkgdown site
        run: pkgdown::build_site_github_pages(pkg = "R/EDI", new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: R/EDI/docs

  deploy:
    needs: pkgdown
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
