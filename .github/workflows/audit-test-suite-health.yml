# Test-suite health audit: weekly, Tuesday 06:07 UTC. Mechanical only (no Claude).
# Checks R/EDI/tests/testthat and R/package_tests/testthat_bulk for test_that() blocks with no
# expectation, skip() calls that always run, skip_if()/skip_on_os() calls whose literal arguments
# never lift, test files named for a TODO number, and test files that flip between pass and fail
# in the last 8 weeks of test-bulk-non-cran.yml runs. The R files are only parsed; EDI is not built.
# Reports with ONE pull request (label `audit-test-suite-health`): it renames TODO-numbered test
# files; the other findings are mechanical findings, tracked in the report and the audit-decisions
# issue until fixed, cited by an open release TODO or dismissed. It removes and skips nothing.
# Module: .github/scripts/audits/test_suite_health.py.
# Plan: R/package_metadata/new_feature_plans/v1_0_6/audit_jobs_framework.md (Part 4).

name: audit · weekly · test-suite-health

on:
  schedule:
    - cron: "7 6 * * 2"
  workflow_dispatch:
    inputs:
      scope:
        description: "auto (changed + rotation), all (full pass), none (mechanical checks only)"
        type: choice
        options: [auto, all, none]
        default: auto

jobs:
  audit:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read      # the reusable prepare job reads run data
    uses: ./.github/workflows/audit.yml
    with:
      audit: test-suite-health
      nth: 0
      scope: ${{ inputs.scope || 'auto' }}
      setup_r: true
    secrets: inherit
