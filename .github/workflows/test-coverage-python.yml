name: test-coverage-python

# The sole Python correctness + coverage signal for edi_kernels: runs the
# pytest suite under pytest-cov and uploads the result to Codecov, tagged
# with the `python` flag (see codecov.yml). A plain (non-coverage) pytest
# job used to run alongside this one in python-tests.yml, but --cov reports
# the identical pass/fail signal on top of the coverage data, so that
# separate job was folded into this one (2026-09-18) rather than paying for
# the same test run twice. Called by build-wheels.yml on main/release
# pushes so a test failure blocks publishing, and also runs directly on
# relevant pull requests. Upload failure remains non-blocking; test failure
# is blocking.
#
# Package root is python/ (pyproject.toml lives there), since this repo
# also holds the unrelated R package (R/EDI/) and paper-reproduction code.

on:
  workflow_call:
  pull_request:
    branches: [main, master]
    paths:
      - 'python/**'
      - 'R/EDI/src/**/*.cpp'
      - 'R/EDI/src/**/*.h'
      - 'R/EDI/src/**/*.hpp'
      - '.github/workflows/test-coverage-python.yml'
      - '.github/workflows/build-wheels.yml'

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # manylinux wheel builds (build-wheels.yml) get BLAS from the
      # manylinux_2_28 image's openblas-devel; a plain ubuntu-latest runner
      # needs the same system package explicitly (see CMakeLists.txt's
      # find_package(BLAS)).
      - name: Install system BLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Install edi_kernels (editable) + test deps
        run: pip install -e "./python[test]"

      - name: Run tests with coverage
        working-directory: python
        run: python -m pytest tests -q --cov=edi_kernels --cov-report=xml

      - name: Check coverage floor script
        run: python3 R/package_tests/ci/test_check_coverage_floor.py

      - name: Check coverage floor (must not drop below best-ever, TODO-9)
        run: python3 R/package_tests/ci/check_coverage_floor.py python/coverage.xml R/package_tests/ci/coverage_baseline.json python

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: python/coverage.xml
          flags: python
          fail_ci_if_error: false
