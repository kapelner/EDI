# Pre-installs this repo's environment for GitHub's Copilot coding agent
# (an @copilot mention on an issue/PR, or an assigned issue) before it
# starts working, the same way .devcontainer/ does for a local/Codespaces
# devcontainer. The job name is load-bearing: GitHub recognizes a workflow
# in this exact path with a job literally named `copilot-setup-steps` and
# runs it to prepare the agent's firewalled container -- see
# https://docs.github.com/en/copilot/how-tos/agents/copilot-coding-agent/customizing-the-development-environment-for-copilot-coding-agent
#
# Mirrors R-CMD-check.yaml's dependency-install step and
# test-coverage-python.yml's setup exactly, so this doesn't drift into its
# own, unverified environment
# definition. Deliberately does NOT install/build R/EDI itself (unlike
# .devcontainer/post-create.sh) -- Copilot's coding agent starts a fresh
# container per task from this same prepared image, so paying that cost
# here on every setup is wasted; the agent's own task can build R/EDI in
# whatever way a specific task calls for (which is also why this doesn't
# violate AGENTS.md's "ask before compiling" rule -- installing
# dependencies is not compiling EDI itself).
name: "Copilot Setup Steps"

on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Name required verbatim by GitHub's Copilot coding agent integration.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/EDI
          extra-packages: any::rcmdcheck any::pak
          needs: check

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # See test-coverage-python.yml's identical step for why this is needed
      # on a plain ubuntu-latest runner (CMakeLists.txt's find_package(BLAS)).
      - name: Install system BLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Install edi_kernels (editable) + test deps
        run: pip install -e "./python[test]"
