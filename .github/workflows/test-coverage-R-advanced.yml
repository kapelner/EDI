name: test-coverage-R-advanced

# Advanced EDI R coverage/gate harness built from
# R/package_metadata/finished_features/comprehensive_test_suite.md. This is
# intentionally separate from test-coverage-R.yaml: it runs the comprehensive
# package_tests/ orchestration, unified analyzer, and quality gates rather than
# covr/testthat line coverage.

on:
  push:
    branches: [main, master]
    paths: &r-advanced-coverage-paths
      - 'R/EDI/**/*.R'
      - 'R/EDI/**/*.Rd'
      - 'R/EDI/**/*.cpp'
      - 'R/EDI/**/*.h'
      - 'R/EDI/**/*.hpp'
      - 'R/EDI/DESCRIPTION'
      - 'R/EDI/NAMESPACE'
      - 'R/EDI/tests/**'
      - 'R/package_tests/**'
      - 'R/package_metadata/finished_features/comprehensive_test_suite.md'
      - '.github/workflows/test-coverage-R-advanced.yml'
  pull_request:
    branches: [main, master]
    paths: *r-advanced-coverage-paths
  workflow_dispatch: {}

jobs:
  test-coverage-R-advanced:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      EDI_PORTABLE: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      GOTO_NUM_THREADS: 1
      VECLIB_MAXIMUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1

    steps:
      - uses: actions/checkout@v7

      # apt's own package cache. setup-r-dependencies@v2 below installs this
      # workflow's system requirements (cmake, libsuitesparse, libgraphblas,
      # libgsl, libglpk, pandoc, ...) via `apt-get install`, which normally
      # re-fetches every .deb from the Ubuntu mirror on every run. apt checks
      # this directory for an already-downloaded, valid .deb before hitting
      # the network, so warming it here means a slow-mirror day (seen
      # 2026-09-02: pandoc alone took 13 minutes at 35.7 kB/s, eating most of
      # the 45-minute job timeout) only pays the network cost once instead of
      # every run. Keyed on the R/EDI DESCRIPTION hash since that's what
      # determines the sysreqs set; restore-keys falls back to the newest
      # cache on a miss (e.g. after DESCRIPTION changes) so we still get a
      # partial warm cache rather than starting cold.
      - name: Cache apt package archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-archives-${{ runner.os }}-r-advanced-${{ hashFiles('R/EDI/DESCRIPTION') }}
          restore-keys: |
            apt-archives-${{ runner.os }}-r-advanced-

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/EDI
          dependencies: '"all"'
          extra-packages: any::rcmdcheck

      - name: Install EDI
        # Installed into a job-local scratch library, NOT the default
        # .libPaths()[1] (== R_LIBS_USER, the directory
        # r-lib/actions/setup-r-dependencies@v2 caches via actions/cache).
        # That dependency cache is keyed only by OS + R version + the
        # dependency lockfile hash -- not by workflow -- so it's shared with
        # test-bulk-non-cran.yml, which uses the identical working-directory/
        # dependencies spec above. A plain `R CMD INSTALL R/EDI` (no
        # --library=) installs into that shared cache and gets persisted
        # there, so a later run of test-bulk-non-cran.yml (or any other
        # workflow sharing this cache key) silently inherits a stale
        # compiled EDI build from whatever commit this job last ran against.
        #
        # Some of the steps below (public_api_inventory.R) load EDI via
        # pkgload::load_all(..., compile = FALSE) straight from R/EDI/src, so
        # for those this step exists only to compile R/EDI/src/*.so in place.
        # But others -- generate_public_argument_combinations.R and its
        # siblings, via public_argument_combination_fixtures.R's
        # load_edi_for_fixtures()/edi_export() -- use plain
        # requireNamespace("EDI")/getExportedValue(), which resolve against
        # whatever's on .libPaths(), NOT the source tree. Prepending this
        # scratch library to R_LIBS (ahead of R_LIBS_USER, which R resolves
        # before it -- see ?Startup) makes those calls resolve to the build
        # this step just produced instead of silently falling through to
        # whatever stale EDI happens to already be sitting in the cached
        # R_LIBS_USER directory (see the 2026-08-25 test-bulk-non-cran.yml/
        # test-coverage-R-advanced.yml CI failures this was written to fix:
        # "object '_EDI_...' not found", then later "unused arguments
        # (y_Ls = ..., y_Rs = ...)", both from code running against a stale
        # compiled EDI instead of the current commit's).
        run: |
          mkdir -p "${{ runner.temp }}/edi-install-scratch"
          R CMD INSTALL --library="${{ runner.temp }}/edi-install-scratch" R/EDI
          echo "R_LIBS=${{ runner.temp }}/edi-install-scratch${R_LIBS:+:$R_LIBS}" >> "$GITHUB_ENV"

      # The steps below regenerate every package_tests/ artifact that's derived from
      # live introspection of EDI's public API (public_api_inventory.R uses
      # pkgload::load_all(), so it reflects the *current* checked-out source, not
      # whatever was true when these CSVs were last committed). run_comprehensive_suite.R's
      # own dependency check (further down) only verifies these files *exist* -- it has
      # no way to tell a stale committed copy from a fresh one, so a public signature
      # change (e.g. adding y_L/y_R to a design's add_one_subject_response()) could
      # silently go unreflected in the inventory/registry/argument-combination artifacts
      # forever unless something regenerates and diffs them. That's what these steps do.
      - name: Rebuild public API inventory + checkmate contracts
        working-directory: R
        run: |
          Rscript package_tests/public_api_inventory.R
          Rscript package_tests/extract_checkmate_argument_contracts.R
          Rscript package_tests/public_argument_contract_registry.R

      # Documented as the "Primary commands" sequence in
      # R/package_tests/public_argument_combination_runner.md.
      - name: Rebuild argument-combination family
        working-directory: R
        run: |
          Rscript package_tests/generate_public_argument_combinations.R
          Rscript package_tests/run_public_argument_combinations.R
          Rscript package_tests/analyze_public_argument_combinations.R
          Rscript package_tests/public_argument_combination_integration.R
          Rscript package_tests/check_public_argument_combination_quality_gates.R report

      # comprehensive_suite_registry.R and audit_comprehensive_suite_baseline.R both
      # read public_argument_combination_coverage.csv (just rebuilt above), so they
      # have to run after the argument-combination family, not before it.
      # audit_comprehensive_suite_baseline.R must run BEFORE comprehensive_suite_registry.R:
      # the registry script reads comprehensive_suite_baseline_audit.csv as an input, and
      # the baseline-audit script is what regenerates that file from the current
      # public_api_inventory.csv. Running them in the other order silently builds the
      # registry from a stale baseline audit (missing any API added/changed since that
      # file was last committed) and was the root cause of a mass of spurious
      # "public_api_missing_from_registry" hard-gate failures.
      - name: Rebuild baseline audit + registry
        working-directory: R
        run: |
          Rscript package_tests/audit_comprehensive_suite_baseline.R
          Rscript package_tests/comprehensive_suite_registry.R

      # comprehensive_suite_internal_surfaces.R reads comprehensive_suite_baseline_audit.csv
      # and comprehensive_suite_registry.csv (both just rebuilt above), so it has to run
      # after them. It maps internal (non-exported) symbols to the testthat files that
      # exercise them; letting it drift after baseline_audit/registry regenerate produces
      # spurious "internal_safety_net_missing" hard-gate failures for any newly added
      # internal testthat coverage.
      - name: Rebuild internal safety-net surfaces
        working-directory: R
        run: Rscript package_tests/comprehensive_suite_internal_surfaces.R

      # Fail the build if regenerating from current source produced anything different
      # from what's committed -- the actual "did someone forget to refresh these after
      # an API change" check. comprehensive_suite_exemptions.csv is deliberately excluded:
      # audit_comprehensive_suite_baseline.R stamps it with `created_date = Sys.Date()`
      # on every run, so it would always show a diff regardless of any real content
      # change, and its reason/owner/expiry_date columns are scaffolding meant for
      # later human review, not something this check should gate on.
      - name: Fail if regenerated artifacts drifted from what's committed
        working-directory: R
        run: |
          drift_files=(
            package_tests/public_api_inventory.csv
            package_tests/public_argument_baseline_gap_report.csv
            package_tests/checkmate_argument_contracts.csv
            package_tests/public_argument_combination_cases.csv
            package_tests/public_argument_combination_rejected_candidates.csv
            package_tests/public_argument_combination_coverage.csv
            package_tests/public_argument_combination_results.csv
            package_tests/public_argument_combination_failures.csv
            package_tests/public_argument_combination_uncovered_apis.csv
            package_tests/public_argument_combination_registry_drift.csv
            package_tests/public_argument_combination_slowest_cases.csv
            package_tests/public_argument_combination_ci_failure_summary.csv
            package_tests/public_argument_combination_cases_integrated.csv
            package_tests/public_argument_combination_results_integrated.csv
            package_tests/public_argument_combination_coverage_integrated.csv
            package_tests/public_argument_combination_quality_gates.csv
            package_tests/public_argument_combination_quality_gate_summary.csv
            package_tests/comprehensive_suite_registry.csv
            package_tests/comprehensive_suite_baseline_audit.csv
            package_tests/comprehensive_suite_internal_surfaces.csv
          )
          if ! git diff --exit-code -- "${drift_files[@]}"; then
            echo "::error::package_tests/ generated artifacts are stale relative to current source (diff above). Regenerate locally (see the 'Rebuild ...' steps in this workflow, or R/package_tests/public_argument_combination_runner.md) and commit the updated CSVs."
            exit 1
          fi

      - name: Run comprehensive suite smoke tier
        working-directory: R
        run: Rscript package_tests/run_comprehensive_suite.R smoke "" 300 --force

      - name: Analyze comprehensive suite coverage
        working-directory: R
        run: Rscript package_tests/analyze_comprehensive_suite.R

      - name: Run comprehensive suite quality gates
        working-directory: R
        run: Rscript package_tests/check_comprehensive_suite_quality_gates.R ci

      - name: Upload comprehensive suite artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comprehensive-suite-r-advanced
          path: |
            R/package_tests/comprehensive_suite_results.csv
            R/package_tests/comprehensive_suite_failures.csv
            R/package_tests/comprehensive_suite_coverage.csv
            R/package_tests/comprehensive_suite_report.html
            R/package_tests/comprehensive_suite_quality_gates.csv
            R/package_tests/comprehensive_suite_quality_gate_summary.csv
            R/package_tests/comprehensive_suite_workflow_coverage.csv
