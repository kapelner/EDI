name: Build edi_kernels wheels

# Runs every release-blocking validation and builds portable (non
# -march=native) wheels for the edi_kernels Python package -- see
# python/pyproject.toml's [tool.cibuildwheel] and
# R/package_metadata/python_bindings_package_spec.md's "Building portable
# wheels" checklist. A manual (workflow_dispatch) run executes the complete
# validation graph and uploads wheels/sdist as CI artifacts, but never
# publishes. On an actual `py-v*` tag push, the `publish` job additionally
# uploads them to PyPI via Trusted
# Publishing (OIDC, no stored API token) -- see that doc's "Publishing"
# checklist item. Kept as one dependency graph (tests, coverage, wheels,
# x86_64 sdist, ARM sdist, then a tag-gated publish job) so no independent
# workflow can fail after PyPI publishing has already started.
#
# The package root is python/ (pyproject.toml lives there, not at the repo
# root), since this repo also holds the unrelated R package (R/EDI/) and
# paper reproduction code -- every cibuildwheel step below is pointed at
# package-dir: python accordingly.
#
# One-time manual setup required before the first `py-v*` tag push (not
# something this workflow file can do on its own): register this repo as a
# Trusted Publisher for the `edi_kernels` PyPI project at
# https://pypi.org/manage/project/edi_kernels/settings/publishing/ (or, for
# a brand-new project name, https://pypi.org/manage/account/publishing/),
# with workflow name `build-wheels.yml` and environment name `pypi`
# (matching the `publish` job's `environment:` below).

on:
  push:
    tags:
      - "py-v*"
    # Runs on main too, but only when a push actually touches something that
    # can affect the wheel build or its C++ kernels -- without the `paths`
    # filter, every commit to main (including R-only changes, which are most
    # of them) would trigger the full 3-OS wheel matrix build. The `publish`
    # job below still only fires on an actual tag push, so a plain main push
    # can never trigger a PyPI upload.
    #
    # R/EDI/src/**/*.{cpp,h,hpp} is included because CMakeLists.txt compiles
    # those kernel sources directly into this extension (R/EDI/src is their
    # single source of truth, per the comment there) -- a change there is a
    # C++ change to this build even though the file lives under R/EDI/. Plain
    # R sources/docs (R/EDI/R, R/EDI/man, *.md reports, R/benchmark/*.R) do not
    # affect this build and are intentionally left out; **/*.py picks up
    # both the python/ package and cross-language integration scripts like
    # R/benchmark/benchmark_model_fits_python.py without also matching its
    # sibling .R/.md/.html files in that same directory.
    branches:
      - main
    paths:
      - "python/**"
      - "R/EDI/src/**/*.cpp"
      - "R/EDI/src/**/*.h"
      - "R/EDI/src/**/*.hpp"
      - "**/*.py"
      - ".github/workflows/build-wheels.yml"
      - ".github/workflows/python-tests.yml"
      - ".github/workflows/test-coverage-python.yml"
  workflow_dispatch: {}

jobs:
  python_tests:
    name: Python tests
    uses: ./.github/workflows/python-tests.yml

  python_coverage:
    name: Python coverage
    uses: ./.github/workflows/test-coverage-python.yml
    secrets: inherit

  build_wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: python

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        run: pipx run build --sdist --outdir dist python

      # Building the tarball only proves `python -m build --sdist` succeeded
      # as an archiving step -- it says nothing about whether the resulting
      # tarball can actually be built from source. This gap is exactly how
      # edi_kernels 1.0.0's sdist shipped broken and undetected: EDI_SRC_DIR
      # (CMakeLists.txt) pointed at ../R/EDI/src, which only exists as a
      # sibling of python/ in a live git checkout -- every wheel this
      # workflow builds comes from cibuildwheel building against that live
      # checkout, so the missing-sources problem never surfaced there either.
      # It only appears once the sdist is extracted somewhere standalone,
      # which is exactly what a real `pip install edi_kernels` does whenever
      # no prebuilt wheel matches (see
      # R/package_metadata/finished_features/python_bindings_package_spec.md's
      # TODO-12). Installing into a venv under /tmp, well outside
      # $GITHUB_WORKSPACE, reproduces that standalone-extraction condition
      # instead of accidentally building against the live checkout sitting
      # right next to it.
      - name: Verify sdist installs from source, isolated from the checkout
        run: |
          set -e
          SDIST=$(readlink -f dist/*.tar.gz)
          python -m venv /tmp/sdist_verify_venv
          /tmp/sdist_verify_venv/bin/pip install --upgrade pip
          /tmp/sdist_verify_venv/bin/pip install --no-binary edi_kernels "$SDIST"
          /tmp/sdist_verify_venv/bin/python -c "import edi_kernels; print('edi_kernels imported OK from', edi_kernels.__file__)"

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  arm_sdist_build:
    name: sdist on ${{ matrix.codename }} (py${{ matrix.python }}, armv7)
    needs: build_sdist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - codename: bullseye
            python: "3.9"
          - codename: bookworm
            python: "3.11"
          - codename: trixie
            python: "3.13"

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Set up QEMU (arm/v7)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      # piwheels builds the edi_kernels sdist on 32-bit Raspberry Pi systems,
      # but its configured package index supplies ARM wheels for dependencies
      # such as NumPy. The old parity job queried PyPI alone, so it tried (and
      # failed) to build NumPy before edi_kernels' CMake configure step. Use
      # piwheels as the extra index, require a NumPy wheel, and install the
      # native Python/Eigen headers plus pkg-config/BLAS needed by the
      # edi_kernels source build. Installing Eigen from Debian also keeps this
      # parity check independent of CMake's Git-based upstream fallback.
      # --no-binary remains scoped to edi_kernels itself.
      - name: Build and install sdist (piwheels-like ${{ matrix.codename }}, python${{ matrix.python }})
        run: |
          set -e
          docker run --rm \
            --platform linux/arm/v7 \
            -v "${{ github.workspace }}/dist:/dist:ro" \
            debian:${{ matrix.codename }} \
            bash -eux -c '
              apt-get update
              apt-get install -y --no-install-recommends python3 python3-dev python3-pip python3-venv build-essential cmake pkg-config libopenblas-dev libeigen3-dev ca-certificates
              python3 -m venv /tmp/venv
              /tmp/venv/bin/pip install --upgrade pip
              /tmp/venv/bin/pip install --extra-index-url https://www.piwheels.org/simple --only-binary=numpy "numpy>=1.24"
              SDIST=$(ls /dist/*.tar.gz | head -n1)
              /tmp/venv/bin/pip install --extra-index-url https://www.piwheels.org/simple --no-binary=edi_kernels "$SDIST"
              /tmp/venv/bin/python3 -c "import edi_kernels; print(\"edi_kernels imported OK from\", edi_kernels.__file__)"
            '

  publish:
    name: Publish to PyPI
    needs: [python_tests, python_coverage, build_wheels, build_sdist, arm_sdist_build]
    runs-on: ubuntu-latest
    # Only an actual tag push publishes -- a workflow_dispatch run (e.g. to
    # test the build matrix) never uploads anywhere.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/py-v')
    environment:
      # This environment is configured with a required reviewer, providing a
      # final manual approval after every automated dependency above passes.
      name: pypi
      url: https://pypi.org/p/edi_kernels
    permissions:
      # Trusted Publishing: this is the OIDC token PyPI exchanges for a
      # short-lived upload credential -- no PYPI_API_TOKEN secret needed or
      # wanted. See the one-time setup note at the top of this file.
      id-token: write

    steps:
      - name: Download all wheel + sdist artifacts into dist/
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
