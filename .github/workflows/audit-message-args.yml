# Message argument audit (weekly, Wednesday 07:07 UTC). No Claude, no R.
# Every argument name a stop(), warning() or message() string in R/EDI/R/*.R quotes as
# `name = ...` (backticked, \code{}, quoted, after "set" / "use" / "pass", or as "argument `name`")
# must be a formal of the enclosing function, of the class's initialize(), or of a public method of
# the class, its parents or its components. Code in a component is checked for every exported class
# that composes it, so a message only some of them can follow is reported with the classes that take
# no such argument (v1.0.6-TODO-73: DesignFixedBlockedCluster told to set equal_block_sizes).
# Reports in ONE issue (label `audit-message-args`), closed by the job on a clean run; nothing is
# edited. A false positive is dismissed by listing its id in
# R/package_metadata/audits/DISMISSED_DECISIONS.md.
# Module: .github/scripts/audits/message_args.py
# Plan: v1.0.6-TODO-96 (release_v1_0_6.md); framework:
# R/package_metadata/new_feature_plans/v1_0_6/audit_jobs_framework.md.

name: audit · weekly · message-args

on:
  schedule:
    - cron: "7 7 * * 3"     # weekly, Wednesday 07:07 UTC
  workflow_dispatch:
    inputs:
      scope:
        description: auto, all or none (this audit has no Claude stage, so all three behave the same)
        type: choice
        options: [auto, all, none]
        default: auto

permissions:
  contents: read

jobs:
  audit:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write     # prepare reads run data; finish deletes the bot's PR runs (audit_run.py drop_bot_pr_runs)
    uses: ./.github/workflows/audit.yml
    with:
      audit: message-args
      nth: 0
      scope: ${{ inputs.scope || 'auto' }}
      prepare_timeout: 15
    secrets: inherit
