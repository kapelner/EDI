# Source comment rot audit: monthly, 4th Sunday 06:00 UTC (a weekly Sunday cron; the gate keeps
# the 4th). Unit: one source file in R/EDI/R or R/EDI/src.
# Mechanical: TODO / FIXME / XXX notes that no release TODO cites.
# Claude (Sonnet, changed files + an 8-week rotation, 5 files per agent, at most 12 batches):
# comments that contradict the code beside them (a stated default, tolerance, formula, or
# always/never claim the code does not do), returned as the exact old line and the corrected one.
# Reports with ONE pull request (label `audit-source-comment-rot`). A comment line is replaced only
# when the old line occurs exactly once in its file and the code with comments removed is
# unchanged; a contradiction where the code may be the wrong side goes under "Needs a human".
# Needs the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret; without one, every batch is
# reported NOT RUN.
# Module: .github/scripts/audits/source_comment_rot.py; prompt: .github/prompts/audit_source_comment_rot.md.
# Plan: R/package_metadata/new_feature_plans/v1_0_6/audit_jobs_framework.md (Part 4).

name: audit-source-comment-rot

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      scope:
        description: "auto (changed + rotation), all (full pass), none (mechanical checks only)"
        type: choice
        options: [auto, all, none]
        default: auto

jobs:
  audit:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/audit.yml
    with:
      audit: source-comment-rot
      nth: 4
      scope: ${{ inputs.scope || 'auto' }}
    secrets: inherit
