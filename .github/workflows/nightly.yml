name: nightly

# Nightly test suites that no push workflow runs (owner rulings 2026-11-14):
#   tier                   the comprehensive suite's nightly and release tiers
#   argument-combinations  the public argument-combination nightly over every
#                          registry target (run_public_argument_combination_nightly.R ALL)
#   bench-build, bench     R benchmark regression check: the last release vs this commit,
#                          timed alternately on one runner (release_v1_1_0.md TODO-195),
#                          one job per section, and per response family for models and wald
#   bench-python           the Python benchmark (R/benchmark/benchmark_model_fits_python.py)
#   bench-report,          the combined R report and the Python report, on the
#   bench-pages            benchmark-results branch and at kapelner.github.io/EDI/benchmarks/
#   doc-links              scripts/check_doc_links.py, internal and external links; runs
#                          every night regardless of changes
#   fuzz-discover, fuzz    libFuzzer harnesses of the native C++ suite (cpp_tests/fuzz/),
#                          time-boxed, corpus kept between runs; succeeds while cpp_tests/
#                          does not exist yet (v1.0.6 TODO-15)
#   resume-calibration     last job: restarts a stalled calibration campaign (see below)
#   repro, repro-compare   cross-platform and core-count reproducibility
#                          (cross_platform_reproducibility.md TODO-4, release_v1_1_0.md
#                          TODO-48): the seed-pinned reproducibility tests on five
#                          platform/build legs, then a cross-leg comparison
#
# The comprehensive suite's nightly and release tiers
# (R/package_tests/comprehensive_suite_runtime_tiers.R; owner ruling
# 2026-11-14). test-coverage-R-advanced.yml runs only the smoke tier on push;
# the nightly tier is marked `scheduled_nightly` there, and the release tier
# runs here too so it is exercised before a release instead of only at one.
#
# Every job except doc-links runs only if its kind of change happened since the
# previous nightly run (the `change-gate` job below): `run` for package code and
# test harness changes, `fuzz` for C++ or cpp_tests/. The benchmark jobs are gated one by
# one by .github/scripts/benchmark_gate.py: a job reruns when code it depends on changed
# since the commit it last timed (recorded on the benchmark-results branch), and otherwise
# its saved rows are carried into the report. doc-links runs every night. Manual dispatch
# runs everything except the benchmarks, which follow its `benchmarks` input.
# Never a required check.
#
# The argument-combination job fails when its analysis or quality gates set
# ci_should_fail (the script exits 1). The comprehensive-suite jobs fail when
# run_comprehensive_suite.R exits non-zero (a step with non-ok status
# or failure rows: the tiers' `report_slow_cases_and_unexpected_errors` policy)
# or when the quality gates fail. Results are uploaded as a 14-day artifact
# for debugging, nothing is committed.

on:
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC daily
  workflow_dispatch:
    inputs:
      argument_targets:
        description: 'Argument-combination targets: ALL, a regex, or blank for the bounded smoke set'
        default: 'ALL'
      benchmarks:
        description: 'Benchmark jobs: auto (only those whose code changed since they were last timed), all, or none'
        type: choice
        options: [auto, all, none]
        default: auto

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Fails open: any error in change detection (no earlier run, a force-pushed
  # base, an API failure) means run=true.
  change-gate:
    name: codebase change gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      bench: ${{ steps.bench.outputs.bench }}
      bench_matrix: ${{ steps.bench.outputs.bench_matrix }}
      python: ${{ steps.bench.outputs.python }}
      fuzz: ${{ steps.decide.outputs.fuzz }}
    steps:
      # Full history: the benchmark gate diffs each job's last-timed commit against HEAD.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "fuzz=true" >> "$GITHUB_OUTPUT"
            echo "Event ${{ github.event_name }}: running."; exit 0
          fi
          paths=(':(glob)R/EDI/**/*.R' ':(glob)R/EDI/**/*.Rd' ':(glob)R/EDI/**/*.cpp' ':(glob)R/EDI/**/*.h'
                 ':(glob)R/EDI/**/*.hpp' 'R/EDI/DESCRIPTION' 'R/EDI/NAMESPACE' ':(glob)R/EDI/tests/**'
                 ':(glob)R/package_tests/**' 'R/package_metadata/finished_features/v1_0_0/comprehensive_test_suite.md'
                 '.github/workflows/nightly.yml' '.github/scripts/compare_repro_digests.R')
          # Base: the commit the previous completed scheduled run checked (success or failure; a skipped
          # night also concludes success, which is right: nothing changed then either). Fallback: the last
          # commit older than 26 hours.
          base="$(gh run list -R "$GITHUB_REPOSITORY" --workflow nightly.yml --event schedule \
                    --status completed --limit 20 --json databaseId,headSha,conclusion \
                    --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.conclusion == \"success\" or .conclusion == \"failure\")][0].headSha" 2>/dev/null)"
          how="since the previous nightly run at ${base:0:12}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-list -1 --before='26 hours ago' HEAD)"
            how="in the last 26 hours (no usable previous nightly run)"
          fi
          if [ -z "$base" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "fuzz=true" >> "$GITHUB_OUTPUT"
            echo "::warning::No base commit found; running everything."; exit 0
          fi
          # scripts/significant_changes.py drops R/C++ files whose edits are only comments or
          # whitespace (owner ruling 2026-11-17): such an edit is not a codebase change.
          changed="$(python3 scripts/significant_changes.py --report-ignored "$base" HEAD -- "${paths[@]}")"; rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "fuzz=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Change detection failed; running everything."; exit 0
          fi
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Codebase changed $how:"; echo "$changed" | head -20
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No codebase change $how: skipping the nightly suites." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # Fuzzing only when C++ code or the native test suite changed (owner ruling 2026-11-14).
          fuzz_changed="$(python3 scripts/significant_changes.py "$base" HEAD -- ':(glob)R/EDI/src/**' ':(glob)cpp_tests/**' || echo failed)"
          if [ -n "$fuzz_changed" ]; then
            echo "fuzz=true" >> "$GITHUB_OUTPUT"; echo "C++ or cpp_tests/ changed $how: fuzzing runs."
          else
            echo "fuzz=false" >> "$GITHUB_OUTPUT"
            echo "No C++ or cpp_tests/ change $how: skipping fuzzing." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      # Per-job benchmark gate (owner ruling 2026-11-17): see .github/scripts/benchmark_gate.py.
      # It reads manifest.json from the benchmark-results branch: the commit each job last
      # timed and that run's verdict. Fails open: if the gate itself breaks, every job runs.
      - id: bench
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmarks || 'auto' }}
        run: |
          set +e
          python3 .github/scripts/test_benchmark_gate.py > "$RUNNER_TEMP/gate_tests.txt" 2>&1
          if [ $? -ne 0 ]; then
            cat "$RUNNER_TEMP/gate_tests.txt"
            echo "::warning title=Benchmark gate::its tests failed; running every benchmark job."; MODE=all
          fi
          git fetch -q --depth 1 origin benchmark-results 2>/dev/null && git show FETCH_HEAD:manifest.json > "$RUNNER_TEMP/manifest.json" 2>/dev/null \
            || { echo "No benchmark manifest yet: every benchmark job runs."; rm -f "$RUNNER_TEMP/manifest.json"; }
          python3 .github/scripts/benchmark_gate.py --manifest "$RUNNER_TEMP/manifest.json" --mode "$MODE" \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          if [ $? -ne 0 ]; then
            echo "::warning title=Benchmark gate::the gate failed; running every benchmark job."
            python3 .github/scripts/benchmark_gate.py --mode all --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

  tier:
    needs: change-gate
    if: needs.change-gate.outputs.run == 'true'
    name: comprehensive suite (${{ matrix.tier }})
    runs-on: ubuntu-latest
    # Per-step timeouts are the tiers' default_timeout_sec (nightly 1800 s,
    # release 3600 s) over four steps; under GitHub's 6 h job cap.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        tier: [nightly, release]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      EDI_PORTABLE: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      GOTO_NUM_THREADS: 1
      VECLIB_MAXIMUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1

    steps:
      - uses: actions/checkout@v7

      # Same apt cache as test-coverage-R-advanced.yml (see the comment there).
      - name: Cache apt package archives
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-archives-${{ runner.os }}-r-advanced-${{ hashFiles('R/EDI/DESCRIPTION') }}
          restore-keys: |
            apt-archives-${{ runner.os }}-r-advanced-

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/EDI
          dependencies: '"all"'
          extra-packages: any::rcmdcheck

      # Into a job-local library, never the shared R_LIBS_USER dependency
      # cache (see test-coverage-R-advanced.yml's "Install EDI" comment for the
      # stale-EDI failures that caused).
      - name: Install EDI
        run: |
          mkdir -p "${{ runner.temp }}/edi-install-scratch"
          MAKEFLAGS="-j$(nproc)" R CMD INSTALL --library="${{ runner.temp }}/edi-install-scratch" R/EDI
          echo "R_LIBS=${{ runner.temp }}/edi-install-scratch${R_LIBS:+:$R_LIBS}" >> "$GITHUB_ENV"

      - name: Run comprehensive suite ${{ matrix.tier }} tier
        working-directory: R
        run: Rscript package_tests/run_comprehensive_suite.R ${{ matrix.tier }} "" "" --force

      - name: Analyze comprehensive suite coverage
        if: always()
        working-directory: R
        run: Rscript package_tests/analyze_comprehensive_suite.R

      - name: Run comprehensive suite quality gates
        working-directory: R
        run: Rscript package_tests/check_comprehensive_suite_quality_gates.R ci

      - name: Upload comprehensive suite artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comprehensive-suite-${{ matrix.tier }}
          retention-days: 14
          path: |
            R/package_tests/comprehensive_suite_results.csv
            R/package_tests/comprehensive_suite_failures.csv
            R/package_tests/comprehensive_suite_coverage.csv
            R/package_tests/comprehensive_suite_report.html
            R/package_tests/comprehensive_suite_quality_gates.csv
            R/package_tests/comprehensive_suite_quality_gate_summary.csv
            R/package_tests/comprehensive_suite_workflow_coverage.csv

  argument-combinations:
    needs: change-gate
    if: needs.change-gate.outputs.run == 'true'
    name: public argument combinations (nightly)
    runs-on: ubuntu-latest
    # Each case has the script's 60 s timeout; the full registry has never run
    # in CI, so the first dispatch measures it. Under GitHub's 6 h job cap.
    timeout-minutes: 330

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      EDI_PORTABLE: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      GOTO_NUM_THREADS: 1
      VECLIB_MAXIMUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1

    steps:
      - uses: actions/checkout@v7

      - name: Cache apt package archives
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-archives-${{ runner.os }}-r-advanced-${{ hashFiles('R/EDI/DESCRIPTION') }}
          restore-keys: |
            apt-archives-${{ runner.os }}-r-advanced-

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/EDI
          dependencies: '"all"'

      - name: Install EDI
        run: |
          mkdir -p "${{ runner.temp }}/edi-install-scratch"
          MAKEFLAGS="-j$(nproc)" R CMD INSTALL --library="${{ runner.temp }}/edi-install-scratch" R/EDI
          echo "R_LIBS=${{ runner.temp }}/edi-install-scratch${R_LIBS:+:$R_LIBS}" >> "$GITHUB_ENV"

      # The contract registry .rds is gitignored; build it from the committed
      # checkmate_argument_contracts.csv (about 6 s).
      - name: Build the public argument contract registry
        working-directory: R
        run: Rscript package_tests/public_argument_contract_registry.R

      # The gate: the curated smoke targets, which must pass.
      - name: Run public argument-combination nightly (curated targets, gating)
        working-directory: R
        run: Rscript package_tests/run_public_argument_combination_nightly.R ""

      # Every registry target (or a dispatch's regex). Report-only while the harness is
      # unfinished for most targets (release_v1_0_6.md TODO-23): its failures are mostly
      # harness defects, so a scheduled ALL sweep does not fail the run. A dispatch that
      # names its own targets is gating. Reuses the gate step's results (same case ids).
      - name: Run public argument-combination nightly (${{ github.event_name == 'workflow_dispatch' && inputs.argument_targets || 'ALL' }})
        id: argsweep
        working-directory: R
        continue-on-error: ${{ (github.event_name == 'workflow_dispatch' && inputs.argument_targets || 'ALL') == 'ALL' }}
        env:
          TARGETS: ${{ github.event_name == 'workflow_dispatch' && inputs.argument_targets || 'ALL' }}
        run: Rscript package_tests/run_public_argument_combination_nightly.R "$TARGETS"

      - name: Summarize the argument-combination sweep
        if: ${{ !cancelled() }}
        working-directory: R/package_tests
        run: |
          f=public_argument_combination_ci_failure_summary.csv
          [ -f "$f" ] || exit 0
          IFS=, read -r errors invariants should_fail < <(tail -n 1 "$f")
          { echo "### Public argument combinations"; echo
            echo "Unexpected errors: $errors; invariant failures: $invariants (sweep outcome: ${{ steps.argsweep.outcome }})."
            echo; echo "Failures by target: see public_argument_combination_failures.csv in the artifact."; } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.argsweep.outcome }}" = "failure" ]; then
            echo "::warning title=Argument combinations (report-only)::$errors unexpected error(s), $invariants invariant failure(s) across all targets; mostly harness gaps (release_v1_0_6.md TODO-23)"
          fi

      - name: Upload argument-combination artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-argument-combinations-nightly
          retention-days: 14
          path: |
            R/package_tests/public_argument_combination_cases.csv
            R/package_tests/public_argument_combination_results.csv
            R/package_tests/public_argument_combination_coverage.csv
            R/package_tests/public_argument_combination_failures.csv
            R/package_tests/public_argument_combination_cases_integrated.csv
            R/package_tests/public_argument_combination_results_integrated.csv
            R/package_tests/public_argument_combination_coverage_integrated.csv

  # Only the reproducibility and thread-count test files, against an installed
  # EDI: no R CMD check. Each leg runs them at 1, 2 and (where the runner has 4
  # vCPUs and NOT_CRAN=true) 4 threads; the digest test fails on any
  # thread-count dependence within the leg and writes its rows for
  # repro-compare. macOS arm64 runners have 3 vCPUs, so those legs test 1 and 2
  # only. The platform setup (BLAS choices, libomp) mirrors R-CMD-check.yaml's
  # matrix legs of the same names, so the digests are comparable with its weekly
  # repro comparison.
  repro:
    needs: change-gate
    if: needs.change-gate.outputs.run == 'true'
    name: reproducibility (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - {leg: ubuntu-latest-release,        os: ubuntu-latest,  portable: '1', exhaustive: 'true'}
          - {leg: ubuntu-latest-release-native, os: ubuntu-latest,  portable: '0'}
          - {leg: macos-latest-release,         os: macos-latest,   portable: '1'}
          - {leg: macos-latest-release-openmp,  os: macos-latest,   portable: '1', openmp: true}
          - {leg: windows-latest-release,       os: windows-latest, portable: '1'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      EDI_PORTABLE: ${{ matrix.portable }}
      NOT_CRAN: 'true'
      EDI_REPRO_LEG: ${{ matrix.leg }}
      # Full worker-count invariance sweep (every concrete exported non-IVWC, non-KK
      # class x every procedure, fork and mirai) on the Ubuntu portable leg only
      # (owner ruling 2026-11-14); about 20+ extra minutes. Other legs run the
      # default one-class-per-response-type set.
      EDI_EXHAUSTIVE_WORKER_TESTS: ${{ matrix.exhaustive || 'false' }}
    steps:
      - uses: actions/checkout@v7

      - name: Switch to OpenBLAS on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libopenblas0-serial
          sudo update-alternatives --set libblas.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/openblas-serial/libblas.so.3
          sudo update-alternatives --set liblapack.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/openblas-serial/liblapack.so.3

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Switch macOS R to Accelerate/vecLib BLAS
        if: runner.os == 'macOS'
        run: ln -sf libRblas.vecLib.dylib /Library/Frameworks/R.framework/Resources/lib/libRblas.dylib

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/EDI
          extra-packages: any::testthat

      - name: Enable OpenMP on macOS with Homebrew libomp
        if: matrix.openmp
        run: |
          brew install libomp
          LIBOMP="$(brew --prefix libomp)"
          mkdir -p ~/.R
          cat >> ~/.R/Makevars <<EOF
          CPPFLAGS += -Xclang -fopenmp -I${LIBOMP}/include
          LDFLAGS += -L${LIBOMP}/lib -lomp
          EOF
          echo "EDI_EXPECT_OPENMP=true" >> "$GITHUB_ENV"

      - name: Switch Windows R to OpenBLAS
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/switch-windows-r-to-openblas.ps1

      - name: Install EDI
        shell: bash
        run: |
          lib="${RUNNER_TEMP}/edi-install-scratch"
          mkdir -p "$lib" "${RUNNER_TEMP}/repro-digests"
          R CMD INSTALL --library="$lib" R/EDI
          # Only this library: R_LIBS_USER (setup-r's dependency library) still follows it, and a
          # ':' separator would be wrong on Windows.
          echo "R_LIBS=${lib}" >> "$GITHUB_ENV"
          echo "EDI_REPRO_DIGEST_DIR=${RUNNER_TEMP}/repro-digests" >> "$GITHUB_ENV"

      - name: Run the reproducibility and thread-count tests
        shell: Rscript {0}
        run: |
          library(testthat)
          res = test_dir(
            "R/EDI/tests/testthat",
            filter = "cross-platform-reproducibility-digests|seed-reproducibility|rand-seed-reproducibility|omp-kernel-thread-count-scoped|bai-thread-local-workspaces|worker-count-invariance|same-binary-determinism",
            package = "EDI", load_package = "installed",
            reporter = "summary", stop_on_failure = TRUE
          )

      - name: Upload digests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-repro-digests-${{ matrix.leg }}
          path: ${{ runner.temp }}/repro-digests
          retention-days: 14
          if-no-files-found: warn

  repro-compare:
    name: reproducibility comparison across legs
    needs: [change-gate, repro]
    if: ${{ !cancelled() && needs.change-gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPRO_EXPECTED_LEGS: 5
      REPRO_FLOAT_TOL: 1e-12  # observed max cross-leg relative spread 3.7e-16 (nightly run 43741847553, 2026-11-15)
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: actions/download-artifact@v8
        with:
          pattern: nightly-repro-digests-*
          path: repro-digests
          merge-multiple: true
      - name: Compare digests and floats across legs
        run: Rscript .github/scripts/compare_repro_digests.R repro-digests

  # Benchmark regression check (owner rulings 2026-11-13/14/17). Baseline: the
  # newest release tag (v*) reachable from this commit. Builds when at least one R
  # benchmark job runs tonight (gate output `bench`; the jobs to run are in
  # `bench_matrix`). The verdict is each job's status, log and step summary.
  bench-build:
    needs: change-gate
    if: needs.change-gate.outputs.bench == 'true'
    name: benchmark build (release and current)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      base: ${{ steps.base.outputs.sha }}
      base_tag: ${{ steps.base.outputs.tag }}
    env:
      EDI_PORTABLE: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: base
        run: |
          tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "sha=$(git rev-parse "$tag^{commit}")" >> "$GITHUB_OUTPUT"
          echo "Baseline: $tag ($(git rev-parse --short "$tag^{commit}")); current: $(git rev-parse --short HEAD)"
      - id: cache
        uses: actions/cache@v6
        with:
          path: bench-libs
          key: bench-libs-${{ runner.os }}-${{ steps.base.outputs.sha }}-${{ github.sha }}
      - uses: r-lib/actions/setup-r@v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          working-directory: R/EDI
          dependencies: '"hard"'
      - name: Install the release and the current commit into separate libraries
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p bench-libs/base bench-libs/head
          git worktree add "$RUNNER_TEMP/base-src" "${{ steps.base.outputs.sha }}"
          MAKEFLAGS="-j$(nproc)" R CMD INSTALL --strip --library=bench-libs/base "$RUNNER_TEMP/base-src/R/EDI"
          MAKEFLAGS="-j$(nproc)" R CMD INSTALL --strip --library=bench-libs/head R/EDI

  bench:
    needs: [change-gate, bench-build]
    if: needs.change-gate.outputs.bench == 'true'
    name: benchmark (${{ matrix.id }})
    runs-on: ubuntu-latest
    # Four runs of one job (A B B A). The largest job (models-count, 12 rows x ~40 s) takes
    # about 35 min of timing; survival's rows are slower (parfm ~25 s per fit).
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # One job per section, and per response family for models and wald (benchmark_sections.R
      # --families), so the gate can rerun only what changed: 15 jobs when everything runs.
      # Every row seeds its own data, so a row times the same in any job.
      max-parallel: 8
      matrix: ${{ fromJSON(needs.change-gate.outputs.bench_matrix) }}
    env:
      EDI_PORTABLE: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      GOTO_NUM_THREADS: 1
      VECLIB_MAXIMUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: bench-libs
          key: bench-libs-${{ runner.os }}-${{ needs.bench-build.outputs.base }}-${{ github.sha }}
          fail-on-cache-miss: true
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/EDI
          dependencies: '"hard"'
          extra-packages: |
            any::microbenchmark
            any::bench
            any::betareg
            any::clinfun
            any::DescTools
            any::ordinal
            any::pscl
            any::quantreg
            any::sandwich
            any::VGAM
            any::commonmark
            any::blockTools
            any::carat
            any::coin
            any::estimatr
            any::gamlss
            any::glmmTMB
            any::icenReg
            any::lme4
            any::Minirand
            any::nbpMatching
            any::parfm
            any::perm
            any::randomizr
            any::ri2
            any::robustbase
      # The current commit's benchmark script times both libraries, so the
      # measuring code is identical; a row the release cannot run (a newer API)
      # is NA on the release side and is not compared.
      - name: Time the section four times, alternating release (A) and current (B)
        working-directory: R
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/runs"; mkdir -p "$out"
          # Phase 0 of the plan (measure): each run's wall time goes to the step summary, so the
          # section's cost on a hosted runner is visible every night.
          { echo "### Benchmark run times: ${{ matrix.id }}"; echo; echo "| run | library | minutes |"; echo "|---|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          fam=(); [ -n "${{ matrix.families }}" ] && fam=(--families=${{ matrix.families }})
          for run in A1 B1 B2 A2; do
            case "$run" in A*) lib="$GITHUB_WORKSPACE/bench-libs/base";; *) lib="$GITHUB_WORKSPACE/bench-libs/head";; esac
            echo "::group::$run (${lib##*/})"
            t0=$(date +%s)
            # B1 (the first run of this commit) also saves its raw rows, which bench-report merges
            # into the one combined report, and keeps this shard's own rendered page.
            save=(); [ "$run" = B1 ] && save=(--save-results="$out/B1.rds")
            R_LIBS="$lib" Rscript benchmark/benchmark_model_fits.R --sections=${{ matrix.section }} "${fam[@]}" "${save[@]}"
            cp package_metadata/benchmark_model_fits.md "$out/$run.md"
            if [ "$run" = B1 ] && [ -f package_metadata/benchmark_model_fits_R.html ]; then cp package_metadata/benchmark_model_fits_R.html "$out/B1.html"; fi
            echo "| $run | ${lib##*/} | $(( ($(date +%s) - t0 + 30) / 60 )) |" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done
      - name: Verdict
        id: verdict
        working-directory: R
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/runs"
          allow=()
          if [ -f benchmark/benchmark_regression_allowlist.csv ]; then
            while IFS=, read -r pattern reason; do
              [ -n "$pattern" ] && [ "$pattern" != "pattern" ] && allow+=(--allow "$pattern")
            done < benchmark/benchmark_regression_allowlist.csv
          fi
          # The step shell runs with -e, and compare_benchmark_runs.R exits 1 whenever it sees a
          # slower row (normal in the noise pairs), so capture the status instead of dying on it.
          cmp() {
            local rc=0
            Rscript benchmark/compare_benchmark_runs.R --old "$out/$1.md" --new "$out/$2.md" --sections ${{ matrix.section }} \
              --part R --normalize-host "${allow[@]}" --tsv "$out/$3.tsv" > "$out/$3.txt" || rc=$?
            if [ "$rc" -gt 1 ]; then
              cat "$out/$3.txt"
              echo "::error title=Benchmark CI bug::compare_benchmark_runs.R failed on $1 vs $2 (exit $rc)"; exit 2
            fi
          }
          cmp A1 A2 noise_a; cmp B1 B2 noise_b; cmp A1 B1 cmp_1; cmp A2 B2 cmp_2
          Rscript benchmark/benchmark_abba_verdict.R "$out/noise_a.tsv" "$out/noise_b.tsv" "$out/cmp_1.tsv" "$out/cmp_2.tsv" \
            "${{ matrix.id }} (${{ needs.bench-build.outputs.base_tag }} vs ${GITHUB_SHA:0:12})"
      # Phase 4 of the plan, every night: a 3x slowdown injected into one stable row of
      # tonight's reports must be flagged by the same comparison and verdict, or the
      # check is reported as a CI bug. Runs even when the verdict found regressions.
      - name: Canary (the check must catch an injected slowdown)
        if: ${{ !cancelled() }}
        working-directory: R
        run: |
          out="$RUNNER_TEMP/runs"
          for f in A1 A2 B1 B2; do [ -f "$out/$f.md" ] || { echo "no $f.md (timing step failed): canary skipped"; exit 0; }; done
          Rscript benchmark/benchmark_canary_check.R "$out/A1.md" "$out/A2.md" "$out/B1.md" "$out/B2.md" ${{ matrix.section }}
      # The verdict goes into the manifest (bench-report): a job whose verdict failed reruns
      # every night until it passes, so a regression is not hidden by the gate.
      - name: Record the verdict
        if: ${{ !cancelled() }}
        # job.txt names the job: download-artifact extracts a pattern that matches a single
        # artifact straight into its path, with no benchmark-<id>/ folder to tell jobs apart.
        run: |
          mkdir -p "$RUNNER_TEMP/runs"
          echo "${{ steps.verdict.outcome }}" > "$RUNNER_TEMP/runs/verdict.txt"
          echo "${{ matrix.id }}" > "$RUNNER_TEMP/runs/job.txt"
      # This job's four reports, B1's rendered page, B1's raw rows (bench-report merges the rows
      # of every job into the combined page) and the verdict. Kept even when the verdict failed.
      - name: Keep this job's reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/runs/*.md
            ${{ runner.temp }}/runs/B1.html
            ${{ runner.temp }}/runs/B1.rds
            ${{ runner.temp }}/runs/verdict.txt
            ${{ runner.temp }}/runs/job.txt
          if-no-files-found: ignore
          retention-days: 30

  # The Python benchmark (R/benchmark/benchmark_model_fits_python.py), one run of this commit.
  # Gated by benchmark_gate.py (owner ruling 2026-11-17): only when the R/EDI/src C++ the bindings
  # compile (python/CMakeLists.txt's kernel sources, or any header), the bindings themselves
  # (python/cpp, python/src, CMakeLists.txt, pyproject.toml) or the script changed since the page
  # was last timed. There is no release-vs-current verdict for Python: the page is the output.
  bench-python:
    needs: change-gate
    if: needs.change-gate.outputs.python == 'true'
    name: benchmark (python)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install BLAS and the canonical Python packages
        run: |
          sudo apt-get update && sudo apt-get install -y libopenblas-dev
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas statsmodels scikit-survival lifelines pybind11 cmake
      # The script builds edi_kernels' _core module from this checkout before timing.
      # EDI_BENCH_REQUIRE_BINDINGS=1 fails the job if that build breaks (the script would
      # otherwise write a page whose every EDI column is NA).
      - name: Time the Python benchmark
        working-directory: R
        env:
          EDI_BENCH_REQUIRE_BINDINGS: '1'
        run: |
          python benchmark/benchmark_model_fits_python.py
          mkdir -p "$RUNNER_TEMP/py"
          cp ../python/benchmark/benchmark_model_fits_python.html "$RUNNER_TEMP/py/index.html"
      - uses: actions/upload-artifact@v7
        with:
          name: bench-python
          path: ${{ runner.temp }}/py/index.html
          retention-days: 30

  # One combined R benchmark page, built from the raw rows each bench job's B1 run saved
  # (nothing is timed here), plus the Python page. It is the "EDI as installed" counterpart of
  # the README's locally-run report: EDI_PORTABLE=1 (no -march=native), on a free 4-vCPU
  # hosted runner. Published as the `benchmark-report` artifact and on the `benchmark-results`
  # branch (one commit, force-pushed, like calibration-results; a GITHUB_TOKEN push starts no
  # workflows), and from there on the Pages site at https://kapelner.github.io/EDI/benchmarks/
  # (R) and .../benchmarks/python/ (Python) by bench-pages.
  #
  # The branch also keeps every job's rows (rows/<job>.rds) and manifest.json (the commit, time,
  # run and verdict of each job's last timing, and of the Python page). A job the gate skipped
  # tonight contributes its saved rows, and the report's header lists which parts were retimed
  # and which carried over (owner ruling 2026-11-17). Only a report with rows for every job is
  # published.
  bench-report:
    needs: [change-gate, bench-build, bench, bench-python]
    if: ${{ !cancelled() && (needs.change-gate.outputs.bench == 'true' || needs.change-gate.outputs.python == 'true') }}
    name: benchmark report (combined)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # push to the benchmark-results branch
    outputs:
      published: ${{ steps.publish.outputs.published }}
    env:
      EDI_PORTABLE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: benchmark-*
          path: shards
      - uses: actions/download-artifact@v8
        with:
          pattern: bench-python
          path: py
      - name: Merge tonight's rows with the saved rows of the jobs that did not run
        id: assemble
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/bench-report-out"; prev="$RUNNER_TEMP/prev"
          mkdir -p "$out"
          if git clone -q --depth 1 --branch benchmark-results "https://github.com/${GITHUB_REPOSITORY}.git" "$prev" 2>/dev/null; then
            rm -rf "$prev/.git"; cp -r "$prev/." "$out/"
          else
            mkdir -p "$prev"; echo "No benchmark-results branch yet."
          fi
          python3 - <<'PY'
          import datetime, json, os, shutil, subprocess
          ws = os.environ["GITHUB_WORKSPACE"]; out = os.path.join(ws, "bench-report-out")
          jobs = subprocess.run(["python3", ".github/scripts/benchmark_gate.py", "--list-jobs"],
                                capture_output=True, text=True, check=True).stdout.split()
          mpath = os.path.join(out, "manifest.json")
          manifest = json.load(open(mpath)) if os.path.exists(mpath) else {}
          manifest.setdefault("jobs", {})
          now = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          entry = lambda verdict: {"commit": os.environ["GITHUB_SHA"], "timed_at": now,
                                   "run_id": int(os.environ["GITHUB_RUN_ID"]), "verdict": verdict}
          os.makedirs(os.path.join(out, "rows"), exist_ok=True)
          # Find each job's folder by its job.txt, not by folder name: when the pattern matches a
          # single artifact, download-artifact puts its files straight into shards/ (and py/).
          shard_dir = {}
          for root, _, files in os.walk(os.path.join(ws, "shards")):
              if "job.txt" in files and "B1.rds" in files:
                  shard_dir[open(os.path.join(root, "job.txt")).read().strip()] = root
          new, carried, missing = [], [], []
          for j in jobs:
              src = os.path.join(shard_dir.get(j, "/nonexistent"), "B1.rds")
              dst = os.path.join(out, "rows", f"{j}.rds")
              if os.path.exists(src):
                  shutil.copy(src, dst)
                  vfile = os.path.join(shard_dir[j], "verdict.txt")
                  verdict = open(vfile).read().strip() if os.path.exists(vfile) else "unknown"
                  manifest["jobs"][j] = entry(verdict); new.append(j)
              elif os.path.exists(dst):
                  carried.append(j)
              else:
                  missing.append(j)
          py_src = next((c for c in (os.path.join(ws, "py", "index.html"),
                                     os.path.join(ws, "py", "bench-python", "index.html"))
                         if os.path.exists(c)), "")
          py_new = bool(py_src)
          if py_new:
              os.makedirs(os.path.join(out, "python"), exist_ok=True)
              shutil.copy(py_src, os.path.join(out, "python", "index.html"))
              manifest["python"] = entry("n/a")
          json.dump(manifest, open(mpath, "w"), indent=2, sort_keys=True)
          rows = [os.path.join(out, "rows", f"{j}.rds") for j in jobs if j in new or j in carried]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"r_new={'true' if new else 'false'}\n")
              f.write(f"python_new={'true' if py_new else 'false'}\n")
              f.write(f"complete={'true' if not missing else 'false'}\n")
              f.write(f"rows={','.join(rows)}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### Combined benchmark report\n\n")
              f.write(f"- retimed tonight: {', '.join(new) or 'none'}\n")
              f.write(f"- carried over: {', '.join(carried) or 'none'}\n")
              f.write(f"- no rows at all: {', '.join(missing) or 'none'}\n")
              f.write(f"- Python page: {'retimed tonight' if py_new else 'carried over' if os.path.exists(os.path.join(out, 'python', 'index.html')) else 'none yet'}\n")
          if missing:
              print(f"::warning title=Benchmark report::no rows for {', '.join(missing)}: the report is kept as an artifact but not published.")
          PY
      # The R page is rebuilt only when an R job ran tonight (that also needs tonight's EDI
      # build). On a Python-only night the R page and its markdown are carried over unchanged.
      - uses: actions/cache/restore@v6
        if: steps.assemble.outputs.r_new == 'true'
        with:
          path: bench-libs
          key: bench-libs-${{ runner.os }}-${{ needs.bench-build.outputs.base }}-${{ github.sha }}
          fail-on-cache-miss: true
      - uses: r-lib/actions/setup-r@v2
        if: steps.assemble.outputs.r_new == 'true'
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.assemble.outputs.r_new == 'true'
        with:
          working-directory: R/EDI
          dependencies: '"hard"'
          extra-packages: |
            any::microbenchmark
            any::bench
            any::betareg
            any::clinfun
            any::DescTools
            any::ordinal
            any::pscl
            any::quantreg
            any::sandwich
            any::VGAM
            any::commonmark
            any::blockTools
            any::carat
            any::coin
            any::estimatr
            any::gamlss
            any::glmmTMB
            any::icenReg
            any::lme4
            any::Minirand
            any::nbpMatching
            any::parfm
            any::perm
            any::randomizr
            any::ri2
            any::robustbase
      - name: Build the combined R report
        if: steps.assemble.outputs.r_new == 'true'
        working-directory: R
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/bench-report-out"
          # The R report's markdown embeds the Python page, so use the one being published.
          if [ -f "$out/python/index.html" ]; then cp "$out/python/index.html" ../python/benchmark/benchmark_model_fits_python.html; fi
          R_LIBS="$GITHUB_WORKSPACE/bench-libs/head" Rscript benchmark/benchmark_model_fits.R --from-results="${{ steps.assemble.outputs.rows }}"
          cp package_metadata/benchmark_model_fits_R.html "$out/index.html"
          cp package_metadata/benchmark_model_fits.md "$out/benchmark_model_fits.md"
      - name: Keep the combined report
        if: ${{ hashFiles('bench-report-out/manifest.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: bench-report-out
          retention-days: 90
      - name: Publish to the benchmark-results branch
        id: publish
        # Only main's report is public (the github-pages environment deploys only from main).
        if: steps.assemble.outputs.complete == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/bench-report-out"
          git init -q -b benchmark-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "EDI nightly benchmark report: ${GITHUB_SHA:0:12} vs ${{ needs.bench-build.outputs.base_tag || 'the last release' }}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:benchmark-results
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "Benchmark reports published: https://kapelner.github.io/EDI/benchmarks/ and .../benchmarks/python/ (after bench-pages deploys them)." >> "$GITHUB_STEP_SUMMARY"

  # Puts tonight's report on the Pages site. The site is pkgdown's (pkgdown.yaml), and every
  # deploy replaces the whole site, so this never deploys the report alone: it takes the last
  # successful pkgdown build's Pages artifact (kept 30 days), swaps in benchmarks/, and
  # redeploys that, with no EDI build. pkgdown.yaml itself copies benchmarks/ from the
  # benchmark-results branch, so its own deploys keep the page. If the artifact has expired,
  # this dispatches pkgdown.yaml instead, which picks the report up from the branch.
  bench-pages:
    needs: [bench-report]
    if: ${{ !cancelled() && needs.bench-report.outputs.published == 'true' }}
    name: benchmark report to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same group as pkgdown.yaml, so the two never deploy at once.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      actions: write    # read pkgdown.yaml's artifact, or dispatch pkgdown.yaml
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find the last pkgdown site build
        id: site
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pkgdown.yaml --branch "${{ github.event.repository.default_branch }}" \
                 --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty') || id=""
          has=false
          if [ -n "$id" ] && gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
               --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -q .; then
            has=true
          fi
          echo "run=$id" >> "$GITHUB_OUTPUT"; echo "has=$has" >> "$GITHUB_OUTPUT"
      - name: No site build to add to, so rebuild the site (pkgdown adds the report itself)
        if: steps.site.outputs.has != 'true'
        run: |
          gh workflow run pkgdown.yaml -R "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
          echo "No unexpired pkgdown site artifact: dispatched pkgdown.yaml, which publishes the report from the benchmark-results branch." | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.site.outputs.has == 'true'
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          run-id: ${{ steps.site.outputs.run }}
          github-token: ${{ github.token }}
          path: site-tar
      - if: steps.site.outputs.has == 'true'
        uses: actions/download-artifact@v8
        with:
          name: benchmark-report
          path: report
      - name: Swap tonight's reports into the site
        if: steps.site.outputs.has == 'true'
        run: |
          set -euo pipefail
          mkdir site
          tar -xf site-tar/artifact.tar -C site
          rm -rf site/benchmarks
          mkdir site/benchmarks
          cp report/index.html report/benchmark_model_fits.md site/benchmarks/
          if [ -d report/python ]; then cp -r report/python site/benchmarks/; fi
      - if: steps.site.outputs.has == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        if: steps.site.outputs.has == 'true'
        uses: actions/deploy-pages@v5

  # Every night, no change gate (owner ruling 2026-11-14): links die on the
  # other end without any change here, and the check takes minutes.
  doc-links:
    name: documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check internal and external documentation links
        run: python3 scripts/check_doc_links.py

  # Fuzzing (owner ruling 2026-11-14), written ahead of the v1.0.6 cpp_tests/
  # suite (native_cpp_test_suite.md, Target C). Convention this job expects:
  #   cpp_tests/CMakeLists.txt           option EDI_FUZZ=ON adds the fuzz targets,
  #                                      built with -fsanitize=fuzzer,address,undefined
  #   cpp_tests/fuzz/<name>.cpp          one libFuzzer harness per file, CMake target fuzz_<name>
  #   cpp_tests/fuzz/corpus/<name>/      committed seed inputs and past crashes (regression cases)
  # While cpp_tests/ (or cpp_tests/fuzz/) is missing, fuzz-discover reports no
  # harnesses and the run succeeds.
  fuzz-discover:
    needs: change-gate
    if: needs.change-gate.outputs.fuzz == 'true'
    name: fuzz harness discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      harnesses: ${{ steps.find.outputs.harnesses }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: cpp_tests
      - id: find
        run: |
          if [ ! -f cpp_tests/CMakeLists.txt ] || [ ! -d cpp_tests/fuzz ]; then
            echo 'harnesses=[]' >> "$GITHUB_OUTPUT"
            echo "cpp_tests/ fuzz suite does not exist yet: nothing to fuzz." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          list="$(find cpp_tests/fuzz -maxdepth 1 -name '*.cpp' -printf '%f\n' | sed 's/\.cpp$//' | sort \
                   | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')"
          echo "harnesses=$list" >> "$GITHUB_OUTPUT"
          echo "Fuzz harnesses: $list" | tee -a "$GITHUB_STEP_SUMMARY"

  fuzz:
    needs: [change-gate, fuzz-discover]
    if: needs.change-gate.outputs.fuzz == 'true' && needs.fuzz-discover.outputs.harnesses != '[]'
    name: fuzz (${{ matrix.harness }})
    runs-on: ubuntu-latest
    # 25 minutes of fuzzing per harness, the shard length that keeps push CI's
    # wait under one shard (owner ruling 2026-11-09).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        harness: ${{ fromJSON(needs.fuzz-discover.outputs.harnesses) }}
    env:
      FUZZ_SECONDS: 1500
    steps:
      - uses: actions/checkout@v7
      # The corpus grows across nights: restore the newest saved one, save a new
      # one at the end (cache keys are immutable, hence the run id).
      - name: Restore the corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ matrix.harness }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.harness }}-
      - name: Build the harness
        run: |
          sudo apt-get update -y && sudo apt-get install -y clang cmake ninja-build
          cmake -S cpp_tests -B "$RUNNER_TEMP/fuzz-build" -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DEDI_FUZZ=ON
          cmake --build "$RUNNER_TEMP/fuzz-build" --target "fuzz_${{ matrix.harness }}"
      - name: Fuzz for ${{ env.FUZZ_SECONDS }} s
        run: |
          mkdir -p fuzz-corpus "$RUNNER_TEMP/crashes"
          seeds=()
          [ -d "cpp_tests/fuzz/corpus/${{ matrix.harness }}" ] && seeds+=("cpp_tests/fuzz/corpus/${{ matrix.harness }}")
          bin="$(find "$RUNNER_TEMP/fuzz-build" -type f -name "fuzz_${{ matrix.harness }}" -perm -u+x | head -1)"
          [ -n "$bin" ] || { echo "::error title=Fuzz CI bug::fuzz_${{ matrix.harness }} binary not found after the build"; exit 2; }
          # Committed seeds and past crashes first, as regression cases, then the time-boxed run.
          "$bin" -max_total_time="$FUZZ_SECONDS" -timeout=30 -rss_limit_mb=4096 -print_final_stats=1 \
            -artifact_prefix="$RUNNER_TEMP/crashes/" fuzz-corpus "${seeds[@]}"
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@v6
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ matrix.harness }}-${{ github.run_id }}
      # A crashing input, so the finding can be reproduced locally and added to
      # cpp_tests/fuzz/corpus/<name>/ as a regression case once fixed.
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes-${{ matrix.harness }}
          path: ${{ runner.temp }}/crashes
          retention-days: 30
          if-no-files-found: ignore

  # Safety net for the calibration campaign (and the comprehensive study after it). Since
  # owner ruling 2026-11-15 those waves no longer pause for this workflow (it uses the 4
  # runner slots they leave free), but a wave chain can still break (a failed dispatch, a
  # cancelled run, a run paused under the old 2026-11-14 rule). This job runs last, whatever
  # the other jobs did, and dispatches the next wave of the newest campaign if it is
  # unfinished (status.txt "running" on the calibration-results branch) unless a
  # calibration-study run is already queued or in progress; with no unfinished calibration
  # campaign it does the same for the comprehensive study.
  resume-calibration:
    needs: [change-gate, tier, argument-combinations, repro, repro-compare, bench-build, bench, bench-report, bench-pages, doc-links, fuzz-discover, fuzz]
    if: ${{ always() }}
    name: resume calibration campaign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch the next wave of an unfinished campaign
        run: |
          active="$(gh run list -R "$GITHUB_REPOSITORY" --workflow calibration-study.yml --limit 20 --json status \
                      --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length' 2>/dev/null)" || active=""  # fail open: under bash -e a failed API call would abort the step
          if [ "${active:-0}" -gt 0 ] 2>/dev/null; then echo "A calibration-study run is already active: nothing to resume."; exit 0; fi
          if ! git clone -q --depth 1 --branch calibration-results "https://github.com/${GITHUB_REPOSITORY}.git" results 2>/dev/null; then
            echo "No calibration-results branch: nothing to resume."; exit 0
          fi
          # Only the NEWEST campaign of each study is ever resumed: older ones still marked "running"
          # were abandoned when a newer one started.
          # Always exits 0 (prints nothing when there is no running campaign): the step shell runs
          # with -e, and a non-zero `c="$(newest_running ...)"` would end the step as a failure.
          newest_running() { n="$(ls -d "$1"/*/ 2>/dev/null | sort | tail -1)"; if [ -n "$n" ] && [ "$(cat "$n/status.txt" 2>/dev/null)" = running ]; then basename "$n"; fi; return 0; }
          # `|| c=""`: newest_running returns 1 when the newest campaign is not running, which under bash -e aborted
          # the step before the comprehensive study was checked.
          c="$(newest_running results/campaigns)" || c=""
          if [ -n "$c" ]; then
            gh workflow run calibration-study.yml -R "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}" -f campaign="$c"
            echo "Resumed calibration campaign $c." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          # No unfinished calibration campaign: resume an unfinished comprehensive study instead
          # (comprehensive-study.yml pauses the same way and shares calibration's concurrency group).
          comp="$(gh run list -R "$GITHUB_REPOSITORY" --workflow comprehensive-study.yml --limit 20 --json status \
                    --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length' 2>/dev/null)" || comp=""  # fail open, as above
          if [ "${comp:-0}" -gt 0 ] 2>/dev/null; then echo "A comprehensive-study run is already active: nothing to resume."; exit 0; fi
          c="$(newest_running results/comprehensive/campaigns)" || c=""
          if [ -z "$c" ]; then echo "No unfinished calibration or comprehensive campaign: nothing to resume."; exit 0; fi
          gh workflow run comprehensive-study.yml -R "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}" -f campaign="$c"
          echo "Resumed comprehensive campaign $c." | tee -a "$GITHUB_STEP_SUMMARY"
