# @claude on an issue/PR comment (or an assigned issue) triggers an actual
# Claude Code run against this repo, on GitHub's own runner -- the
# auto-responder half of the agent-engagement setup; copilot-setup-steps.yml
# is the equivalent hook for GitHub's Copilot coding agent. See
# https://github.com/anthropics/claude-code-action.
#
# Requires one repo-admin, one-time setup this workflow file alone cannot
# do (no credential lives in the repo, on purpose):
#   1. Install the Claude GitHub app: https://github.com/apps/claude
#   2. Add an ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN) repository
#      secret (Settings -> Secrets and variables -> Actions).
# Both steps are automated by running `/install-github-app` from a `claude`
# session with repo-admin GitHub auth -- the fastest path. Until both are
# done, this workflow's runs fail at the auth step; nothing else in the
# repo depends on it.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # This repo's own compilation rule and full pre-work/pre-push
          # checklist already live in AGENTS.md/CONTRIBUTING.md, which
          # Claude reads from the checked-out repo automatically -- no
          # --system-prompt override needed here.

          # Optional overrides (uncomment to use):
          # trigger_phrase: "/claude"
          # assignee_trigger: "claude-bot"
          # claude_args: |
          #   --model claude-opus-4-1-20250805
          #   --max-turns 10
