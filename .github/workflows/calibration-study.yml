name: calibration-study

# Published monthly calibration study (release_v1_2_0.md TODO-36; scripts in
# R/package_tests/calibration/*calibration_study*). Size, coverage, null bias and
# power for every inference class on every applicable design, published to the
# public `calibration-results` branch (README + figures + tables) after every wave.
#
# A campaign is pinned to the commit it started on and runs in WAVES: each run of
# this workflow plans the next --wave-size unfinished shards from the campaign's
# ledger on the results branch, runs them, publishes, and dispatches the next run
# until nothing is left. Why waves: the campaign is thousands of ~25-minute shards
# and a matrix holds at most 256 jobs.
#
# Sharing GitHub's 20 concurrent jobs with push CI (free GitHub-hosted runners
# only, owner ruling 2026-11-09): `max-parallel: 16` keeps 4 slots free, and every
# shard is time-boxed to ~25 min of work (run_calibration_study.R
# --deadline-minutes), so a push's jobs never wait more than one shard.
#
# Never a required check. A campaign goes red only when it completes with a cell
# significantly worse than its rate-derived level (or than its row in
# calibration_study_accepted.csv): the `analyze` job's last step, `Gate verdict`
# (annotation "Calibration gate"). Any other red X is a bug in the check, annotated
# "Calibration CI bug". Interim waves only publish.
#
# Job graph: plan -> build -> roster -> shards -> analyze -> publish (v1.0.5 TODO-200, TODO-203 Amendment A). `plan` decides
# which campaign runs and pins its commit (no EDI); `build` installs EDI at that commit; `roster` plans the wave from the
# campaign's class roster, which the campaign's first wave enumerates from the EDI just built (so the class list is the
# one the shards simulate, and a class added since the last campaign cannot be missed; later waves reuse the campaign's
# roster.csv). Waves are planned class by class (plan_calibration_study.R): a shard runs one class or a few
# neighbouring cheap classes of one cell.
on:
  schedule:
    - cron: '17 3 1 * *'   # 1st of every month, 03:17 UTC: start a campaign
  workflow_dispatch:
    inputs:
      campaign:
        description: 'Campaign id to continue (blank = start a new campaign at this commit)'
        default: ''
      ns:
        description: 'Sample sizes (new campaign only)'
        default: '50,200,1000'
      power_ns:
        description: 'Sample sizes that also get the power effects (new campaign only)'
        default: '50,200'
      effects:
        description: 'Effects (new campaign only): null,power20,power50,power80'
        default: 'null,power20,power50,power80'
      designs:
        description: 'Designs, comma-separated, or all (new campaign only)'
        default: 'all'
      response_types:
        description: 'Response types, comma-separated, or all (new campaign only)'
        default: 'all'
      null_reps:
        description: 'Replicates per null cell (new campaign only)'
        default: '1000'
      power_reps:
        description: 'Replicates per power cell (new campaign only)'
        default: '500'

concurrency:
  group: calibration-study
  cancel-in-progress: false

permissions:
  contents: read

env:
  RESULTS_BRANCH: calibration-results
  # 256 = GitHub's matrix limit (owner ruling 2026-11-11, was 64): each wave costs ~20 min of fixed overhead (plan,
  # build cache, roster, analyze, publish, last-round stragglers), so fewer, bigger waves save ~1.5-2 days a campaign.
  # Cost: results publish every ~6 h instead of ~1.8 h, and a cancelled wave loses up to ~6 h of shards.
  WAVE_SIZE: 256

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      campaign: ${{ steps.campaign.outputs.campaign }}
      sha: ${{ steps.campaign.outputs.sha }}
      new: ${{ steps.campaign.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
      - name: Load the results branch
        run: |
          git clone --depth 1 --branch "$RESULTS_BRANCH" "https://github.com/${{ github.repository }}.git" results \
            || mkdir -p results
      - name: Start or continue a campaign
        id: campaign
        run: |
          c="${{ inputs.campaign }}"
          if [ -z "$c" ]; then
            sha="$GITHUB_SHA"
            c="$(date -u +%Y-%m-%d)-${sha::8}"
            new=true
            mkdir -p "results/campaigns/$c"
            {
              echo "SHA=$sha"
              echo "STARTED=$(date -u +%Y-%m-%dT%H:%MZ)"
              echo "NS=${{ inputs.ns || '50,200,1000' }}"
              echo "POWER_NS=${{ inputs.power_ns || '50,200' }}"
              echo "EFFECTS=${{ inputs.effects || 'null,power20,power50,power80' }}"
              echo "DESIGNS=${{ inputs.designs || 'all' }}"
              echo "RESPONSE_TYPES=${{ inputs.response_types || 'all' }}"
              echo "NULL_REPS=${{ inputs.null_reps || '1000' }}"
              echo "POWER_REPS=${{ inputs.power_reps || '500' }}"
            } > "results/campaigns/$c/campaign.env"
          else
            f="results/campaigns/$c/campaign.env"
            if [ ! -f "$f" ]; then echo "unknown campaign $c (no $f on $RESULTS_BRANCH)"; exit 1; fi
            sha="$(grep '^SHA=' "$f" | cut -d= -f2)"
            new=false
          fi
          echo "campaign=$c" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          cp "results/campaigns/$c/campaign.env" campaign.env
      - uses: actions/upload-artifact@v7
        with:
          name: study-campaign
          path: campaign.env
          retention-days: 7
      - name: Flag a bug in the check
        if: failure()
        run: |
          echo "::error title=Calibration CI bug::Starting or continuing the campaign failed: a bug in the check (or an unknown campaign id), not a calibration result."

  # Compile EDI once per commit and runner OS and share it with every shard and every wave of the
  # campaign (cache keyed by the pinned commit and ImageOS; same EDI_PORTABLE rationale as
  # test-bulk-non-cran.yml's build job).
  build:
    needs: plan
    runs-on: ubuntu-latest
    env:
      EDI_PORTABLE: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # EDI's compiled library, keyed by the campaign's commit and the runner OS (ImageOS, e.g. ubuntu24 / ubuntu26;
      # owner ruling 2026-11-11): one build per OS, so a binary built on a newer OS never runs on an older one during
      # GitHub's image rollout. Not ImageVersion: it changes with routine image updates and would recompile mid-campaign.
      - name: EDI cache key
        id: edikey
        run: echo "key=calibration-study-edi-${ImageOS:-unknown}-${{ needs.plan.outputs.sha }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v5
        with:
          path: .edi-install-scratch
          key: ${{ steps.edikey.outputs.key }}
      # The shards' R runtime (owner ruling 2026-11-11): R itself (/opt/R/<version>, as a tar, since /opt is root-owned)
      # and the R package library, cached once per runner image and pinned commit, so a shard restores it in seconds
      # instead of running setup-r (~40 s) and setup-r-dependencies (~44 s). Keyed by the runner image (ImageOS,
      # ImageVersion) so the system libraries R and the packages link against are the ones the cache was built on; a
      # shard on another image misses and falls back to the normal setup.
      - name: Runtime cache key
        id: rtkey
        run: echo "key=calibration-study-runtime-v1-${ImageOS:-unknown}-${ImageVersion:-unknown}-${{ needs.plan.outputs.sha }}" >> "$GITHUB_OUTPUT"
      - id: rt
        uses: actions/cache@v5
        with:
          path: .r-runtime
          key: ${{ steps.rtkey.outputs.key }}
      - uses: r-lib/actions/setup-r@v2
        if: steps.cache.outputs.cache-hit != 'true' || steps.rt.outputs.cache-hit != 'true'
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.cache.outputs.cache-hit != 'true' || steps.rt.outputs.cache-hit != 'true'
        with:
          working-directory: R/EDI
          dependencies: '"all"'
      - name: Pack the R runtime for the shards
        if: steps.rt.outputs.cache-hit != 'true'
        run: |
          ver="$(Rscript -e 'cat(as.character(getRversion()))')"
          home="$(Rscript -e 'cat(R.home())')"
          case "$home" in
            "/opt/R/$ver/"*) ;;
            *) echo "::warning title=Calibration setup::R is at $home, not /opt/R/$ver: not caching the runtime; shards use the normal setup."; exit 0;;
          esac
          mkdir -p .r-runtime/Library
          sudo tar -C / -cf .r-runtime/r.tar "opt/R/$ver"
          sudo chown "$(id -u):$(id -g)" .r-runtime/r.tar
          cp -a "$R_LIBS_USER/." .r-runtime/Library/
          echo "$ver" > .r-runtime/R_VERSION
          du -sh .r-runtime/r.tar .r-runtime/Library
      - name: Install the campaign's commit into an isolated library
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.edi-install-scratch"
          # --strip: debug symbols are most of the shared object's size and the study
          # never needs them. The actions/cache entry above (saved when this job ends)
          # is how the shards get this library: no artifact copy.
          MAKEFLAGS="-j$(nproc)" R CMD INSTALL --strip --library="$GITHUB_WORKSPACE/.edi-install-scratch" R/EDI
      - name: Flag a bug in the check
        if: failure()
        run: |
          echo "::error title=Calibration CI bug::Building EDI at the campaign's commit failed: a bug in the check or the commit, not a calibration result."

  # The wave's plan (v1.0.5 TODO-203 Amendment A). The class roster is the campaign's own: the first wave
  # enumerates it from the EDI built above (build_calibration_study_roster.R: per response type and design the
  # runner's cal_study_classes() and each class's formula x procedure tasks, without fitting) and `analyze` publishes
  # it as <campaign>/roster.csv; later waves read that file, so the class list is frozen for the campaign. Seconds per
  # replicate for packing come from the previous published campaign where the class existed, else a 2 s default.
  roster:
    needs: [plan, build]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      wave: ${{ steps.plan.outputs.wave }}
    env:
      EDI_PORTABLE: 1
      NOT_CRAN: true
      OMP_NUM_THREADS: 1
      C: ${{ needs.plan.outputs.campaign }}
    steps:
      # The roster script: the campaign's pinned commit (it enumerates the classes of the EDI the shards simulate).
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # The planner: this run's own commit (owner ruling 2026-11-11, TODO-203 Amendment E), so cost and packing fixes
      # reach a running campaign. Safe because the planner only decides which replicates each shard runs: the shard
      # interface (matrix fields, run_calibration_study.R arguments) and the ledger format must stay unchanged, or a
      # campaign pinned before such a change breaks. The planner reads only files next to it (calibration_study_stats.R,
      # calibration_study_plan_common.R), all from this checkout.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: current
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/EDI
          dependencies: '"all"'
      # EDI's compiled library, keyed by the campaign's commit and the runner OS (ImageOS, e.g. ubuntu24 / ubuntu26;
      # owner ruling 2026-11-11): one build per OS, so a binary built on a newer OS never runs on an older one during
      # GitHub's image rollout. Not ImageVersion: it changes with routine image updates and would recompile mid-campaign.
      - name: EDI cache key
        id: edikey
        run: echo "key=calibration-study-edi-${ImageOS:-unknown}-${{ needs.plan.outputs.sha }}" >> "$GITHUB_OUTPUT"
      # Restore and save: on a miss (this runner's OS differs from the build job's during a rollout) the job compiles EDI
      # itself below and saves it under this OS's key, so later jobs on this OS hit.
      - id: edic
        uses: actions/cache@v5
        with:
          path: .edi-install-scratch
          key: ${{ steps.edikey.outputs.key }}
      - name: Compile EDI for this runner OS (no cached build for it)
        if: steps.edic.outputs.cache-hit != 'true'
        run: |
          echo "::warning title=Calibration setup::no cached EDI build for ${ImageOS:-this OS}; compiling it here (once per OS)."
          mkdir -p "$GITHUB_WORKSPACE/.edi-install-scratch"
          MAKEFLAGS="-j$(nproc --all)" R CMD INSTALL --strip --library="$GITHUB_WORKSPACE/.edi-install-scratch" R/EDI
      - name: Use the pre-built library
        run: |
          echo "R_LIBS=$GITHUB_WORKSPACE/.edi-install-scratch${R_LIBS:+:$R_LIBS}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: study-campaign
          path: .
      - name: Load the results branch
        run: |
          git clone --depth 1 --branch "$RESULTS_BRANCH" "https://github.com/${{ github.repository }}.git" results \
            || mkdir -p results
      - name: The campaign's class roster
        run: |
          set -a; . ./campaign.env; set +a
          d="results/campaigns/$C"
          if [ -f "$d/roster.csv" ]; then
            echo "Reusing the campaign's roster ($d/roster.csv)"
            cp "$d/roster.csv" roster.csv
          else
            # Costs: the latest other campaign on the branch that has statistics.
            prev=""
            # Campaign ids start with their date, so the glob (sorted) is oldest first: walk it backwards.
            cands=(results/campaigns/*/)
            for (( i=${#cands[@]}-1; i>=0; i-- )); do
              p="${cands[i]%/}"
              [ "$(basename "$p")" = "$C" ] && continue
              if [ -f "$p/stats/tests.csv.gz" ]; then prev="$p/stats"; break; fi
            done
            Rscript R/package_tests/calibration/build_calibration_study_roster.R --out roster.csv \
              --response-types "$RESPONSE_TYPES" --designs "$DESIGNS" --prev-stats-dir "$prev"
          fi
      - name: Plan the next wave
        id: plan
        run: |
          set -a; . ./campaign.env; set +a
          matrix="$(Rscript current/R/package_tests/calibration/plan_calibration_study.R \
            --campaign-dir "results/campaigns/$C" --roster roster.csv \
            --ns "$NS" --power-ns "$POWER_NS" --effects "$EFFECTS" --designs "$DESIGNS" --response-types "$RESPONSE_TYPES" \
            --null-reps "$NULL_REPS" --power-reps "$POWER_REPS" --cores 4 --target-minutes 25 \
            --wave-size "$WAVE_SIZE" --meta-out meta.txt)"
          cat meta.txt
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          grep '^wave=' meta.txt >> "$GITHUB_OUTPUT"
          { echo "### Calibration study $C"; echo '```'; cat meta.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: study-roster
          path: roster.csv
          retention-days: 7
          if-no-files-found: error
      - name: Flag a bug in the check
        if: failure()
        run: |
          echo "::error title=Calibration CI bug::Building the class roster or planning the wave failed: a bug in the check, not a calibration result."

  shards:
    needs: [plan, roster]
    if: needs.roster.outputs.wave != '0'
    runs-on: ubuntu-latest
    # ~25 min of replicates (the deadline) + setup + the replicates in flight. Most
    # shards end near 30 min; a slow-class shard whose single replicate outlasts the
    # deadline (InferenceCountKKGLMM at n = 1000: ~37 single-core min measured
    # locally) needs the headroom on a slower runner.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.roster.outputs.matrix) }}
    env:
      EDI_PORTABLE: 1
      NOT_CRAN: true
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # The build job's cache entry (same key); it saved when that job ended, which
      # was before any shard started. EDI's compiled library, keyed by the campaign's commit and the runner OS (ImageOS, e.g. ubuntu24 / ubuntu26;
      # owner ruling 2026-11-11): one build per OS, so a binary built on a newer OS never runs on an older one during
      # GitHub's image rollout. Not ImageVersion: it changes with routine image updates and would recompile mid-campaign.
      - name: EDI cache key
        id: edikey
        run: echo "key=calibration-study-edi-${ImageOS:-unknown}-${{ needs.plan.outputs.sha }}" >> "$GITHUB_OUTPUT"
      # Restore and save: on a miss (this runner's OS differs from the build job's during a rollout) the job compiles EDI
      # itself below and saves it under this OS's key, so later jobs on this OS hit.
      - id: edic
        uses: actions/cache@v5
        with:
          path: .edi-install-scratch
          key: ${{ steps.edikey.outputs.key }}
      # The R runtime the build job cached (see there). Used only if it restores, R starts, EDI loads and no shared
      # object in R or the library is missing a system library (ldd); otherwise the normal setup below runs, with a
      # warning, so a bad cache costs time, never results.
      - name: Runtime cache key
        id: rtkey
        run: echo "key=calibration-study-runtime-v1-${ImageOS:-unknown}-${ImageVersion:-unknown}-${{ needs.plan.outputs.sha }}" >> "$GITHUB_OUTPUT"
      - id: rt
        uses: actions/cache/restore@v5
        with:
          path: .r-runtime
          key: ${{ steps.rtkey.outputs.key }}
      - name: Use the cached R runtime
        id: fastr
        if: steps.rt.outputs.cache-hit == 'true'
        continue-on-error: true
        run: |
          ver="$(cat .r-runtime/R_VERSION)"
          sudo tar -C / -xf .r-runtime/r.tar
          bin="/opt/R/$ver/bin"
          lib="$GITHUB_WORKSPACE/.r-runtime/Library"
          missing="$(find "/opt/R/$ver" "$lib" "$GITHUB_WORKSPACE/.edi-install-scratch" -name '*.so*' -type f -print0 \
            | xargs -0 ldd 2>/dev/null | grep 'not found' | sort -u || true)"
          if [ -n "$missing" ]; then
            echo "::warning title=Calibration setup::cached R runtime is missing system libraries; using the normal setup: $(echo "$missing" | head -5 | tr '\n' ' ')"
            exit 1
          fi
          # EDI is absent on an EDI cache miss (it is compiled after this step); then check that R starts.
          chk='suppressPackageStartupMessages(library(EDI)); cat("EDI", format(packageVersion("EDI")), "loads\n")'
          [ -d "$GITHUB_WORKSPACE/.edi-install-scratch/EDI" ] || chk='cat("R", format(getRversion()), "starts\n")'
          R_LIBS_USER="$lib" R_LIBS="$GITHUB_WORKSPACE/.edi-install-scratch" "$bin/Rscript" -e "$chk"
          echo "$bin" >> "$GITHUB_PATH"
          { echo "R_LIBS_USER=$lib"; echo "TZ=UTC"; echo "_R_CHECK_SYSTEM_CLOCK_=FALSE"; } >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Fall back to the normal setup
        if: steps.fastr.outputs.ok != 'true'
        run: echo "::warning title=Calibration setup::no usable cached R runtime (cache hit '${{ steps.rt.outputs.cache-hit }}'); running setup-r and setup-r-dependencies."
      - uses: r-lib/actions/setup-r@v2
        if: steps.fastr.outputs.ok != 'true'
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.fastr.outputs.ok != 'true'
        with:
          working-directory: R/EDI
          dependencies: '"all"'
      - name: Compile EDI for this runner OS (no cached build for it)
        if: steps.edic.outputs.cache-hit != 'true'
        run: |
          echo "::warning title=Calibration setup::no cached EDI build for ${ImageOS:-this OS}; compiling it here (once per OS)."
          mkdir -p "$GITHUB_WORKSPACE/.edi-install-scratch"
          MAKEFLAGS="-j$(nproc --all)" R CMD INSTALL --strip --library="$GITHUB_WORKSPACE/.edi-install-scratch" R/EDI
      - name: Use the pre-built library
        run: |
          echo "R_LIBS=$GITHUB_WORKSPACE/.edi-install-scratch${R_LIBS:+:$R_LIBS}" >> "$GITHUB_ENV"
      # `nproc --all`, not `nproc`: GNU nproc honours OMP_NUM_THREADS=1 (see
      # calibration-fast-tier.yml). The deadline starts when R does, after setup.
      - name: Run shard ${{ matrix.id }}
        run: |
          Rscript R/package_tests/calibration/run_calibration_study.R \
            --response-type "${{ matrix.response_type }}" --design "${{ matrix.design }}" --n "${{ matrix.n }}" \
            --effect "${{ matrix.effect }}" --reps "${{ matrix.reps }}" --cores "$(nproc --all)" \
            --deadline-minutes 25 --secs-per-rep "${{ matrix.secs_per_rep }}" \
            --only "${{ matrix.only }}" --exclude "${{ matrix.exclude }}" --out-dir "out/${{ matrix.id }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: study-shard-${{ matrix.id }}
          path: out/${{ matrix.id }}
          if-no-files-found: warn
          retention-days: 3
      # A replicate's fit error is a row status, never a failed shard; a failing shard step is a script error
      # (or the 75-minute timeout, which cancels the job before any step can annotate it).
      - name: Flag a bug in the check
        if: failure()
        run: |
          echo "::error title=Calibration CI bug::Shard ${{ matrix.id }} failed: a bug in the check, not a calibration result."

  # The analysis (v1.0.5 TODO-200): its own check job between the shards and publish. It
  # merges the wave's statistics into the campaign's totals, runs the gate and the
  # convergence study, the design comparison at completion, the figures and the READMEs,
  # and hands the finished results tree to `publish` as the `study-results` artifact.
  #
  # Scripts come from two commits, both recorded (campaign.env ANALYSIS_SHA, README, job
  # summary): the campaign's pinned commit supplies the merge (it must match the shards that
  # ran), the workflow run's own commit (github.sha, `main` at dispatch) supplies the planner
  # (TODO-203 Amendment E: the shard interface is fixed, so it can change mid-campaign) and the
  # analysis, so a campaign is gated by the current rules at completion.
  #
  # Failure contract (owner, 2026-11-10). The ONLY red X that means "the calibration failed" is
  # this job's last step, `Gate verdict`, and only for a completed campaign with confirmed
  # failing cells (annotation title "Calibration gate"). Every other failure, in any job, is a
  # bug in the check itself, annotated "Calibration CI bug". Statistical outcomes never fail
  # an earlier step: a replicate whose fit errors is a row status (run_calibration_study.R
  # tryCatch), a cell with no finite results has NA statistics and an empty gate
  # (analyze_calibration_study.R), a cell whose power-law fit fails is `undetermined`
  # (convergence_calibration_study.R). The step that can fail is therefore always the last one.
  analyze:
    needs: [plan, roster, shards]
    if: always() && needs.plan.result == 'success' && needs.roster.result == 'success' && needs.roster.outputs.wave != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read     # gh run download of the earlier waves' raw rows
    outputs:
      ready: ${{ steps.handoff.outputs.ready }}
      complete: ${{ steps.replan.outputs.complete }}
    env:
      GH_TOKEN: ${{ github.token }}
      C: ${{ needs.plan.outputs.campaign }}
      SIM_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      # Analysis scripts and the registry: this run's own commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      # Merge: the campaign's pinned commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: pinned
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install ggplot2 and data.table (the only packages the analysis scripts need)
        run: Rscript -e 'install.packages(c("ggplot2", "data.table"))'
      - uses: actions/download-artifact@v8
        with:
          name: study-campaign
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: study-roster
          path: .
      - name: Load the results branch and record both commits
        run: |
          git clone --depth 1 --branch "$RESULTS_BRANCH" "https://github.com/${{ github.repository }}.git" results \
            || mkdir -p results
          mkdir -p "results/campaigns/$C"
          cp campaign.env "results/campaigns/$C/campaign.env"
          # The campaign's class roster (written in its first wave, reused by every later one): published with the campaign.
          cp roster.csv "results/campaigns/$C/roster.csv"
          # SHA= is the commit the campaign simulates at; ANALYSIS_SHA= the commit whose scripts analyse it
          # (rewritten by every wave).
          sed -i '/^ANALYSIS_SHA=/d' "results/campaigns/$C/campaign.env"
          echo "ANALYSIS_SHA=$GITHUB_SHA" >> "results/campaigns/$C/campaign.env"
          echo "Simulated at ${SIM_SHA}, analysed at ${GITHUB_SHA}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v8
        with:
          pattern: study-shard-*
          path: wave
      - name: Add this wave to the campaign
        run: |
          d="results/campaigns/$C"
          wave_no=$(( $(wc -l < "$d/runs.txt" 2>/dev/null || echo 0) + 1 ))
          Rscript pinned/R/package_tests/calibration/merge_calibration_study_wave.R --campaign-dir "$d" --wave-dir wave
          # Every planned shard, finished or not: the planner abandons a unit after
          # repeated shards that never wrote shard.csv (died or timed out).
          [ -f "$d/planned.csv" ] || echo "id,response_type,design,n,effect,group,wave,run_id" > "$d/planned.csv"
          echo '${{ needs.roster.outputs.matrix }}' | jq -r --arg w "$wave_no" --arg r "${{ github.run_id }}" \
            '.include[] | [.id, .response_type, .design, (.n|tostring), .effect, .group, $w, $r] | @csv' >> "$d/planned.csv"
          echo "${{ github.run_id }}" >> "$d/runs.txt"
          echo "wave_no=$wave_no" >> "$GITHUB_ENV"
          # This wave's raw rows, for deep dives (60 days, so the last two campaigns, ~0.3 GB each, are kept at a
          # time; the campaign's totals never need them). One CSV per wave, xz -9e: half
          # gzip's size on real rows (measured 2026-11-09), because class / design / method
          # strings repeat across shards. A shard whose header differs (should not happen)
          # keeps its own file rather than being mangled into the wave's CSV.
          mkdir -p rows
          header=""
          for s in wave/study-shard-*; do
            f="$s/rows.csv.gz"
            [ -f "$f" ] || continue
            h="$(zcat "$f" | head -n 1)"
            [ -n "$header" ] || { header="$h"; printf '%s\n' "$header" > rows/rows.csv; }
            if [ "$h" = "$header" ]; then zcat "$f" | tail -n +2 >> rows/rows.csv
            else cp "$f" "rows/${s#wave/study-shard-}.rows.csv.gz"; fi
          done
          [ -f rows/rows.csv ] && xz -9e -T0 rows/rows.csv
          ls -la rows
      - uses: actions/upload-artifact@v7
        with:
          name: study-rows
          path: rows
          retention-days: 60
          if-no-files-found: ignore
      # The analysis runs first so summary/confirm_cells.csv (the cells the gate's
      # screen flagged, including the rate check's, which needs the convergence verdicts) is
      # current: once screening is done, the planner turns it into the confirmation units of
      # the gate's second stage. Quiet here; the steps below write the published outputs.
      - name: Re-plan (progress, and whether another wave is needed)
        id: replan
        run: |
          set -a; . ./campaign.env; set +a
          d="results/campaigns/$C"
          # The campaign's plan (every screening unit, its replicates and tests; v1.0.5 TODO-203): this run's planner, the same
          # one the roster job planned the wave with (Amendment E); the analysis below reads it (m_total, completed cells, class status).
          Rscript R/package_tests/calibration/plan_calibration_study.R --plan-only --plan-out "$d/plan.csv" --roster "$d/roster.csv" \
            --ns "$NS" --power-ns "$POWER_NS" --effects "$EFFECTS" --designs "$DESIGNS" --response-types "$RESPONSE_TYPES" \
            --null-reps "$NULL_REPS" --power-reps "$POWER_REPS"
          Rscript R/package_tests/calibration/convergence_calibration_study.R --stats-dir "$d/stats" --out-dir "$d/summary" > /dev/null
          Rscript R/package_tests/calibration/analyze_calibration_study.R --stats-dir "$d/stats" \
            --out-dir "$d/summary" > /dev/null
          Rscript R/package_tests/calibration/plan_calibration_study.R --campaign-dir "$d" --roster "$d/roster.csv" \
            --ns "$NS" --power-ns "$POWER_NS" --effects "$EFFECTS" --designs "$DESIGNS" --response-types "$RESPONSE_TYPES" \
            --null-reps "$NULL_REPS" --power-reps "$POWER_REPS" --cores 4 --target-minutes 25 \
            --wave-size "$WAVE_SIZE" --meta-out after.txt > /dev/null
          cat after.txt
          . ./after.txt
          pct=0
          [ "$reps_total" -gt 0 ] && pct=$(( 100 * reps_done / reps_total ))
          echo "PROGRESS=Progress: ${reps_done} of ${reps_total} replicates (${pct}%) after wave ${wave_no}; ${units_done} of ${units} cells complete, ${units_abandoned} abandoned." >> "$GITHUB_ENV"
          if [ "$wave" -eq 0 ]; then echo "complete" > "$d/status.txt"; complete=true; else echo "running" > "$d/status.txt"; complete=false; fi
          echo "COMPLETE=$complete" >> "$GITHUB_ENV"
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
      # Once per campaign, at completion: paired power comparisons between designs
      # need each replicate's result on every design, which only the raw rows have
      # (the totals are per cell). Every earlier wave's study-rows artifact is
      # fetched (a campaign takes ~10 days; they are kept 60), plus this wave's.
      - name: Compare designs (complete campaigns only)
        if: env.COMPLETE == 'true'
        run: |
          d="results/campaigns/$C"
          mkdir -p allrows
          cp -r rows allrows/this-wave
          while read -r id; do
            [ "$id" = "${{ github.run_id }}" ] && continue
            gh run download "$id" -R "${{ github.repository }}" -n study-rows -D "allrows/$id" \
              || echo "::warning::no study-rows artifact for run $id"
          done < "$d/runs.txt"
          du -sh allrows
          Rscript R/package_tests/calibration/compare_designs_calibration_study.R --rows-dir allrows \
            --out "$d/summary/design_comparison.csv"
      # Convergence of size / coverage / bias error with n against the registry's expected
      # order (v1.0.5 TODO-199). Its `slower` verdicts feed the gate's rate check (TODO-200), so it
      # runs before the gate. A cell whose fit fails is `undetermined`; a script error stops the step
      # (a bug in the check). Cells with a single n are undetermined, so early waves are provisional.
      - name: Convergence slopes
        run: |
          d="results/campaigns/$C"
          Rscript R/package_tests/calibration/convergence_calibration_study.R --stats-dir "$d/stats" --out-dir "$d/summary" \
            $([ "$COMPLETE" = true ] && echo --final)
      - name: Analyze, plot and write the READMEs
        run: |
          d="results/campaigns/$C"
          Rscript R/package_tests/calibration/analyze_calibration_study.R --stats-dir "$d/stats" --out-dir "$d/summary" \
            --title "EDI calibration study, campaign $C" --note "$PROGRESS" --summary-md "$GITHUB_STEP_SUMMARY" \
            $([ "$COMPLETE" = true ] && echo --final)
          Rscript R/package_tests/calibration/plot_calibration_study.R --summary-dir "$d/summary" \
            --out-dir "$d/figures" --fragment "$d/figures.md" --fig-prefix figures/ --class-figures
          Rscript R/package_tests/calibration/render_calibration_study_readme.R --results-dir results --campaign "$C" \
            --repo "${{ github.repository }}" --progress "$PROGRESS"
      # Everything `publish` pushes: this campaign's directory and the branch's top-level README.
      # `ready` is set only when every step above succeeded, so publish never pushes a half-analysed wave.
      - name: Stage the results for publish
        run: |
          mkdir -p handoff/campaigns
          cp -r "results/campaigns/$C" handoff/campaigns/
          cp results/README.md handoff/README.md
      - uses: actions/upload-artifact@v7
        with:
          name: study-results
          path: handoff
          retention-days: 7
          if-no-files-found: error
      - name: Mark the results ready
        id: handoff
        run: echo "ready=true" >> "$GITHUB_OUTPUT"
      # Placed before the gate so it sees only failures of the steps above: those are bugs in the check.
      - name: Flag a bug in the check
        if: failure()
        run: |
          echo "::error title=Calibration CI bug::The analyze job failed before reaching its gate verdict: this is a bug in the check (a script or workflow error), not a calibration result. This wave was not published."
      # The only step allowed to fail for a statistical reason: a completed campaign with confirmed failing cells.
      - name: Gate verdict
        if: success() && env.COMPLETE == 'true'
        run: |
          f="results/campaigns/$C/summary/gate_failures.txt"
          n="$(cat "$f" 2>/dev/null || true)"
          case "$n" in
            ''|*[!0-9]*) echo "::error title=Calibration CI bug::$f is missing or not a number: a bug in the check, not a calibration result."; exit 1;;
          esac
          echo "Calibration study $C complete: $n failing cell(s)."
          if [ "$n" -gt 0 ]; then
            echo "::error title=Calibration gate::Campaign $C is complete with $n confirmed failing cell(s). Summary: https://github.com/${{ github.repository }}/blob/$RESULTS_BRANCH/campaigns/$C/README.md"
            exit 1
          fi

  # Publishes whatever analyze produced, whatever its gate verdict (a red campaign is still
  # published), and dispatches the next wave. It does NOT run when analyze never reached the
  # handoff (a bug in the check): the wave is then not merged into the campaign, and the
  # shard artifacts (kept 3 days) are still on this run for a manual re-run of the failed jobs.
  publish:
    needs: [plan, roster, analyze]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.roster.result == 'success' && needs.roster.outputs.wave != '0' &&
      contains(fromJSON('["success","failure"]'), needs.analyze.result) && needs.analyze.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push to the calibration-results branch
      actions: write    # dispatch the next wave
    env:
      GH_TOKEN: ${{ github.token }}
      C: ${{ needs.plan.outputs.campaign }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: study-results
          path: handoff
      - name: Load the results branch and overlay the new results
        run: |
          git clone --depth 1 --branch "$RESULTS_BRANCH" "https://github.com/${{ github.repository }}.git" results \
            || mkdir -p results
          mkdir -p results/campaigns
          rm -rf "results/campaigns/$C"
          cp -r "handoff/campaigns/$C" results/campaigns/
          cp handoff/README.md results/README.md
      # The branch is always ONE commit (rebuilt and force-pushed): every wave
      # rewrites figures and totals, and keeping each version would grow the history
      # by megabytes per wave. Campaigns stay side by side as directories. Pushes made
      # with GITHUB_TOKEN start no workflows, so this never triggers CI.
      - name: Publish to the results branch
        run: |
          wave_no=$(wc -l < "results/campaigns/$C/runs.txt")
          cd results
          rm -rf .git
          git init -q -b "$RESULTS_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "EDI calibration study: campaign $C, wave $wave_no"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:$RESULTS_BRANCH"
      - name: Dispatch the next wave
        if: needs.analyze.outputs.complete != 'true'
        run: gh workflow run calibration-study.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}" -f campaign="$C"
      - name: Flag a bug in the check
        if: failure()
        run: |
          echo "::error title=Calibration CI bug::Publishing the results (push to the results branch or dispatch of the next wave) failed: a bug in the check or the environment, not a calibration result."
