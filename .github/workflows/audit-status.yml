# Audit status (after audit runs, at most once an hour, and daily 08:07 UTC): one table of the scheduled audits,
# grouped daily / weekly / monthly like their names in the Actions sidebar, with each audit's
# schedule, last run, result and open PR or issue. It is the body of one pinned issue labelled
# `audit-status`, edited in place, and the job summary. A second pinned issue (label
# `audit-decisions`, .github/scripts/audit_decisions.py) lists every audit's open decisions. No Claude.
# Script: .github/scripts/audit_status.py.
# Plan: R/package_metadata/new_feature_plans/v1_0_6/audit_jobs_framework.md (Part 1).
# workflow_run matches workflows by name: a new audit must be added to the list below
# (test_audit_status.py checks that every audit-<name>.yml caller is listed).

name: audit status

on:
  workflow_run:
    workflows:
      - "audit · daily · cran-watcher"
      - "audit · monthly · compiled-code"
      - "audit · monthly · dead-code"
      - "audit · monthly · dependency-license"
      - "audit · monthly · docs-claims"
      - "audit · monthly · numerical-robustness"
      - "audit · monthly · reference-check"
      - "audit · monthly · rpy-parity"
      - "audit · monthly · source-comment-rot"
      - "audit · monthly · thread-rng"
      - "audit · weekly · allowlist-hygiene"
      - "audit · weekly · ci-self-check"
      - "audit · weekly · code-duplication"
      - "audit · weekly · docs-scenarios"
      - "audit · weekly · generated-drift"
      - "audit · weekly · message-args"
      - "audit · weekly · news-version"
      - "audit · weekly · privacy"
      - "audit · weekly · python-vulns"
      - "audit · weekly · rd"
      - "audit · weekly · readme-drift"
      - "audit · weekly · results-freshness"
      - "audit · weekly · test-suite-health"
      - "audit · weekly · todo-status"
      - "audit · weekly · untested-code"
    types: [completed]
  schedule:
    - cron: "7 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    steps:
      # Debounce (owner request 2026-11-23): publish at most once an hour. A run started by an audit
      # finishing waits until 60 min after the last successful update; a later audit finishing meanwhile
      # cancels this run (concurrency above) and waits in its place, so the last audit's results are
      # still published. Manual dispatches and the daily cron publish at once.
      - name: Wait until an hour after the last update
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/audit-status.yml/runs?status=success&per_page=1" \
            -q '.workflow_runs[0].updated_at // empty' || true)
          [ -n "$last" ] || exit 0
          wait=$(( 3600 - ( $(date +%s) - $(date -d "$last" +%s) ) ))
          if [ "$wait" -gt 0 ]; then
            echo "Last update $last; waiting ${wait}s."
            sleep "$wait"
          fi
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            R/package_metadata/future_release_plans
            R/package_metadata/audits
      - name: Write the status table
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/audit_status.py --out "$RUNNER_TEMP/status.md" --publish
          cat "$RUNNER_TEMP/status.md" >> "$GITHUB_STEP_SUMMARY"
      # The owner's open decisions from every audit, in a second pinned issue (label audit-decisions).
      # Its own step, so a failure here never hides the status table.
      - name: Write the open-decisions list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin audit-notes:refs/remotes/origin/audit-notes
          python3 .github/scripts/audit_decisions.py --out "$RUNNER_TEMP/decisions.md" --publish
          { echo; echo "---"; echo; head -c 60000 "$RUNNER_TEMP/decisions.md"; } >> "$GITHUB_STEP_SUMMARY"
