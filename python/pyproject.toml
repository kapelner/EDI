[build-system]
# scipy-openblas32 is declared for every platform it actually ships a
# distribution for (not just Windows, despite what an earlier version of
# this comment said) as a pure fallback: CMake's find_package(BLAS) tries a
# system BLAS first on every platform and only falls back to this package if
# that fails (see CMakeLists.txt's BLAS discovery block) -- cibuildwheel's
# own before-all steps already install a real system BLAS on every
# wheel-build platform ([tool.cibuildwheel.linux/macos/windows] below), so
# this only actually gets used there on Windows (no
# system-package-manager/Accelerate equivalent). It's still needed here
# (beyond Windows) because a *source* install (`pip install edi_kernels`
# falling back to the sdist, or a local `pip install .`) has no cibuildwheel
# before-all step to rely on, and a bare Linux environment cannot be assumed
# to have a system BLAS installed either -- confirmed the hard way: a
# genuinely from-source sdist install on a stock ubuntu-latest GitHub
# Actions runner (no system BLAS preinstalled) failed outright with "No
# BLAS found ... and scipy-openblas32 isn't installed" on 2026-08-11, the
# day this was Windows-only-gated, because nothing in that source-install
# path pulls it in on non-Windows platforms.
# Must be declared here rather than only installed via cibuildwheel's
# before-build: `pip wheel`/`python -m build` create their own isolated
# PEP 517 build environment for the build backend (scikit_build_core.build)
# separate from cibuildwheel's own venv, so a before-build-only install is
# invisible to the CMake configure step that actually needs it
# (`import scipy_openblas32` against Python_EXECUTABLE failed with "not
# installed in <isolated build venv> either" on windows-latest CI on
# 2026-08-09, the same class of failure that later showed up unconditioned
# on Linux). Declaring it here lets pip's own isolated-build-env resolution
# install it where CMake will actually look, matching how numpy/scipy
# handle the same problem. Harmless when unused: it's a pure Python wheel
# containing a prebuilt OpenBLAS, small relative to the rest of this
# extension's build, and CMake still prefers a real system BLAS whenever
# find_package(BLAS) succeeds.
#
# The `platform_machine` marker below excludes 32-bit ARM (armv7l/armv6l)
# and any other architecture scipy-openblas32 has no wheel *or sdist* for
# on PyPI -- confirmed via piwheels.org's 1.0.0.post3 build logs (2026-08-17/
# 18): `pip install ... scipy-openblas32` failed with "Could not find a
# version that satisfies the requirement scipy-openblas32 (from versions:
# none)" on every piwheels build (Bullseye/py3.9, Bookworm/py3.11,
# Trixie/py3.13), which all build the sdist from scratch on real Raspberry
# Pi (armv7l) hardware. Without this marker, pip's own build-dependency
# resolution fails outright before CMake's configure step ever runs --
# before find_package(BLAS) gets a chance to find whatever system BLAS
# Raspberry Pi OS does or doesn't have preinstalled, and before
# CMakeLists.txt's own clear "No BLAS found ... install a system BLAS or
# `pip install scipy-openblas32`" FATAL_ERROR message (which correctly
# assumes scipy-openblas32 *can* be pip-installed) ever gets to fire. The
# listed values are every `platform_machine` scipy-openblas32 actually
# publishes a wheel for: x86_64 (Linux/macOS), aarch64 (Linux, 64-bit ARM),
# arm64 (macOS), AMD64 (Windows). See the `arm_sdist_build` job in
# .github/workflows/build-wheels.yml, which exercises this on real
# (QEMU-emulated) ARM.
requires = [
    "scikit-build-core>=1.0",
    "pybind11>=2.13",
    "scipy-openblas32; platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'aarch64' or platform_machine == 'arm64'",
]
build-backend = "scikit_build_core.build"

[project]
name = "edi_kernels"
version = "1.0.0.post5"
description = "Fast C++ statistical model-fitting kernels (GLM, GLMM, survival, count, ordinal, proportion models) from the EDI Experimental Design and Inference project -- pybind11 bindings, no R/Rcpp dependency"
readme = "README_PYPI.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
# Task-oriented keywords/classifiers so registry search (and anyone -- human
# or AI agent -- searching PyPI by what they're trying to do rather than by
# package name) can actually find this. "EDI" alone is hopeless as a search
# term: it overwhelmingly means Electronic Data Interchange, so the
# description above and keywords below deliberately spell out "Experimental
# Design and Inference" and the model families. No "License ::" classifier:
# PEP 639 forbids combining one with the SPDX `license` expression above.
keywords = [
    "statistics",
    "experimental-design",
    "statistical-inference",
    "randomization-inference",
    "clinical-trials",
    "glm",
    "glmm",
    "logistic-regression",
    "negative-binomial",
    "ordinal-regression",
    "survival-analysis",
    "eigen",
    "high-performance",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
# scipy-openblas32 is also a genuine *runtime* dependency, not just a build
# one (see [build-system] requires' comment for why it's needed at build
# time at all) -- only actually exercised by a from-source install (no
# cibuildwheel/auditwheel-style repair step to bundle the BLAS it links
# into the wheel itself, unlike every cibuildwheel-built wheel this project
# publishes, none of which need it present at runtime regardless of which
# BLAS they were built against). Declaring it for every platform it has a
# distribution for means every install on those platforms -- including the
# prebuilt wheels that never touch it -- carries a small (few-MB) unused
# dependency, a deliberate simplicity/size tradeoff over trying to make this
# build-path-conditional, which PEP 508 environment markers have no way to
# express (they condition on the installing environment, not on which
# pipeline produced the artifact). The `platform_machine` marker itself
# *is* expressible, though, and load-bearing here for a different reason
# than that build-path question: on 32-bit ARM (piwheels' Raspberry Pi
# build hardware -- see [build-system] requires' comment), scipy-openblas32
# has no distribution at all, so declaring it unconditionally would make
# `pip install edi_kernels` itself unresolvable there, independent of
# whether the from-source build that follows even needs it. See
# CMakeLists.txt's matching RPATH comment for the mechanism this makes
# actually work at import time.
dependencies = [
    "numpy>=1.24",
    "scipy-openblas32; platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'aarch64' or platform_machine == 'arm64'",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "scipy>=1.10"]

[tool.scikit-build]
minimum-version = "1.0"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/edi_kernels"]

# The sdist only packages python/'s own tree by default -- R/EDI/src (the
# kernel sources CMakeLists.txt's EDI_SRC_DIR points at) lives one level
# above the project root and is otherwise silently dropped, leaving a
# tarball that cannot be built from source at all (see
# python_bindings_package_spec.md's TODO-12: this shipped broken in
# 1.0.0, undetected, since CI only ever installed the wheels -- which build
# from a live checkout where ../R/EDI/src is a real sibling directory --
# never the sdist itself). force-include supports a source outside the
# project root (see scikit-build-core's SdistSettings.force_include
# docstring), so this copies R/EDI/src into vendor/EDI_src *inside the
# sdist only* -- never onto disk in a live checkout -- which
# CMakeLists.txt then prefers over ../R/EDI/src when present.
[tool.scikit-build.sdist.force-include]
"../R/EDI/src" = "vendor/EDI_src"

[tool.scikit-build.cmake.define]
EDI_PY_PORTABLE = "OFF"

# Wheels built by cibuildwheel (see below) leave this machine, so they must
# never bake in -march=native. This does NOT change the default for a plain
# local `pip install .` (still OFF, i.e. -march=native, for local-dev
# speed) -- cibuildwheel overrides it per-build via `config-settings`
# below, per this doc's own "Building portable wheels" checklist, which
# explicitly prefers that over flipping the pyproject.toml-wide default.
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = ["*-win32", "*-manylinux_i686", "*-musllinux*"]
build-verbosity = 1
config-settings = { "cmake.define.EDI_PY_PORTABLE" = "ON" }
test-command = "python -m pytest {project}/python/tests -q"
test-extras = ["test"]

[tool.cibuildwheel.linux]
# manylinux_2_28 (AlmaLinux 8 based) rather than the manylinux2014 default:
# R/EDI/src is built as C++20 (CMakeLists.txt CMAKE_CXX_STANDARD), which
# manylinux2014's stock devtoolset compiler doesn't reliably support.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# No BLAS is preinstalled in manylinux containers at all (see
# CMakeLists.txt's find_package(BLAS) comment) -- openblas-devel provides
# it via dnf (this image's package manager; NOT apt-get, which manylinux
# images don't have despite being a common copy-paste default elsewhere).
before-all = "dnf install -y openblas-devel || yum install -y openblas-devel"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
# BLAS: macOS ships the Accelerate framework, which CMake's FindBLAS
# detects automatically -- no install needed. libomp is separate (Apple
# clang doesn't bundle OpenMP); installed so OpenMP::OpenMP_CXX
# (CMakeLists.txt's optional find_package(OpenMP)) is actually found rather
# than silently building single-threaded.
# `brew untap aws/tap` first: GitHub's macos-latest image ships with this
# tap pre-installed and untrusted, which makes Homebrew's tap-trust check
# print a warning on *any* `brew install` regardless of what's being
# installed -- confirmed harmless (we never use anything from it), so
# removing it is cleaner than silencing the check globally via
# HOMEBREW_NO_REQUIRE_TAP_TRUST=1, which Homebrew's own message says is
# unsupported and slated for removal.
before-all = "brew untap aws/tap; brew install libomp"

[tool.cibuildwheel.windows]
# No system package manager and no Accelerate-equivalent BLAS on Windows --
# fall back to the pip-installable scipy-openblas32 package (see
# CMakeLists.txt's find_package(BLAS) fallback, same package numpy/scipy/
# scikit-learn's own cibuildwheel configs use for this exact problem).
# scipy-openblas32 is ALSO declared in [build-system] requires above -- that
# copy is what CMake's configure step sees (a separate, isolated PEP 517
# build env; see that comment for why a before-build-only install doesn't
# reach it). This before-build install is a second, deliberately redundant
# copy for a third, different venv: the one that runs repair-wheel-command
# below, which needs to `import scipy_openblas32` to find its DLL directory
# for delvewheel's --add-path (a plain `delvewheel repair` scans the wheel's
# DLL imports via the normal OS search path, which doesn't know about
# scipy_openblas32's install location -- that only gets added at runtime via
# its own __init__.py's os.add_dll_directory() call when the module is
# imported by user code, never by delvewheel's standalone scan -- confirmed
# by "FileNotFoundError: Unable to find library: libscipy_openblas.dll" on
# windows-latest CI on 2026-08-10).
before-build = "pip install delvewheel scipy-openblas32"
repair-wheel-command = "python -c \"import scipy_openblas32, subprocess, sys; subprocess.run(['delvewheel', 'repair', '--add-path', scipy_openblas32.get_lib_dir(), '-w', sys.argv[1], sys.argv[2]], check=True)\" {dest_dir} {wheel}"
