# Two independent packages (R/EDI and python/) share this repo, so coverage
# is split by flag rather than merged into one number -- see
# .github/workflows/test-coverage-R.yaml (flag: r) and
# test-coverage-python.yml (flag: python).

coverage:
  status:
    project:
      default: false
      r:
        flags: [r]
        target: auto
        # Pull requests upload only a PARTIAL `r` report (one shard: the fast tier
        # plus the bulk tests related to the change -- see
        # test-coverage-R-pr.yaml), so a project comparison against main would
        # read as a regression on every PR. Project `r` is therefore evaluated
        # only for commits on main/master, where test-coverage-R.yaml's full
        # measurement runs; patch `r` below is what PRs are judged on.
        branches:
          - main
          - master
      python:
        flags: [python]
        target: auto
    patch:
      default: false
      r:
        flags: [r]
        target: 80%
        threshold: 2%
        # Informational while the PR shard's test selection is being tuned: the
        # status always passes, with the patch percentage in its description.
        # Flip to false once a few real PRs show the selected tests cover the
        # changed lines reliably (contracts/coverage_test_writing.md section 7).
        informational: true
      python:
        flags: [python]
        target: 80%
        threshold: 2%

flags:
  r:
    paths:
      - R/EDI/R/
      - R/EDI/src/
    carryforward: true
  python:
    paths:
      - python/src/
      - python/cpp/
    carryforward: true

ignore:
  - "R/benchmark/**"
  - "R/package_metadata/**"
  - "R/profile/**"
  - "R/package_tests/**"
  - "python/tests/**"
  - "graft/**"
  # Confirmed covr/gcov measurement-attribution artifacts (not real gaps):
  # see full_test_coverage.md's "covr/composition-attribution gap" and
  # TODO-10 sections for how each was verified (dedicated-test assertions
  # pass despite 0%/NaN coverage). Patch-coverage on these files would
  # otherwise flag genuinely well-tested diffs; revisit only if covr/gcov
  # ever fixes the underlying attribution issue.
  - "R/EDI/R/inference_incidence_gcomp_abstract.R"
  - "R/EDI/R/inference_incidence_KK_gcomp_abstract.R"
  - "R/EDI/R/local_machine_tuning_harness.R"
  - "R/EDI/R/inference_ext_quantile_rand_ci.R"
  - "R/EDI/R/inference_all_abstract_quantile_rand_ci.R"
  - "R/EDI/src/r_seed_draw.h"
  - "R/EDI/R/inference_continuous_KK14_bai.R"
  - "R/EDI/R/inference_continuous_KK21_bai.R"

comment:
  layout: "header, diff, flags, files"
