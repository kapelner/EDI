url: https://kapelner.github.io/EDI/

template:
  bootstrap: 5
  math-rendering: mathjax

home:
  title: "EDI: Experimental Design and Inference"

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

articles:
- title: Package Concepts
  navbar: Articles
  desc: >
    Cross-cutting reference material that individual class/function
    documentation links back into, rather than repeating inline.
  contents:
  - notation-glossary
  - reproducibility
  - backend-contracts
  - validation-evidence
  - extending-edi

reference:

- title: "Package Overview"
  contents:
  - EDI

- title: "Experimental Designs: Fixed-Sample"
  desc: >
    Designs where the sample size n is fixed at construction and treatment
    assignment is drawn for all n subjects at once, either up front or via
    assign_w_to_all_subjects() once covariates are recorded.
  contents:
  - DesignFixed
  - DesignFixedBernoulli
  - DesignFixediBCRD
  - DesignFixedFactorial
  - DesignFixedBlocking
  - DesignFixedCluster
  - DesignFixedBlockedCluster
  - DesignFixedBinaryMatch
  - DesignFixedMatchingGreedyPairSwitching
  - DesignFixedGreedy
  - DesignFixedGreedyDOptimal
  - DesignFixedOptimalBlocks
  - DesignFixedRerandomization

- title: "Experimental Designs: Sequential (One-by-One)"
  desc: >
    Designs where subjects arrive one at a time and treatment is assigned on
    arrival via add_one_subject_to_experiment_and_assign(), before the next
    subject's covariates are known. This includes the KK "matching-on-the-fly"
    family, which builds matched pairs from the accruing subject stream.
  contents:
  - DesignSeqOneByOne
  - DesignSeqOneByOneBernoulli
  - DesignSeqOneByOneiBCRD
  - DesignSeqOneByOneUrn
  - DesignSeqOneByOneEfron
  - DesignSeqOneByOneAtkinson
  - DesignSeqOneByOnePocockSimon
  - DesignSeqOneByOneRandomBlockSize
  - DesignSeqOneByOneSPBR
  - DesignSeqOneByOneKK14
  - DesignSeqOneByOneKK21
  - DesignSeqOneByOneKK21stepwise

- title: "Experimental Designs: Observational"
  desc: >
    Designs for already-observed (non-randomized) treatment assignments --
    the design object acts as a data container with matched-pair/blocking
    structure, but does not itself draw any randomization.
  contents:
  - ObservationalDesign
  - ObservationalDesignBlocks
  - ObservationalDesignMatching

- title: "Design: Custom Extensions"
  desc: Base classes for plugging in a user-defined assignment/drawing rule.
  contents:
  - DesignFixedCustom
  - DesignCustomSequential

- title: "Design: Infrastructure"
  desc: >
    Abstract bases, capability components, and shared machinery -- not
    typically constructed directly. See vignette("backend-contracts") and
    fix_design_hierarchy.md for the capability/component model these
    implement.
  contents:
  - Design
  - DesignBlocking
  - DesignMatching

- title: "Inference: Continuous Outcomes"
  contents:
  - matches("^InferenceContin")
  - InferenceBaiAdjustedT
  - InferenceBaiAdjustedTKK14
  - InferenceBaiAdjustedTKK21

- title: "Inference: Incidence (Binary) Outcomes"
  contents:
  - matches("^InferenceIncid")

- title: "Inference: Count Outcomes"
  contents:
  - matches("^InferenceCount")

- title: "Inference: Proportion Outcomes"
  contents:
  - matches("^InferenceProp")

- title: "Inference: Ordinal Outcomes"
  contents:
  - matches("^InferenceOrdinal")

- title: "Inference: Survival Outcomes"
  contents:
  - matches("^InferenceSurvival")

- title: "Inference: Cross-Cutting / General"
  desc: >
    Estimators and coordinators that work across more than one response
    type, rather than being tied to a single outcome family.
  contents:
  - InferenceAllKKMeanDiffIVWC
  - InferenceAllKKWilcoxIVWC
  - InferenceAllSimpleMeanDiff
  - InferenceAllSimpleMeanDiffPooledVar
  - InferenceAllSimpleWilcox
  - InferenceSuite

- title: "Inference: Custom Extensions"
  desc: Base classes for plugging in a user-defined asymptotic/bootstrap/randomization estimator.
  contents:
  - InferenceCustomAsymp
  - InferenceCustomBoot
  - InferenceCustomRand

- title: "Inference: Infrastructure"
  desc: >
    Abstract bases, resampling/likelihood mixins, and matched-design (KK)
    family bases -- not typically constructed directly. See
    vignette("reproducibility") for the resampling mixins' RNG/seed
    conventions and vignette("notation-glossary") for shared symbols.
  contents:
  - Inference
  - InferenceAsymp
  - InferenceAsympLik
  - InferenceRand
  - InferenceRandBootstrap
  - InferenceRandBootstrapCI
  - InferenceNonParamBootstrap
  - InferenceParamBootstrap
  - InferenceBayesianBootstrap
  - InferenceJackknife
  - InferenceCountLikelihood
  - InferenceKKPassThroughCompound
  - InferenceMLEorKMSummaryTable
  - InferenceAbstractQuantileRandCI
  - InferenceAbstractKKCondLogitGLMM
  - InferenceAbstractKKCondLogitGLMMOneLik
  - InferenceAbstractKKLWACoxIVWC
  - InferenceAbstractKKLWACoxOneLik
  - InferenceAbstractKKMarginalIncid
  - InferenceAbstractKKModifiedPoisson
  - InferenceAbstractKKOrdinalCLMM
  - InferenceAbstractKKQuantileRegrIVWC
  - InferenceAbstractKKQuantileRegrOneLik
  - InferenceAbstractKKSurvivalRankRegrIVWC
  - InferenceAbstractKKWeibullFrailtyIVWC
  - InferenceAbstractKKWeibullFrailtyOneLik

- title: "Simulation Framework"
  desc: >
    Monte Carlo simulation for comparing designs and inference methods, and
    for computing the coverage_pval/size_pval calibration diagnostics
    documented in vignette("validation-evidence").
  contents:
  - SimulationFramework
  - SimulationFrameworkReport
  - generate_covariate_dataset
  - transform_cont_y_based_on_response_type

