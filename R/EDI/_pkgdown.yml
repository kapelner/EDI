- title: "Dispatch Policy Configuration"
  desc: >
    Runtime-tunable policies governing optimizer choice, cold/warm-start
    heuristics, and parallel/serial dispatch across inference classes. See
    each get_*/set_* pair's own documentation for the built-in defaults and
    override mechanism.
  contents:
  - matches("_dispatch_policy$")
  - set_num_cores
  - unset_num_cores

